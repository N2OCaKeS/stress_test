version: "3.7"
services:
  db:
      image: postgres:15
      container_name: db_app
      command: -p 5455
      expose:
        - 5455
      environment: 
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
      volumes:
        - dbdata:/var/lib/postgresql/data
  
  redis:
    image: gca-cr-proxy.artifactory.astralinux.ru/redis:7
    container_name: redis_app
    command: --port 5370
    expose:
      - 5370
  
  app:
    build:
      context: .
    env_file:
      - .env
    container_name: fastapi_app
    command: ["/fastapi_app/docker/app.sh"]
    ports:
      - 9999:8000
    depends_on:
      - db
      - redis
    volumes: 
      - /home/u/ilo.json:/fastapi_app/src/ilo/ilo.json
      - /home/u/tokens.json:/fastapi_app/src/add_tuning/env.json
    extra_hosts:
      - "host.docker.internal:host-gateway" 

  celery:
    build:
      context: .
    env_file:
      - .env
    container_name: celery_app
    command: ["/fastapi_app/docker/celery.sh", "celery"]
    depends_on:
      - redis
    volumes: 
      - /home/u/ilo.json:/fastapi_app/src/ilo/ilo.json

  flower:
    build:
      context: .
    env_file:
      - .env
    container_name: flower_app
    command: ["/fastapi_app/docker/celery.sh", "flower"]
    depends_on:
      - redis
      - celery
    ports:
      - 8888:5555

volumes:
  dbdata: