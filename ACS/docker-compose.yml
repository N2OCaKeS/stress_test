version: "3.7"
services:
  db:
      image: postgres:15
      container_name: db_app
      command: -p 5432
      expose:
        - 5432
      environment: 
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres
      volumes:
        - dbdata:/var/lib/postgresql/data
  
  app:
    build:
      context: .
    env_file:
      - .env
    container_name: fastapi_app
    command: ["/fastapi_app/docker/app.sh"]
    ports:
      - 9999:8000
    depends_on:
      - db

volumes:
  dbdata:


