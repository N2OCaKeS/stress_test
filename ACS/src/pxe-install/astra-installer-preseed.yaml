# Согласие с лицензией
license: true

timezone: Europe/Moscow

layout_switch_keys:
  - alt_shift_toggle

layouts:
  all:
    - ru
    - us

locales:
  - ru_RU

user:
  username: u
  password: 12345678
  grub-password: 12345678

additional_users: None

host:
  generate_sub_name: false
  hostname: LowServer

kernel-package: linux-6.1-generic

repo_source: config
repos:
  debootstrap:
    name:
      default: Installation repository
    url: deb https://releases.devos.astralinux.ru/frozen/1.8/1.8.2/1.8.2.8/installation/ 1.8_x86-64 main contrib non-free non-free-firmware
  sources:
    - repo:
        name:
          default: 'Extended repository'
        url: '#deb https://releases.devos.astralinux.ru/frozen/1.8/1.8.2/1.8.2.8/extended-repository/ 1.8_x86-64 main contrib non-free non-free-firmware'

storage:
  config: '# That section could be wrong, please be careful with usage

    # System bootloader configuration

    bootloader --location=none

    # Disk partitioning information

    part /boot/efi --fstype="efi" --ondisk=nvme0n1 --size=600 --fsoptions="defaults,uid=0,gid=0,umask=077,shortname=winnt"

    part / --asprimary --fstype="ext4" --size=2096551 --label=system

    '

tasks:
  - Fly-ssh
  - Base
  - Internet
  - hidden

mode: 0

features: []

packages: ''




