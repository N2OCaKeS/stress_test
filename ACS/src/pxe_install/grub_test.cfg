if loadfont $prefix/font.pf2 ; then
  set gfxmode=800x600
  set gfxpayload=keep
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod gfxterm
  insmod png
  terminal_output gfxterm
fi

set timeout=10

menuentry "Astra Linux" {
        set gfxpayload=keep
        linux    linux quiet modprobe.blacklist=evbug astra_install=1 \
                 url=http://10.177.103.202/LowServer/preseed.cfg \
                 auto=true priority=critical debian-installer/locale=en_US console-keymaps-at/keymap=ru \
                 astra-license/license=true interface=auto netcfg/dhcp_timeout=60 network-console/enable=false
        initrd   initrd.gz
}
