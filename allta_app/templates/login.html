<html>
  <head>
    <title>ALLTA</title>
    <link rel="icon" href="http://10.177.103.10:8000/static/fav_ic_48.png">
    <style>
      body {
        background: #00121a;
        color: #333;
        font-family: 'Arial', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        position: relative; /* Добавляем относительное позиционирование для body */
      }
      h1 {
        font-size: 2.2em;
        color: #c8c9c9;
        text-align: center;
        padding: 20px 0;
      }
      form {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin: 0 auto;
        max-width: 300px;
      }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 15px;
        border: 1px solid #777777;
        border-radius: 4px;
        font-size: 1em;
        background-color: #333; /* Цвет фона формы */
        padding: 20px; /* Внутренние отступы для формы */
        border-radius: 8px; /* Закругленные углы */
        color: #c8c9c9;
      }
      input[type="submit"] {
        background: #ff7b00;
        color: #c8c9c9;
        padding: 15px;
        border: none;
        border-radius: 4px;
        font-size: 1em;
      }
      p {
        color: red;
        text-align: center;
      }
      .top-left {
        position: absolute; /* Абсолютное позиционирование */
        top: 0; /* Верхний край */
        left: 0; /* Левый край */
        width: 100%; /* Ширина на всю страницу */
        height: 30px; /* Фиксированная высота */
        padding: 0; /* Убираем внутренние отступы */
        background: linear-gradient(to right, #ff7b00, #002534, #00121a); /* Градиент для фона */
        color: #00121a;
        display: flex; /* Используем flexbox */
        justify-content: left; /* Центрируем по горизонтали */
        align-items: center; /* Центрируем по вертикали */
      }
      .top-left h3 {
        font-size: 25px; /* размер шрифта */
        font-weight: normal; /* Нормальный вес шрифта */
      }
    </style>
  </head>
  <body>
    <div class="top-left">
      <h3>ALLTA</h3>
    </div>
    <div class="login-container">
      <h1>Вход</h1>
      <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Имя пользователя" />
        <input type="password" name="password" placeholder="Пароль" />
        <input type="submit" value="Войти" />
      </form>
      {% if error %}
        <p>{{ error }}</p>
      {% endif %}
    </div>
  </body>
</html>
