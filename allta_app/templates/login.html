<html>
  <head>
    <title>ALLTA</title>
    <link rel="icon" href="http://10.177.103.10:8000/static/fav_or.png">
    <style>
      body {
        background: #fafafa;
        color: #333;
        font-family: 'Arial', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      h1 {
        font-size: 2.2em;
        color: #4a4a4a;
        text-align: center;
        padding: 20px 0;
      }
      form {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin: 0 auto;
        max-width: 300px;
      }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1em;
      }
      input[type="submit"] {
        background: #4a90e2;
        color: #fff;
        padding: 15px;
        border: none;
        border-radius: 4px;
        font-size: 1em;
      }
      p {
        color: red;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1>Вход</h1>
      <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Имя пользователя" />
        <input type="password" name="password" placeholder="Пароль" />
        <input type="submit" value="Войти" />
      </form>
      {% if error %}
        <p>{{ error }}</p>
      {% endif %}
    </div>
  </body>
</html>
