<html>
  <head>
    <title>ALLTA</title>
    <link rel="icon" href="http://10.177.103.10:8000/static/fav_ic_48.png">
    <style>
      body { background:#00121a; color:#333; font-family:'Arial',sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; position:relative; }
      h1 { font-size:2.2em; color:#c8c9c9; text-align:center; padding:20px 0; }
      form { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px; margin:0 auto; max-width:300px; }
      input[type="text"], input[type="password"] { width:100%; padding:15px; border:1px solid #777777; border-radius:4px; font-size:1em; background-color:#333; padding:20px; border-radius:8px; color:#c8c9c9; }
      input[type="submit"] { background:#ff7b00; color:#c8c9c9; padding:15px; border:none; border-radius:4px; font-size:1em; }
      p { color:red; text-align:center; }
      .top-left { position:absolute; top:0; left:0; width:100%; height:30px; padding:0; background:linear-gradient(to right,#ff7b00,#002534,#00121a); color:#00121a; display:flex; justify-content:left; align-items:center; }
      .top-left h3 { font-size:25px; font-weight:normal; }
    </style>
  </head>
  <body>
    <div class="top-left"><h3>ALLTA</h3></div>
    <div class="login-container">
      <h1>Вход</h1>
      <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Имя пользователя" />
        <input type="password" name="password" placeholder="Пароль" />
        <input type="submit" value="Войти" />
      </form>
      {% if error %}
        <p>{{ error }}</p>
      {% endif %}
    </div>

    <script id="popup-json" type="application/json">{{ (popup or '')|tojson }}</script>
    <script>
      (function () {
        var node = document.getElementById('popup-json');
        if (!node) return;
        try {
          var msg = JSON.parse(node.textContent || '""');
          if (msg) alert(msg);
        } catch (_) { /* ignore */ }
      })();
    </script>
  </body>
</html>
