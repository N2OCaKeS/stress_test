<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лог стенда {{ stand_num }}</title>
    <link rel="icon" href="http://10.177.103.10:8000/static/fav_ic_48.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
        }
        
        .log-container {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .log-header {
            background-color: #252526;
            padding: 12px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .log-header h3 {
            margin: 0;
            color: #ff7b00;
            font-family: 'Segoe UI', sans-serif;
        }
        
        .log-controls {
            display: flex;
            gap: 10px;
        }
        
        .log-controls button {
            background-color: #3e3e42;
            border: none;
            color: #d4d4d4;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .log-controls button:hover {
            background-color: #ff7b00;
            color: white;
        }
        
        /* Блок выбора лога */
        .log-selector {
            background-color: #252526;
            padding: 10px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .log-selector label {
            color: #ff7b00;
            font-weight: bold;
            margin: 0;
        }
        
        .log-selector select {
            background-color: #3e3e42;
            border: 1px solid #ff7b00;
            border-radius: 4px;
            color: #d4d4d4;
            padding: 6px 12px;
            min-width: 350px;
        }
        
        .log-selector select:hover {
            border-color: #ff9b2a;
        }
        
        .log-selector .log-info {
            color: #858585;
            font-size: 12px;
        }
        
        .current-log-badge {
            background-color: #ff7b00;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
        }
        
        /* Панель поиска и фильтрации */
        .log-search-bar {
            padding: 10px 20px;
            background-color: #252526;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .log-search-bar input {
            width: 100%;
            padding: 6px 12px;
            background-color: #3e3e42;
            border: 1px solid #ff7b00;
            border-radius: 4px;
            color: #d4d4d4;
        }
        
        .log-search-bar input:focus {
            outline: none;
            border-color: #ff9b2a;
            box-shadow: 0 0 5px rgba(255, 123, 0, 0.3);
        }
        
        .log-search-bar select {
            padding: 6px 12px;
            background-color: #3e3e42;
            border: 1px solid #ff7b00;
            border-radius: 4px;
            color: #d4d4d4;
        }
        
        .log-search-bar button {
            padding: 6px 12px;
            background-color: #3e3e42;
            border: none;
            border-radius: 4px;
            color: #d4d4d4;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .log-search-bar button:hover {
            background-color: #ff7b00;
            color: white;
        }
        
        .log-content {
            background-color: #1e1e1e;
            padding: 8px;
            font-size: 16px;
            line-height: 1.2;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-x: auto;
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            font-family: 'Courier New', 'Consolas', monospace;
        }
        
        .log-line {
            display: flex;
            flex-direction: row;
            padding: 0;
            margin: 0;
            border-left: 3px solid transparent;
            min-height: auto;
        }
        
        .log-line:hover {
            background-color: #2a2a2a;
            border-left-color: #ff7b00;
        }
        
        .log-pre {
            margin: 0;
            padding: 8px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', 'Consolas', monospace;
            font-size: 15px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-x: auto;
        }

        .log-line-number {
            display: inline-block;
            width: 45px;
            color: #858585;
            user-select: none;
            margin-right: 15px;
            text-align: right;
        }
        
        .log-line-text {
            display: inline;
            color: #d4d4d4;
            font-size: 14px;
            line-height: 18px;  
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
        }
        
        .badge-info {
            background-color: #ff7b00;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }
        
        footer {
            text-align: center;
            padding: 15px;
            color: #858585;
            font-size: 12px;
            border-top: 1px solid #3e3e42;
        }
        
        mark {
            background-color: #ff7b00;
            color: white;
            padding: 0 2px;
            border-radius: 2px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #858585;
        }
        
        /* Стили для скроллбара */
        .log-content::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        .log-content::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        
        .log-content::-webkit-scrollbar-thumb {
            background: #ff7b00;
            border-radius: 4px;
        }
        
        .log-content::-webkit-scrollbar-thumb:hover {
            background: #ff9b2a;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="log-container">
            <div class="log-header">
                <div>
                    <h3><i class="fas fa-terminal"></i> Лог стенда {{ stand_num }}</h3>
                    <span class="badge-info" id="logSize">0 символов</span>
                </div>
                <div class="log-controls">
                    <button onclick="copyLog()" title="Копировать лог">
                        <i class="fas fa-copy"></i> Копировать
                    </button>
                    <button onclick="downloadLog()" title="Скачать лог">
                        <i class="fas fa-download"></i> Скачать
                    </button>
                    <button onclick="window.location.reload()" title="Обновить">
                        <i class="fas fa-sync-alt"></i> Обновить
                    </button>
                    <button onclick="window.close()" title="Закрыть">
                        <i class="fas fa-times"></i> Закрыть
                    </button>
                </div>
            </div>
            
            <!-- Выбор лога -->
            <div class="log-selector">
                <label><i class="fas fa-folder-open"></i> Выберите лог:</label>
                <select id="logSelect" onchange="switchLog()">
                    <option value="main" selected>📋 Основной лог стенда {{ stand_num }}</option>
                </select>
                <div class="log-info" id="logInfo"></div>
            </div>
            
            <!-- Панель поиска и фильтрации -->
            <div class="log-search-bar">
                <div style="flex: 1; min-width: 200px; display: flex; gap: 5px;">
                    <input type="text" id="searchInput" placeholder="🔍 Поиск по логу..." 
                        style="flex: 1; padding: 6px 12px; background-color: #3e3e42; border: 1px solid #ff7b00; border-radius: 4px; color: #d4d4d4;">
                    <span id="searchCounter" style="color: #858585; font-size: 12px; padding: 6px;">0/0</span>
                    <button onclick="searchPrev()" title="Предыдущее (Shift+Enter)" 
                            style="background: #3e3e42; border: none; color: #d4d4d4; padding: 4px 10px; border-radius: 4px; cursor: pointer;">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                    <button onclick="searchNext()" title="Следующее (Enter)" 
                            style="background: #3e3e42; border: none; color: #d4d4d4; padding: 4px 10px; border-radius: 4px; cursor: pointer;">
                        <i class="fas fa-arrow-down"></i>
                    </button>
                </div>
                <div>
                    <select id="filterSelect">
                        <option value="all">📋 Все строки</option>
                        <option value="error">❌ Только ошибки</option>
                        <option value="warning">⚠️ Только предупреждения</option>
                        <option value="success">✅ Только успехи</option>
                        <option value="task">📦 Задачи</option>
                        <option value="command">💻 Команды</option>
                        <option value="kernel">🐧 Ядра</option>
                        <option value="test">🧪 Тесты</option>
                        <option value="iteration">🔄 Завершённые тесты</option>
                    </select>
                </div>
                <div>
                    <button onclick="clearFilters()">
                        <i class="fas fa-times"></i> Сбросить
                    </button>
                </div>
            </div>
                
                </div>
            </div>
            
            <div class="log-content" id="logContent">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i> Загрузка лога...
                </div>
            </div>
            <footer>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <i class="fas fa-info-circle"></i> Автообновление отключено
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button onclick="scrollToTop()" 
                                title="В начало (Ctrl+Home)" 
                                style="background: #3e3e42; border: none; color: #d4d4d4; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.2s;"
                                onmouseover="this.style.backgroundColor='#ff7b00'; this.style.color='white'"
                                onmouseout="this.style.backgroundColor='#3e3e42'; this.style.color='#d4d4d4'">
                            <i class="fas fa-angle-double-up"></i> Начало
                        </button>
                        <button onclick="scrollToBottom()" 
                                title="В конец (Ctrl+End)" 
                                style="background: #3e3e42; border: none; color: #d4d4d4; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.2s;"
                                onmouseover="this.style.backgroundColor='#ff7b00'; this.style.color='white'"
                                onmouseout="this.style.backgroundColor='#3e3e42'; this.style.color='#d4d4d4'">
                            <i class="fas fa-angle-double-down"></i> Конец
                        </button>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    
    <script>
        let autoRefreshInterval;
        let currentStand = "{{ stand_num }}";
        let currentLogType = 'main';
        let currentLogFile = null;
        let currentSearchTerm = '';
        let currentFilter = 'all';
        let fullLogLines = [];
        let availableLogs = [];
        let currentSearchMatches = [];
        let currentSearchIndex = -1;
        
        // Загружаем список доступных логов
        async function loadLogList() {
            try {
                const response = await fetch(`/rest/api/stand${currentStand}/log-files`);
                const data = await response.json();
                
                if (response.ok && data.test_logs) {
                    availableLogs = data.test_logs;
                    const select = document.getElementById('logSelect');
                    
                    // Добавляем тестовые логи в выпадающий список
                    data.test_logs.forEach(log => {
                        const option = document.createElement('option');
                        option.value = `test_${log.test_num}`;
                        option.textContent = `🧪 Тест ${log.test_num} (${log.size_human}, ${log.modified})`;
                        option.dataset.filename = log.filename;
                        select.appendChild(option);
                    });
                    
                    // Обновляем информацию
                    const infoDiv = document.getElementById('logInfo');
                    if (data.count > 0) {
                        infoDiv.innerHTML = `<i class="fas fa-database"></i> Доступно ${data.count} логов тестов`;
                    }
                }
            } catch (error) {
                console.error('Error loading log list:', error);
            }
        }
        
        async function switchLog() {
            const select = document.getElementById('logSelect');
            const selectedValue = select.value;
            
            // Показываем индикатор загрузки
            document.getElementById('logContent').innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i> Загрузка лога...</div>';
            
            if (selectedValue === 'main') {
                currentLogType = 'main';
                currentLogFile = null;
                await loadMainLog();
            } else if (selectedValue.startsWith('test_')) {
                currentLogType = 'test';
                const testNum = selectedValue.split('_')[1];
                const log = availableLogs.find(l => l.test_num == testNum);
                if (log) {
                    currentLogFile = log.filename;
                    await loadTestLog(log.filename);
                }
            }
        }
        
        async function loadMainLog() {
            try {
                const response = await fetch(`/rest/api/stand${currentStand}/log`);
                const data = await response.json();
                
                if (response.ok) {
                    fullLogLines = data.log.split('\n');
                    document.getElementById('logSize').textContent = `${data.size} символов`;
                    applyFiltersAndSearch();
                } else {
                    fullLogLines = ['Ошибка загрузки лога: ' + (data.error || 'Неизвестная ошибка')];
                    applyFiltersAndSearch();
                }
            } catch (error) {
                console.error('Error loading main log:', error);
                fullLogLines = ['Ошибка загрузки лога: ' + error.message];
                applyFiltersAndSearch();
            }
        }
        
        async function loadTestLog(filename) {
            try {
                const response = await fetch(`/rest/api/stand${currentStand}/log-file/${filename}`);
                const data = await response.json();
                
                if (response.ok) {
                    fullLogLines = data.log.split('\n');
                    document.getElementById('logSize').textContent = `${data.size} символов`;
                    applyFiltersAndSearch();
                } else {
                    fullLogLines = ['Ошибка загрузки лога: ' + (data.error || 'Неизвестная ошибка')];
                    applyFiltersAndSearch();
                }
            } catch (error) {
                console.error('Error loading test log:', error);
                fullLogLines = ['Ошибка загрузки лога: ' + error.message];
                applyFiltersAndSearch();
            }
        }
        
        function applyFiltersAndSearch() {
            let filteredLines = [...fullLogLines];
            
            // Применяем фильтр
            if (currentFilter !== 'all') {
                if (currentFilter === 'iteration') {
                    // Специальная логика для итераций: показываем блоки с итерациями
                    filteredLines = filterIterationBlocks(filteredLines);
                } else {
                    filteredLines = filteredLines.filter(line => {
                        const lowerLine = line.toLowerCase();
                        switch (currentFilter) {
                            case 'error':
                                return lowerLine.includes('error') || lowerLine.includes('failed') || lowerLine.includes('traceback');
                            case 'warning':
                                return lowerLine.includes('warning');
                            case 'success':
                                return lowerLine.includes('success') || lowerLine.includes('done') || lowerLine.includes('completed');
                            case 'task':
                                return lowerLine.includes('task:');
                            case 'command':
                                return lowerLine.includes('command:');
                            case 'kernel':
                                return lowerLine.includes('kernel:');
                            case 'test':
                                return lowerLine.includes('тест:');
                            default:
                                return true;
                        }
                    });
                }
            }
            
            // Применяем поиск
            // Фильтр строк - сейчас не используется
            // if (currentSearchTerm) {
            //     const searchLower = currentSearchTerm.toLowerCase();
            //     filteredLines = filteredLines.filter(line => line.toLowerCase().includes(searchLower));
            // }
            
            updateLogDisplay(filteredLines);
            
        }

        // Функция для фильтрации завершённых итераций
        function filterIterationBlocks(lines) {
            const result = [];
            let inIterationBlock = false;
            let iterationCompleted = false;
            let currentBlock = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                // Начало блока итерации
                if (line.includes('Итерация №') || line.includes('Iteration')) {
                    // Если предыдущий блок был завершён, добавляем его в результат
                    if (inIterationBlock && iterationCompleted) {
                        result.push(...currentBlock);
                    }
                    
                    // Начинаем новый блок
                    inIterationBlock = true;
                    iterationCompleted = false;
                    currentBlock = [line];
                }
                // Если мы внутри блока итерации
                else if (inIterationBlock) {
                    currentBlock.push(line);
                    
                    // Проверяем, завершена ли итерация
                    if (line.includes('Выполнен') || line.includes('Completed')) {
                        iterationCompleted = true;
                    }
                    
                    // Конец блока — когда встречаем следующую итерацию или конец файла
                    if (i + 1 < lines.length && 
                        (lines[i + 1].includes('Итерация №') || lines[i + 1].includes('Iteration'))) {
                        inIterationBlock = false;
                        if (iterationCompleted) {
                            result.push(...currentBlock);
                        }
                        currentBlock = [];
                    }
                }
            }
            
            // Добавляем последний блок, если он завершён
            if (inIterationBlock && iterationCompleted) {
                result.push(...currentBlock);
            }
            
            return result;
        }
        
        function updateLogDisplay(lines) {
            const container = document.getElementById('logContent');
            
            if (lines.length === 0) {
                container.innerHTML = '<div class="empty-state">📄 Ничего не найдено</div>';
                return;
            }
            
            // Фильтруем пустые строки (раскомментировать если нужно удалять)
            // const nonEmptyLines = lines.filter(line => line.trim() !== '');
            const nonEmptyLines = lines;
            
            if (nonEmptyLines.length === 0) {
                container.innerHTML = '<div class="empty-state">📄 Ничего не найдено</div>';
                return;
            }
            
            // Добавляем номера строк
            const numberedLines = nonEmptyLines.map((line, index) => {
                const lineNumber = (index + 1).toString().padStart(4, ' ');
                const escapedLine = escapeHtml(line);
                return `<span class="log-line-number">${lineNumber}</span> ${escapedLine}`;
            }).join('\n');
            
            container.innerHTML = `<pre class="log-pre">${numberedLines}</pre>`;
            
            // Применяем цветовую подсветку
            highlightPreLines();
            
            // Если есть активный поиск, применяем его
            if (currentSearchTerm && currentSearchTerm !== '') {
                performSearch();
            }
        }
             
        

        function highlightPreLines() {
            const pre = document.querySelector('.log-pre');
            if (!pre) return;
            
            const lines = pre.innerHTML.split('\n');
            const coloredLines = lines.map(line => {
                let coloredLine = line;
                if (line.includes('ERROR') || line.includes('Failed') || line.includes('Traceback')) {
                    coloredLine = `<span style="color: #f48771">${line}</span>`;
                } else if (line.includes('WARNING') || line.includes('Warning')) {
                    coloredLine = `<span style="color: #dcdcaa">${line}</span>`;
                } else if (line.includes('SUCCESS') || line.includes('Done') || line.includes('Completed')) {
                    coloredLine = `<span style="color: #6a9955">${line}</span>`;
                } else if (line.includes('Task:')) {
                    coloredLine = `<span style="color: #9cdcfe">${line}</span>`;
                } else if (line.includes('Command:')) {
                    coloredLine = `<span style="color: #ce9178">${line}</span>`;
                } else if (line.includes('Kernel:')) {
                    coloredLine = `<span style="color: #4ec9b0">${line}</span>`;
                } else if (line.includes('Тест:')) {
                    coloredLine = `<span style="color: #c586c0">${line}</span>`;
                }
                return coloredLine;
            }).join('\n');
            
            pre.innerHTML = coloredLines;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
        
        function copyLog() {
            const text = fullLogLines.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                showToast('Лог скопирован в буфер обмена');
            }).catch(() => {
                alert('Не удалось скопировать лог');
            });
        }
        
        function downloadLog() {
            const text = fullLogLines.join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentLogType === 'main' ? `stand_${currentStand}_main_log.txt` : currentLogFile;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('Лог скачан');
        }
        
        function clearFilters() {
            currentSearchTerm = '';
            currentFilter = 'all';
            document.getElementById('searchInput').value = '';
            document.getElementById('filterSelect').value = 'all';
            applyFiltersAndSearch();
            showToast('Фильтры сброшены');
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.right = '20px';
            toast.style.backgroundColor = '#ff7b00';
            toast.style.color = 'white';
            toast.style.padding = '10px 20px';
            toast.style.borderRadius = '5px';
            toast.style.zIndex = '1000';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }
        
        function startAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
                if (currentLogType === 'main') {
                    loadMainLog();
                } else if (currentLogFile) {
                    loadTestLog(currentLogFile);
                }
            }, 5000);
        }
        
        // Навешиваем обработчики
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearchTerm = e.target.value;
            applyFiltersAndSearch();
        });
        
        // При изменении фильтра
        document.getElementById('filterSelect').addEventListener('change', (e) => {
            currentFilter = e.target.value;
            applyFiltersAndSearch();
            
            // Показываем подсказку о количестве найденных итераций
            if (currentFilter === 'iteration') {
                // Считаем количество завершённых итераций в исходном логе
                const completedCount = countCompletedIterations(fullLogLines);
                showToast(`Найдено ${completedCount} завершённых итераций`, 'info');
            }
        });

        // Функция подсчёта завершённых итераций
        function countCompletedIterations(lines) {
            let count = 0;
            let inIteration = false;
            let completed = false;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                if (line.includes('Итерация №') || line.includes('Iteration')) {
                    if (inIteration && completed) {
                        count++;
                    }
                    inIteration = true;
                    completed = false;
                } else if (inIteration && (line.includes('Выполнен') || line.includes('Completed'))) {
                    completed = true;
                }
            }
            
            if (inIteration && completed) {
                count++;
            }
            
            return count;
        }

        function scrollToTop() {
            const logContent = document.querySelector('.log-content');
            if (logContent) {
                logContent.scrollTop = 0;
            }
        }

        function scrollToBottom() {
            const logContent = document.querySelector('.log-content');
            if (logContent) {
                logContent.scrollTop = logContent.scrollHeight;
            }
        }

        // Поиск с подсветкой и навигацией
        function performSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput.value.trim();
            
            if (searchTerm === '') {
                // Очищаем подсветку
                clearSearchHighlights();
                currentSearchMatches = [];
                currentSearchIndex = -1;
                updateSearchCounter();
                return;
            }
            
            currentSearchTerm = searchTerm;
            
            // Находим все совпадения
            const container = document.getElementById('logContent');
            const pre = container.querySelector('.log-pre');
            if (!pre) return;
            
            // Получаем все строки
            const lines = pre.innerHTML.split('\n');
            const regex = new RegExp(`(${escapeRegex(searchTerm)})`, 'gi');
            
            // Подсвечиваем все совпадения
            const highlightedLines = lines.map(line => {
                return line.replace(regex, '<mark class="search-highlight">$1</mark>');
            }).join('\n');
            
            pre.innerHTML = highlightedLines;
            
            // Собираем позиции всех совпадений
            currentSearchMatches = [];
            const allMarks = pre.querySelectorAll('mark.search-highlight');
            allMarks.forEach(mark => {
                currentSearchMatches.push(mark);
            });
            
            currentSearchIndex = currentSearchMatches.length > 0 ? 0 : -1;
            updateSearchCounter();
            
            if (currentSearchIndex >= 0) {
                scrollToMatch(currentSearchIndex);
                highlightCurrentMatch();
            }
        }

        function searchNext() {
            if (currentSearchMatches.length === 0) return;
            
            currentSearchIndex = (currentSearchIndex + 1) % currentSearchMatches.length;
            scrollToMatch(currentSearchIndex);
            highlightCurrentMatch();
            updateSearchCounter();
        }

        function searchPrev() {
            if (currentSearchMatches.length === 0) return;
            
            currentSearchIndex = (currentSearchIndex - 1 + currentSearchMatches.length) % currentSearchMatches.length;
            scrollToMatch(currentSearchIndex);
            highlightCurrentMatch();
            updateSearchCounter();
        }

        function scrollToMatch(index) {
            const match = currentSearchMatches[index];
            if (match) {
                match.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function highlightCurrentMatch() {
            // Сбрасываем подсветку всех
            currentSearchMatches.forEach(match => {
                match.style.backgroundColor = '#ff7b00';
                match.style.color = 'white';
            });
            
            // Подсвечиваем текущий
            if (currentSearchMatches[currentSearchIndex]) {
                currentSearchMatches[currentSearchIndex].style.backgroundColor = '#28a745';
                currentSearchMatches[currentSearchIndex].style.color = 'white';
            }
        }

        function clearSearchHighlights() {
            const container = document.getElementById('logContent');
            const pre = container.querySelector('.log-pre');
            if (!pre) return;
            
            // Убираем mark-теги, оставляя текст
            const marks = pre.querySelectorAll('mark.search-highlight');
            marks.forEach(mark => {
                const parent = mark.parentNode;
                parent.replaceChild(document.createTextNode(mark.textContent), mark);
            });
        }

        function updateSearchCounter() {
            const counter = document.getElementById('searchCounter');
            if (counter) {
                if (currentSearchMatches.length > 0) {
                    counter.textContent = `${currentSearchIndex + 1}/${currentSearchMatches.length}`;
                } else {
                    counter.textContent = '0/0';
                }
            }
        }

        // Поиск при вводе
        document.getElementById('searchInput').addEventListener('input', (e) => {
            performSearch();
        });

        // Горячие клавиши
        document.addEventListener('keydown', function(e) {
            // Ctrl+F — фокус на поиск
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
                document.getElementById('searchInput').select();
            }
            // Enter — следующее совпадение
            else if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                searchNext();
            }
            // Shift+Enter — предыдущее совпадение
            else if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                searchPrev();
            }
            // Esc — очистить поиск
            else if (e.key === 'Escape') {
                document.getElementById('searchInput').value = '';
                performSearch();
            }
        });
        
        // Загружаем список логов и основной лог, запускаем автообновление
        loadLogList();
        loadMainLog();
        //startAutoRefresh();
    </script>
</body>
</html>
