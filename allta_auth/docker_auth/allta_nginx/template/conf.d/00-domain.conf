# 00-domain.conf

# ——————— Логи ———————
log_format main_ext '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log main_ext;
error_log  /var/log/nginx/error.log warn;

# ——————— Upstream’ы ———————
# В качестве хостов используем точные имена сервисов из docker-compose.yml
# (service name = allta-auth-api, allta-config-api, allta-devpi)
# Docker DNS resolver: позволяет nginx пере-резолвить сервисы после пересоздания контейнеров.
resolver 127.0.0.11 valid=30s ipv6=off;

upstream allta_auth_api_upstream {
    zone allta_auth_api_upstream 64k;
    server authservice-auth-api:8000 resolve;
}
upstream allta_config_api_upstream {
    zone allta_config_api_upstream 64k;
    server authservice-config-api:8000 resolve;
}
upstream allta-swagger_upstream {
    zone allta_swagger_upstream 64k;
    server docs-api-vm-auth:8080 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name allta.devos.astralinux.ru;
    return 301 https://$http_host$request_uri;
}

server {
    listen       443 ssl;
    server_name  allta.devos.astralinux.ru;
    error_page 497 =301 https://$http_host$request_uri;
    ssl_certificate     /etc/nginx/tls/allta-api.crt;
    ssl_certificate_key /etc/nginx/tls/allta-api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    client_max_body_size 200m;
    # ——— общие proxy-настройки ———
    proxy_http_version 1.1;
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   Authorization      $http_authorization;
    proxy_set_header   Cookie             $http_cookie;

    location = /api/docs/oauth-callback {
        proxy_pass http://allta_auth_api_upstream/api/auth/v1/integrations/oauth/nginx/callback$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth/docs {
        internal;
        proxy_method GET;
        proxy_pass http://allta_auth_api_upstream/api/auth/v1/integrations/basic/verify?permission=docs.api;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @docs_oauth2_signin {
        return 302 https://$http_host/api/auth/v1/integrations/oauth/nginx/start?client_id=allta-docs&redirect_uri=https://$http_host/api/docs/oauth-callback&rd=https://$http_host/api/docs/;
    }

    location = /_auth/error-403 {
        internal;
        default_type application/json;
        return 403 '{"detail":"Insufficient permissions"}';
    }

    location = /_auth/error-503 {
        internal;
        default_type application/json;
        return 503 '{"detail":"Auth service unavailable"}';
    }

    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }    

    # ——— подключаем location-файлы из /etc/nginx/services ———
    include /etc/nginx/services/*.conf;    # прод
    # include /etc/nginx/services/10-allta_auth_api.conf;
    # include /etc/nginx/services/11-allta_config_api.conf;
    # include /etc/nginx/services/12-allta_vm_api.conf;
    # include /etc/nginx/services/13-allta_server_api.conf;
    # include /etc/nginx/services/20-allta_devpi.conf;
    # include /etc/nginx/services/21-allta_swagger.conf;
}
