    # ——— Swagger UI документация ———
    location = /api/docs {
        return 302 /api/docs/;
    }

    location /api/docs/ {
        auth_request /_auth/docs;
        error_page 401 = @docs_oauth2_signin;
        error_page 403 = /_auth/error-403;
        error_page 500 502 503 504 = /_auth/error-503;

        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $auth_role $upstream_http_x_auth_role;

        proxy_pass http://allta-swagger_upstream/;
        
        # Для корректной работы Swagger UI с BASE_URL=/api/docs
        rewrite ^/api/docs/(.*)$ /$1 break;
        
        # Переписываем URL в ответах Swagger UI
        sub_filter 'href="/' 'href="/api/docs/';
        sub_filter 'src="/' 'src="/api/docs/';
        sub_filter 'url:"/' 'url:"/api/docs/';
        sub_filter_once off;

        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Auth-User-Id $auth_user_id;
        proxy_set_header X-Auth-Role $auth_role;
    }
