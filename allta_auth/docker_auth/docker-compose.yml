version: '3.8'
services:
  authservice-auth-init:
    build:
      context: ./allta_auth_api/allta_auth_init
      dockerfile: Dockerfile
    image: authservice-auth-init:latest
    container_name: authservice-auth_init
    restart: "no"
    environment:
      REGISTRY_KEYS_DIR: /registry-keys
      REGISTRY_KEY_FILE: /registry-keys/registry_signing.key
      REGISTRY_CERT_FILE: /registry-keys/auth-registry.crt
      REGISTRY_CERT_SUBJECT: ${REGISTRY_CERT_SUBJECT}
      REGISTRY_CERT_DAYS: ${REGISTRY_CERT_DAYS}
      OAUTH_CLIENT_SECRETS_DIR: /registry-keys/oauth_clients
      OAUTH_SECRETS_ENV_FILE: /registry-keys/oauth_clients/clients.env
    volumes:
      - ${REGISTRY_KEYS_PATH}:/registry-keys
    networks:
      - authservice_network

  #  NGINX
  authservice-nginx:
    build:
      context: ./allta_nginx
      dockerfile: Dockerfile.allta_nginx
    image: authservice-auth-nginx:latest
    container_name: authservice-auth-nginx
    ports:
      - "21500:80"
    networks:
      authservice_network:
    depends_on:
      authservice-auth-api:
        condition: service_healthy
      authservice-config-api:
        condition: service_healthy
      docs-api-vm-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: always

  # AUTH-API
  authservice-auth-api:
    build:
      context: ../backend/allta_auth_api
      dockerfile: ../../docker_auth/allta_auth_api/allta_auth_api/Dockerfile.auth_api
    image: authservice-auth-api
    container_name: authservice-auth_api
    restart: always
    env_file:
      - $CRED_PATH/env.authservice_auth_api
    environment:
      SQL_ECHO: ${AUTH_SQL_ECHO}
      ALLTA_EXTERNAL_HOST: ${ALLTA_EXTERNAL_HOST}
      OAUTH_CLIENT_SECRETS_DIR: /run/secrets/registry/oauth_clients
    depends_on:
      authservice-auth-init:
        condition: service_completed_successfully
      authservice-auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - authservice_network
      - authservice_auth_api
    volumes:
      - ${REGISTRY_KEYS_PATH}:/run/secrets/registry:ro

  authservice-auth-db:
    build:
      context: ./allta_auth_api/allta_auth_db
      dockerfile: Dockerfile.allta_auth_db
    image: authservice-auth-db:latest
    container_name: authservice-auth_db
    restart: always
    env_file:
      - $CRED_PATH/env.authservice_auth_db
    volumes:
      - allta_auth_db_data:/var/lib/postgresql/data        
    networks:
      - authservice_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  authservice-config-api:
    build:
      context: ../backend/allta_config_api
      dockerfile: ../../docker_auth/allta_config_api/Dockerfile.allta_config_api
    image: authservice-config-api
    container_name: authservice-config_api
    restart: always
    env_file:
      - $CRED_PATH/env.authservice_config_api
    depends_on:
      authservice-auth-api:
        condition: service_healthy
    extra_hosts:
      - "${ALLTA_EXTERNAL_HOST}:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/config/health"]
      interval: 10s
      timeout: 5s
      retries: 5              
    networks:
      - authservice_network
    volumes:
      - allta_config_data:/data
      - ${CONFIG_API_TOKENS_PATH}:/cred/tokens.json:ro

  docs-api-vm-auth:
    build:
      context: ./allta_swagger
      dockerfile: Dockerfile.allta_swagger
    image: docs-api-vm-auth:latest
    container_name: docs_api_vm_auth
    restart: always
    networks:
      authservice_network:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 3s
      retries: 3     

volumes:
  # AUTH API
  allta_auth_db_data:
    driver: local
    driver_opts:
      type: none
      device: ${AUTH_DB_PATH}
      o: bind   
  allta_config_data:
    driver: local
    driver_opts:
      type: none
      device: ${CONFIG_API_DATA_PATH}
      o: bind      

networks:

  authservice_network:
    driver: bridge

  # AUTH API
  authservice_auth_api:
    driver: bridge
