version: '3'
services:
  app:
    build: .
    container_name: allta_infocollector_app
    ports:
      - "5002:5002"
    volumes:
      - ./logs:/app/logs
      - /home/u:/app/env
    networks:
      - infocollector

  nginx:
    image: allta.devos.astralinux.ru:21503/nginx:latest
    ports:
      - "18181:18181"
    volumes:
      - ./src/aggregator/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - infocollector

networks:
  infocollector:
    driver: bridge
