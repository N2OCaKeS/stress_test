# 00-domain.conf

# ——————— Логи ———————
log_format main_ext '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log main_ext;
error_log  /var/log/nginx/error.log warn;

# ——————— Upstream’ы ———————
# В качестве хостов используем точные имена сервисов из docker-compose.yml
# (service name = allta-auth-api, allta-config-api, allta-devpi)
upstream allta_auth_api_upstream {
    server allta-auth-api:8000;
}
upstream allta_config_api_upstream {
    server allta-config-api:8000;
}
upstream allta_server_api_upstream {
    server allta-server-api:8000;
}
upstream allta_vm_api_upstream {
   server allta-vm-api:8000;
}
upstream allta-vm-flower_upstream {
    server allta-vm-flower:5555;
}
upstream devpi_upstream {
    server allta-devpi:3141;
}
upstream allta-swagger_upstream {
    server allta-swagger:8080;
}
upstream allta_upstream {
    server 10.177.103.10:8000;
}
upstream allta_redis_commander_upstream  {
    server allta-redis-commander:8081;
}
upstream allta_portainer_upstream  {
    server allta-portainer:9000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  allta.devos.astralinux.ru;
    client_max_body_size 200m;
    # ——— общие proxy-настройки ———
    proxy_http_version 1.1;
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   Authorization      $http_authorization;
    proxy_set_header   Cookie             $http_cookie;    
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }    

    # ——— подключаем location-файлы из /etc/nginx/services ———
    include /etc/nginx/services/*.conf;    # прод
    # include /etc/nginx/services/10-allta_auth_api.conf;
    # include /etc/nginx/services/11-allta_config_api.conf;
    # include /etc/nginx/services/12-allta_vm_api.conf;
    # include /etc/nginx/services/13-allta_server_api.conf;
    # include /etc/nginx/services/20-allta_devpi.conf;
    # include /etc/nginx/services/21-allta_swagger.conf;
}
