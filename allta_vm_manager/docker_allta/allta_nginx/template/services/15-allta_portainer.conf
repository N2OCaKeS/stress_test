location = /service/portainer { return 301 /service/portainer/; }

# --- API: снимаем префикс и шлём на /api/... ---
location ^~ /service/portainer/api/ {
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /service/portainer;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # важно: слеш в конце — снимает /service/portainer/api/ -> /api/
    proxy_pass http://allta_portainer_upstream/;

    proxy_redirect ~^(/)(.*)$ /service/portainer/$2;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # куки и абсолютные редиректы под префикс
    absolute_redirect off;
    proxy_cookie_path / /service/portainer/;
}

# --- LOCALES/STATIC: абсолютные пути Portainer ----
# Явно проксируем локали от корня Portainer
location ^~ /service/portainer/locales/ {
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /service/portainer;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # снимаем /service/portainer/locales/ -> /locales/
    proxy_pass http://allta_portainer_upstream/;

    proxy_redirect off;
}

# --- UI: всё остальное под префиксом ---
location ^~ /service/portainer/ {
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /service/portainer;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # снимаем /service/portainer/ -> /
    proxy_pass http://allta_portainer_upstream/;

    # редиректы от бекенда на / превращаем в /service/portainer/
    proxy_redirect ~^(/)(.*)$ /service/portainer/$2;

    # перепишем абсолютные ссылки внутри HTML/CSS/JS
    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript application/json;
    sub_filter 'href="/'     'href="/service/portainer/';
    sub_filter 'src="/'      'src="/service/portainer/';
    sub_filter 'action="/'   'action="/service/portainer/';
    sub_filter 'content="/'  'content="/service/portainer/';
    sub_filter '<base href="/">' '<base href="/service/portainer/">';

    # критично: локали тоже бывают в абсолютном виде
    sub_filter '"/locales/'  '"/service/portainer/locales/';

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    absolute_redirect off;
    proxy_cookie_path / /service/portainer/;
}


location ^~ /locales/ {
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # если уже есть map $http_upgrade — используй его
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ВАЖНО: без завершающего слеша — так путь /locales/... уйдет как есть
    proxy_pass http://allta_portainer_upstream;

    proxy_redirect off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}