# основное проксирование DevPI
location /service/devpi {
    proxy_redirect  off;
    proxy_buffering off;
    proxy_pass      http://devpi_upstream;
}

# отдача статики +files напрямую
location ~ /service/devpi/\+f/ {
    error_page 418 = @proxy;
    if ($request_method !~ (GET|HEAD)) { return 418; }
    expires max;
    try_files /+files$uri @proxy;
}

location @proxy {
    proxy_pass http://devpi_upstream;
}