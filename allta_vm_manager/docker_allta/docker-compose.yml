version: '3.8'
services:
  # FRONT SERVICE
  
  # allta-devpi:
  #   build:
  #     context: ./allta_devpi
  #     dockerfile: Dockerfile.allta_devpi
  #     args:
  #       DEVPI_ADMIN_PASSWORD: ${DEVPI_ADMIN_PASSWORD}
  #       DEVPI_USER: ${DEVPI_USER}
  #       DEVPI_PASSWORD: ${DEVPI_PASSWORD}
  #   image: allta-devpi:latest
  #   container_name: allta-devpi
  #   ports:
  #     - "3141:3141"
  #   env_file:
  #     - $CRED_PATH/env.allta_devpi
  #   volumes:
  #     - devpi-data:/data
  #   networks:
  #     - allta_front_service
  #   restart: always    
  #   healthcheck:
  #     test: ["CMD", "/health/health_checker.sh"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

  #  NGINX
  allta-nginx:
    build:
      context: ./allta_nginx
      dockerfile: Dockerfile.allta_nginx
    image: allta-nginx:latest
    container_name: allta-nginx
    ports:
      - "80:80"
    volumes:
      - allta_devpi_data:/data:ro
    networks:
      allta_network:
        aliases:
          - "allta.devos.astralinux.ru"      
      allta_front_service:
    depends_on:
      allta-auth-api:
        condition: service_healthy
      allta-config-api:
        condition: service_healthy
      allta-server-api:
        condition: service_healthy
      allta-vm-api:
        condition: service_healthy
      allta-swagger:
        condition: service_healthy     
      allta-vm-flower:
        condition: service_healthy  
      allta-redis-commander:
        condition: service_healthy         
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: always


  # AUTH-API
  allta-auth-api:
    build:
      context: ../backend/allta_auth_api
      dockerfile: ../../docker_allta/allta_auth_api/allta_auth_api/Dockerfile.auth_api
    image: allta-auth-api
    container_name: allta_auth_api
    restart: always
    env_file:
      - $CRED_PATH/env.allta_auth_api
    depends_on:
      allta-auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - allta_network
      - allta_auth_api     

  allta-auth-db:
    build:
      context: ./allta_auth_api/allta_auth_db
      dockerfile: Dockerfile.allta_auth_db
    image: allta-auth-db:latest
    container_name: allta_auth_db
    restart: always
    env_file:
      - $CRED_PATH/env.allta_auth_db
    volumes:
      - allta_auth_db_data:/var/lib/postgresql/data        
    networks:
      - allta_auth_api
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5      

  # CONFIG API

  allta-config-api:
    build:
      context: ../backend/allta_config_api
      dockerfile: ../../docker_allta/allta_config_api/Dockerfile.allta_config_api
    image: allta-config-api
    container_name: allta_config_api
    restart: always
    env_file:
      - $CRED_PATH/env.allta_config_api
    depends_on:
      allta-auth-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/config/health"]
      interval: 5s
      timeout: 3s
      retries: 5              
    networks:
      - allta_network
    volumes:
      - allta_config_data:/data
      - ${CONFIG_API_TOKENS_PATH}:/cred/tokens.json:ro


  # SERVER API

  allta-server-api:
    build:
      context: ../backend/allta_server_api
      dockerfile: ../../docker_allta/allta_server_api/allta_server_api/Dockerfile.allta_server_api
    image: allta_server_api
    container_name: allta_server_api
    restart: always
    env_file:
      - $CRED_PATH/env.allta_server_api
    depends_on:
      allta-auth-api:
        condition: service_healthy
      allta-server-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/server/health"]
      interval: 5s
      timeout: 3s
      retries: 5             
    networks:
      - allta_server_api
      - allta_network
    volumes:
      - allta_server_api:/data

  allta-server-db:
    build:
      context: ./allta_server_api/allta_server_db
      dockerfile: Dockerfile.allta_server_db
    image: allta-server-db:latest
    container_name: allta_server_db
    restart: always
    env_file:
      - $CRED_PATH/env.allta_server_db
    volumes:
      - allta_server_db_data:/var/lib/postgresql/data 
    networks:
      - allta_network   
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5      

  # VM_API

  allta-vm-api:
    build:
      context: ../backend/allta_vm_api/services/api
      dockerfile: ../../../../docker_allta/allta_vm_api/allta_vm_api/Dockerfile.allta_vm_api
    image: allta-vm-api
    container_name: allta_vm_api
    restart: always
    env_file:
      - $CRED_PATH/env.allta_vm_api
    depends_on:
      allta-auth-api:
        condition: service_healthy   
      allta-server-api:
        condition: service_healthy                 
      allta-vm-db:
        condition: service_healthy
      # allta-devpi:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/vm/health"]
      interval: 5s
      timeout: 3s
      retries: 5              
    networks:
      - allta_vm_api
      - allta_redis
      - allta_network
    volumes:
      - allta_vm_api:/data

  allta-vm-db:
    build:
      context: ./allta_vm_api/allta_vm_db
      dockerfile: Dockerfile.allta_vm_db
    image: allta-vm-db:latest
    container_name: allta_vm_db
    restart: always
    env_file:
      - $CRED_PATH/env.allta_vm_db
    volumes:
      - allta_vm_db_data:/var/lib/postgresql/data
    networks:
      - allta_vm_api
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5      

  allta-vm-celery:
    build:
      context: ../backend/allta_vm_api/services/worker
      dockerfile: ../../../../docker_allta/allta_vm_api/allta_vm_celery/Dockerfile.allta_vm_celery
    image: allta-vm-celery:latest      
    container_name: allta_vm_celery
    restart: always    
    env_file:
      - $CRED_PATH/env.allta_vm_celery
    depends_on:
      allta-redis:
        condition: service_healthy
    networks:
      - allta_vm_api
      - allta_redis
    volumes:
      - allta_vm_api:/data      

  allta-vm-flower:
    build:
      context: ./allta_vm_api/allta_vm_flower
      dockerfile: Dockerfile.allta_vm_flower
    image: allta-vm-flower:latest
    container_name: allta_vm_flower
    restart: always      
    env_file:
      - $CRED_PATH/env.allta_vm_flower
    depends_on:
      allta-redis:
        condition: service_healthy
    command: celery flower --broker=redis://redis:6379/0 --url_prefix=/service/flower/      
    networks:
      - allta_redis    
      - allta_network
      - allta_vm_api
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport socket,sys\ns=socket.socket();s.settimeout(2)\ntry:\n s.connect(('127.0.0.1', int('${FLOWER_PORT:-5555}'))); sys.exit(0)\nexcept Exception:\n sys.exit(1)\nPY"]
      interval: 10s
      timeout: 3s
      retries: 5
             
  # ALL API DOCS
  allta-swagger:
    build:
      context: ./allta_swagger
      dockerfile: Dockerfile.allta_swagger
    image: allta_swagger:latest
    container_name: allta_swagger
    restart: always
    networks:
      allta_network:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 3s
      retries: 3      

  # Redis
  allta-redis:
    build:
      context: ./allta_redis
      dockerfile: Dockerfile.allta_redis
    image: allta-redis:latest      
    container_name: allta_redis
    restart: always
    env_file:
      - $CRED_PATH/env.allta_redis
    networks:
      - allta_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10   
    volumes:
      - allta_redis_data:/data      

  allta-redis-commander:
    build:
      context: ./allta_redis_commander
      dockerfile: Dockerfile.redis_commander
    image: allta-redis-commander:latest
    container_name: allta_redis_commander
    restart: always
    env_file:
      - $CRED_PATH/env.allta_redis_commander
    networks:
      - allta_redis
      - allta_network
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -q -O - http://127.0.0.1:8081/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  allta-portainer:
    build:
      context: ./allta_portainer
      dockerfile: Dockerfile.allta_portainer
    image: allta-portainer:latest
    container_name: allta_portainer
    restart: always   
    volumes:
      - allta_portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9443:9443
    networks:
      - allta_network

volumes:
  # allta_devpi_data:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     device: /var/allta_services/volumes/allta_devpi_data
  #     o: bind


  # AUTH API
  allta_auth_db_data:
    driver: local
    driver_opts:
      type: none
      device: ${AUTH_DB_PATH}
      o: bind   

  # CONFIG API
  allta_config_data:
    driver: local
    driver_opts:
      type: none
      device: ${CONFIG_API_DATA_PATH}
      o: bind
      

  # SERVER API
  allta_server_api:
    driver: local
    driver_opts:
      type: none
      device: ${SERVER_API_DATA_PATH}
      o: bind   

  allta_server_db_data:
    driver: local
    driver_opts:
      type: none
      device: ${SERVER_DB_PATH}
      o: bind

  # VM API
  allta_vm_api:
    driver: local
    driver_opts:
      type: none
      device: ${VM_API_DATA_PATH}
      o: bind
    
  allta_vm_db_data:
    driver: local
    driver_opts:
      type: none
      device: ${VM_DB_PATH}
      o: bind

  # Redis
  allta_redis_data:
    driver: local
    driver_opts:
      type: none
      device: ${REDIS_PATH}
      o: bind

  allta_portainer_data:
    driver: local
    driver_opts:
      type: none
      device: ${PORTAINER_PATH}
      o: bind

networks:
  # ALL API
  allta_network:
    driver: bridge
  allta_front_service:
    driver: bridge

  # AUTH API
  allta_auth_api:
    driver: bridge

  # SERVER API
  allta_server_api:
    driver: bridge

  # VM API
  allta_vm_api:
    driver: bridge

  allta_redis:
    driver: bridge  

