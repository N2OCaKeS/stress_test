# 00-domain.conf

# ——————— Логи ———————
log_format main_ext '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log main_ext;
error_log  /var/log/nginx/error.log warn;

# ——————— Upstream’ы ———————
# В качестве хостов используем точные имена сервисов из docker-compose.yml
# (service name = allta-auth-api, allta-config-api, allta-devpi)
upstream allta_server_api_upstream {
    server vmmanager-server-api:8000;
}
upstream allta_vm_api_upstream {
   server vmmanager-vm-api:8000;
}
upstream allta-vm-flower_upstream {
    server vmmanager-vm-flower:5555;
}
upstream allta_redis_commander_upstream  {
    server vmmanager-redis-commander:8081;
}
upstream allta_auth_api_upstream {
    server allta.devos.astralinux.ru:21500;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name allta.devos.astralinux.ru;
    return 301 https://$http_host$request_uri;
}

server {
    listen       443 ssl;
    server_name  allta.devos.astralinux.ru;
    error_page 497 =301 https://$http_host$request_uri;
    ssl_certificate     /etc/nginx/tls/allta-api.crt;
    ssl_certificate_key /etc/nginx/tls/allta-api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    client_max_body_size 200m;
    # ——— общие proxy-настройки ———
    proxy_http_version 1.1;
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   Authorization      $http_authorization;
    proxy_set_header   Cookie             $http_cookie;    

    location = /flower/oauth-callback {
        proxy_pass https://allta_auth_api_upstream/api/auth/v1/integrations/oauth/nginx/callback$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redis/oauth-callback {
        proxy_pass https://allta_auth_api_upstream/api/auth/v1/integrations/oauth/nginx/callback$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth/flower {
        internal;
        proxy_method GET;
        proxy_pass https://allta_auth_api_upstream/api/auth/v1/integrations/basic/verify?permission=flower;
        proxy_ssl_server_name on;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth/redis {
        internal;
        proxy_method GET;
        proxy_pass https://allta_auth_api_upstream/api/auth/v1/integrations/basic/verify?permission=redis.commander;
        proxy_ssl_server_name on;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @flower_oauth2_signin {
        return 302 https://$host:21500/api/auth/v1/integrations/oauth/nginx/start?client_id=allta-flower&redirect_uri=https://$http_host/flower/oauth-callback&rd=$scheme://$http_host$request_uri;
    }

    location @redis_oauth2_signin {
        return 302 https://$host:21500/api/auth/v1/integrations/oauth/nginx/start?client_id=allta-redis&redirect_uri=https://$http_host/redis/oauth-callback&rd=$scheme://$http_host$request_uri;
    }

    location = /_auth/error-401 {
        internal;
        default_type application/json;
        return 401 '{"detail":"Authentication required"}';
    }

    location = /_auth/error-403 {
        internal;
        default_type application/json;
        return 403 '{"detail":"Insufficient permissions"}';
    }

    location = /_auth/error-503 {
        internal;
        default_type application/json;
        return 503 '{"detail":"Auth service unavailable"}';
    }

    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }    

    # ——— подключаем location-файлы из /etc/nginx/services ———
    include /etc/nginx/services/*.conf;    # прод
    # include /etc/nginx/services/10-allta_auth_api.conf;
    # include /etc/nginx/services/11-allta_config_api.conf;
    # include /etc/nginx/services/12-allta_vm_api.conf;
    # include /etc/nginx/services/13-allta_server_api.conf;
    # include /etc/nginx/services/20-allta_devpi.conf;
    # include /etc/nginx/services/21-allta_swagger.conf;
}
