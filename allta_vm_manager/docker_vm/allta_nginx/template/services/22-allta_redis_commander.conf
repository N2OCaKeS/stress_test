location /service/redis/ {
  auth_request /_auth/redis;
  error_page 401 = @redis_oauth2_signin;
  error_page 403 = /_auth/error-403;
  error_page 500 502 503 504 = /_auth/error-503;
  auth_request_set $auth_user $upstream_http_x_auth_user;
  auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
  auth_request_set $auth_role $upstream_http_x_auth_role;

  proxy_pass http://allta_redis_commander_upstream/;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Auth-User       $auth_user;
  proxy_set_header X-Auth-User-Id    $auth_user_id;
  proxy_set_header X-Auth-Role       $auth_role;

  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
