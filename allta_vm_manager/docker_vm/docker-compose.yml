version: '3.8'
services:
  #  NGINX
  vmmanager-vm-nginx:
    build:
      context: ./allta_nginx
      dockerfile: Dockerfile.allta_nginx
      args:
        ALLTA_API_CA_B64: ${ALLTA_API_CA_B64}
    image: vmmanager-vm-nginx:latest
    container_name: vmmanager-vm-nginx
    ports:
      - "21501:443"
    extra_hosts:
      - "${ALLTA_EXTERNAL_HOST}:host-gateway"
    networks:
      vmmanager_network:
    depends_on:
      vmmanager-server-api:
        condition: service_healthy
      vmmanager-vm-api:
        condition: service_healthy
      vmmanager-vm-flower:
        condition: service_healthy
      vmmanager-redis-commander:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --no-check-certificate https://127.0.0.1:443/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: always
    volumes:
      - allta_tls_data:/etc/nginx/tls:ro


  # SERVER API
  vmmanager-server-api:
    build:
      context: ../backend/allta_server_api
      dockerfile: ../../docker_vm/allta_server_api/allta_server_api/Dockerfile.allta_server_api
      args:
        ALLTA_API_CA_B64: ${ALLTA_API_CA_B64}
    image: vmmanager-server-api:latest
    container_name: vmmanager-server-api
    restart: always
    env_file:
      - $CRED_PATH/env.vmmanager_server_api
    depends_on:
      vmmanager-server-db:
        condition: service_healthy
    extra_hosts:
      - "${ALLTA_EXTERNAL_HOST}:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/server/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vmmanager_server_api
      - vmmanager_network
    volumes:
      - allta_server_api:/data


  vmmanager-server-db:
    build:
      context: ./allta_server_api/allta_server_db
      dockerfile: Dockerfile.allta_server_db
    image: vmmanager-server-db:latest
    container_name: vmmanager-server-db
    restart: always
    env_file:
      - $CRED_PATH/env.vmmanager_server_db
    volumes:
      - allta_server_db_data:/var/lib/postgresql/data
    networks:
      - vmmanager_server_api
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  # VM_API
  vmmanager-vm-api:
    build:
      context: ../backend/allta_vm_api/services/api
      dockerfile: ../../../../docker_vm/allta_vm_api/allta_vm_api/Dockerfile.allta_vm_api
      args:
        ALLTA_API_CA_B64: ${ALLTA_API_CA_B64}
    image: vmmanager-vm-api
    container_name: vmmanager-vm-api
    restart: always
    env_file:
      - $CRED_PATH/env.vmmanager_vm_api
    depends_on:
      vmmanager-server-api:
        condition: service_healthy
      vmmanager-vm-db:
        condition: service_healthy
    extra_hosts:
      - "${ALLTA_EXTERNAL_HOST}:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/vm/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vmmanager_vm_api
      - vmmanager_redis
      - vmmanager_network
    volumes:
      - allta_vm_api:/data


  vmmanager-vm-db:
    build:
      context: ./allta_vm_api/allta_vm_db
      dockerfile: Dockerfile.allta_vm_db
    image: vmmanager-vm-db:latest
    container_name: vmmanager-vm-db
    restart: always
    env_file:
      - $CRED_PATH/env.vmmanager_vm_db
    volumes:
      - allta_vm_db_data:/var/lib/postgresql/data
    networks:
      - vmmanager_vm_api
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  vmmanager-vm-celery:
    build:
      context: ../backend/allta_vm_api/services/worker
      dockerfile: ../../../../docker_vm/allta_vm_api/allta_vm_celery/Dockerfile.allta_vm_celery
      args:
        ALLTA_API_CA_B64: ${ALLTA_API_CA_B64}
    image: vmmanager-vm-celery:latest
    container_name: vmmanager-vm-celery
    restart: always
    env_file:
      - $CRED_PATH/env.vmmanager_vm_celery
    depends_on:
      vmmanager-redis:
        condition: service_healthy
    extra_hosts:
      - "${ALLTA_EXTERNAL_HOST}:host-gateway"
    networks:
      - vmmanager_vm_api
      - vmmanager_redis
    volumes:
      - allta_vm_api:/data


  vmmanager-vm-flower:
    build:
      context: ./allta_vm_api/allta_vm_flower
      dockerfile: Dockerfile.allta_vm_flower
    image: vmmanager-vm-flower:latest
    container_name: vmmanager-vm-flower
    restart: always
    env_file:
      - $CRED_PATH/env.vmmanager_vm_flower
    depends_on:
      vmmanager-redis:
        condition: service_healthy
    command: celery flower --broker=redis://redis:6379/0 --url_prefix=/service/flower/
    networks:
      - vmmanager_redis
      - vmmanager_network
      - vmmanager_vm_api
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport socket,sys\ns=socket.socket();s.settimeout(2)\ntry:\n s.connect(('127.0.0.1', int('${FLOWER_PORT:-5555}'))); sys.exit(0)\nexcept Exception:\n sys.exit(1)\nPY"]
      interval: 10s
      timeout: 3s
      retries: 5


  # Redis
  vmmanager-redis:
    build:
      context: ./allta_redis
      dockerfile: Dockerfile.allta_redis
    image: vmmanager-redis:latest
    container_name: vmmanager-redis
    restart: always
    env_file:
      - $CRED_PATH/env.vmmanager_redis
    networks:
      - vmmanager_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - allta_redis_data:/data


  vmmanager-redis-commander:
    build:
      context: ./allta_redis_commander
      dockerfile: Dockerfile.redis_commander
    image: vmmanager-redis-commander:latest
    container_name: vmmanager-redis-commander
    restart: always
    env_file:
      - $CRED_PATH/env.vmmanager_redis_commander
    networks:
      - vmmanager_redis
      - vmmanager_network
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -q -O - http://127.0.0.1:8081/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  allta_server_api:
    driver: local
    driver_opts:
      type: none
      device: ${SERVER_API_DATA_PATH}
      o: bind

  allta_server_db_data:
    driver: local
    driver_opts:
      type: none
      device: ${SERVER_DB_PATH}
      o: bind

  allta_vm_api:
    driver: local
    driver_opts:
      type: none
      device: ${VM_API_DATA_PATH}
      o: bind

  allta_vm_db_data:
    driver: local
    driver_opts:
      type: none
      device: ${VM_DB_PATH}
      o: bind

  allta_redis_data:
    driver: local
    driver_opts:
      type: none
      device: ${REDIS_PATH}
      o: bind
  allta_tls_data:
    driver: local
    driver_opts:
      type: none
      device: ${TLS_CERTS_PATH}
      o: bind

networks:
  # ALL API
  vmmanager_network:
    driver: bridge

  # SERVER API
  vmmanager_server_api:
    driver: bridge

  # VM API
  vmmanager_vm_api:
    driver: bridge

  vmmanager_redis:
    driver: bridge
