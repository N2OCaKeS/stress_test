version: '3.8'
services:
  #  NGINX
  allta-vm-nginx:
    build:
      context: ./allta_nginx
      dockerfile: Dockerfile.allta_nginx
    image: allta-vm-nginx:latest
    container_name: allta-vm-nginx
    ports:
      - "127.0.0.1:21501:80"
    networks:
      allta_network: 
    depends_on:
      allta-server-api:
        condition: service_healthy
      allta-vm-api:
        condition: service_healthy 
      allta-vm-flower:
        condition: service_healthy  
      allta-redis-commander:
        condition: service_healthy         
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: always

  # SERVER API

  allta-server-api:
    build:
      context: ../backend/allta_server_api
      dockerfile: ../../docker_vm/allta_server_api/allta_server_api/Dockerfile.allta_server_api
    image: allta-server-api:latest
    container_name: allta-server-api
    restart: always
    env_file:
      - $CRED_PATH/env.allta_server_api
    depends_on:
      allta-server-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/server/health"]
      interval: 5s
      timeout: 3s
      retries: 5             
    networks:
      - allta_server_api
      - allta_network
    volumes:
      - allta_server_api:/data

  allta-server-db:
    build:
      context: ./allta_server_api/allta_server_db
      dockerfile: Dockerfile.allta_server_db
    image: allta-server-db:latest
    container_name: allta-server-db
    restart: always
    env_file:
      - $CRED_PATH/env.allta_server_db
    volumes:
      - allta_server_db_data:/var/lib/postgresql/data 
    networks:
      - allta_network   
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5      

  # VM_API

  allta-vm-api:
    build:
      context: ../backend/allta_vm_api/services/api
      dockerfile: ../../../../docker_vm/allta_vm_api/allta_vm_api/Dockerfile.allta_vm_api
    image: allta-vm-api
    container_name: allta_vm_api
    restart: always
    env_file:
      - $CRED_PATH/env.allta_vm_api
    depends_on:
      allta-server-api:
        condition: service_healthy                 
      allta-vm-db:
        condition: service_healthy
      # allta-devpi:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/vm/health"]
      interval: 5s
      timeout: 3s
      retries: 5              
    networks:
      - allta_vm_api
      - allta_redis
      - allta_network
    volumes:
      - allta_vm_api:/data

  allta-vm-db:
    build:
      context: ./allta_vm_api/allta_vm_db
      dockerfile: Dockerfile.allta_vm_db
    image: allta-vm-db:latest
    container_name: allta_vm_db
    restart: always
    env_file:
      - $CRED_PATH/env.allta_vm_db
    volumes:
      - allta_vm_db_data:/var/lib/postgresql/data
    networks:
      - allta_vm_api
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5      

  allta-vm-celery:
    build:
      context: ../backend/allta_vm_api/services/worker
      dockerfile: ../../../../docker_vm/allta_vm_api/allta_vm_celery/Dockerfile.allta_vm_celery
    image: allta-vm-celery:latest      
    container_name: allta_vm_celery
    restart: always    
    env_file:
      - $CRED_PATH/env.allta_vm_celery
    depends_on:
      allta-redis:
        condition: service_healthy
    networks:
      - allta_vm_api
      - allta_redis
    volumes:
      - allta_vm_api:/data      

  allta-vm-flower:
    build:
      context: ./allta_vm_api/allta_vm_flower
      dockerfile: Dockerfile.allta_vm_flower
    image: allta-vm-flower:latest
    container_name: allta_vm_flower
    restart: always      
    env_file:
      - $CRED_PATH/env.allta_vm_flower
    depends_on:
      allta-redis:
        condition: service_healthy
    command: celery flower --broker=redis://redis:6379/0 --url_prefix=/service/flower/      
    networks:
      - allta_redis    
      - allta_network
      - allta_vm_api
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport socket,sys\ns=socket.socket();s.settimeout(2)\ntry:\n s.connect(('127.0.0.1', int('${FLOWER_PORT:-5555}'))); sys.exit(0)\nexcept Exception:\n sys.exit(1)\nPY"]
      interval: 10s
      timeout: 3s
      retries: 5 

  # Redis
  allta-redis:
    build:
      context: ./allta_redis
      dockerfile: Dockerfile.allta_redis
    image: allta-redis:latest      
    container_name: allta_redis
    restart: always
    env_file:
      - $CRED_PATH/env.allta_redis
    networks:
      - allta_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10   
    volumes:
      - allta_redis_data:/data      

  allta-redis-commander:
    build:
      context: ./allta_redis_commander
      dockerfile: Dockerfile.redis_commander
    image: allta-redis-commander:latest
    container_name: allta_redis_commander
    restart: always
    env_file:
      - $CRED_PATH/env.allta_redis_commander
    networks:
      - allta_redis
      - allta_network
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -q -O - http://127.0.0.1:8081/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  allta_server_api:
    driver: local
    driver_opts:
      type: none
      device: ${SERVER_API_DATA_PATH}
      o: bind   

  allta_server_db_data:
    driver: local
    driver_opts:
      type: none
      device: ${SERVER_DB_PATH}
      o: bind

  allta_vm_api:
    driver: local
    driver_opts:
      type: none
      device: ${VM_API_DATA_PATH}
      o: bind
    
  allta_vm_db_data:
    driver: local
    driver_opts:
      type: none
      device: ${VM_DB_PATH}
      o: bind

  allta_redis_data:
    driver: local
    driver_opts:
      type: none
      device: ${REDIS_PATH}
      o: bind



networks:
  # ALL API
  allta_network:
    driver: bridge

  # SERVER API
  allta_server_api:
    driver: bridge

  # VM API
  allta_vm_api:
    driver: bridge

  allta_redis:
    driver: bridge  

