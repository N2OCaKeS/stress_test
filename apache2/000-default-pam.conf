<VirtualHost *:80>
<Directory /var/www/>
AuthType Basic
AuthName "Pam Auth"
AuthBasicProvider PAM
AuthPAMService apache2
require valid-user
</Directory>
ServerAdmin webmaster@localhost
DocumentRoot /var/www/
ErrorLog ${APACHE_LOG_DIR}/error.log
CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
