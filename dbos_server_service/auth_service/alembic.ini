[alembic]
# Index naming convention: plain string `ix_<table>_<col>` (без `op.f(...)`).
# Initial schema (979c718e933c) и часть ранних миграций использовали `op.f(...)`,
# но конвенция последующих ревизий — литералы. На autogenerate-drift можно
# ругаться; рефакторинг старых ревизий не делаем (имена стабильны в коде).
script_location = src/db/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+psycopg://auth_user:auth_password@localhost:5432/auth_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
