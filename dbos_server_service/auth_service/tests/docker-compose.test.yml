name: auth-tests

# Full test stack: isolated DB + auth service + Docker registry + test runner.
# Usage:
#   docker compose -f tests/docker-compose.test.yml run --rm test-runner          # all tests
#   docker compose -f tests/docker-compose.test.yml run --rm test-runner pytest tests/ -m "not e2e"
#   docker compose -f tests/docker-compose.test.yml down -v                        # cleanup

services:

  # ── Isolated test database ────────────────────────────────────────────────
  test-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db_test
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d auth_db_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  # ── auth_service (real HTTP server for E2E) ───────────────────────────────
  auth-service-e2e:
    profiles: ["e2e"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/auth_db_test
      SECRET_KEY: test-secret-key-for-e2e-must-be-at-least-32-chars
      ACCESS_TOKEN_TTL_MINUTES: "10"
      REFRESH_TOKEN_TTL_DAYS: "14"
      DOCKER_REGISTRY_SERVICE: docker-registry:5000
      DOCKER_REGISTRY_ISSUER: auth_service
      DOCKER_TOKEN_TTL_MINUTES: "5"
      # Фиксированный RSA-ключ для подписи Docker JWT.
      # Без него auth_service генерирует эфемерный ключ при каждом старте → если
      # auth-service-e2e перезапускается после того как fetch-cert сохранил cert,
      # registry rootcertbundle устаревает → "token signed by untrusted key".
      DOCKER_RSA_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQCwnW21JKCh6fGb\nyTdv1oJoDIs2Nq+uI5V4winGNtL6vTUB3u25PAZbDmdZ2Z6V7rn5DLQtzQz/xpYe\nFmQsXXmePGIRWULkRxA/No9uQZIMk7HMkuaET3cleOuJQrl+qONv8spbW5DrzEm2\ne0WPY0uRQHyh7rlP1tf3hWqTeYvc3IPn4UUzz14aApVlEZMXOnQJOUqVMk1aCvH3\ntKbCDSCxdGQmzzyt7FXdHDyG2GzI+8Zg5k0vKtm5DD8O43Nx/UJc4ReRSuk4dVao\namvQaw+osGN6HWpOrKS7j7HTjjwqqwUYEoV65AvVslRu5XbRfvF7dMQnLVHyJEti\n49yvrJKvAgMBAAECggEAH1VewFNmODOUDMpvDmVlL2aCUDT1iBSCETGJTcQuPBPT\nUqilTkaq7f6pMVSdgQYgcmHhmXqWgs5NlbrtPL28tOkLkP5gErXU2RIp8iqp6ZdO\nZPfu86xRfBFu4CQ5WpJF/3d4lSqylFLjBP/rwFuibXueYPBEaji4ig5ecRmQSbd+\nMFYx3hRYbjMimSBytFDWiSpMMx4jPeDy5CsAXh7dz0IJ2kHbYwZ/jTbXJyW/hqXI\nhuLItSMRp5AeG0WzKl0kwln6ShScH7RgOY7SgXVQPN2H36ZiQnbUTc7qWlPNvk/v\nLFaVyrI9D/Au4pfxu7UkteSp/xINrN9Mwp+7j/XbsQKBgQDVoG/GFFJPMnB78cvC\n9sN03opd8LWCIOfPkd3w1JEm4jdrHAIG1zM/GHlr6zuv6SsIwI6B59JySU14EO6b\n0x87N8l1ijYP2cvMD48Giy+lmaFKE2e/4aepN9mN/FE80haefciNB9T7w4g2FIK9\nZv5z1YlCunBGFkZwGObUBRDk2QKBgQDTpZrMHOhiJD00G6Qj/1w5+doG7Ctz1aKO\nU3px0v3nZmSldNhnNH+9+hvAB16AOpDMJK9B487iz1RDS6OhnBYVEjqa3uEaW/Fu\nSKU7CMaBxJmj9Gj1PtMHhaqOHW1kDXC4rcIHvt179DFpCsX5E7BTe79ts+YMhWGv\nTJ6jybtexwKBgGILFgF0xinu3k0kNf4uvpneoOZoWQV2EK3lJlUnWc7ct86CtjNp\nhO2KT//FoEkl3EhSB5V7TcyB8/oM21XM2WKWQfGeEx3HOY9X/K5mJuH71lhm+5DH\nAenZ5hESIj6ltRfcZrTDSW6a2OLpGu/OWy3SbQKhCnJAOuerphTcllpRAoGBAJUV\nThkBM+ANzt7pqZGByyE7kgzWRzVtAvhmbRXInfll8vdpexYXsPPNPcbiafrBRkXG\ngX1UTuMNUDmnCjhIjnWBRa7Z2I6MvWAF4/3VjJ7UMbV/8H7wJg5iZWV97RRRM1mj\na82w8Krjs/peEF4HNGlZ/dn0otOnEMw+mHCfJVD5AoGBAJa0NizsHqxNvyQbLKyP\nsFymPy25nJQFugMyxDMZp0pxTvxw3l/elF67kmTpbHVFwG3A7Orxcyyoyt8MKx2X\nQ5WLQ8GHgkJJeT3hwAGiv43m/BxSE50K5QRIn8ivZzWq4HO4CrgdwyC72NMWd8Sg\nLhbCfipbZhezQyKmRF9S1zV8\n-----END PRIVATE KEY-----"
      E2E_ADMIN_USERNAME: e2e_admin
      E2E_ADMIN_PASSWORD: E2eAdmin1234!
    # Run migrations, seed E2E admin, then start server
    command: >
      sh -c "python -m alembic upgrade head &&
             python src/scripts/seed_e2e.py &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      test-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/auth/v1/health"]
      interval: 3s
      timeout: 5s
      retries: 20

  # ── One-shot: fetch RSA public cert from auth_service ────────────────────
  fetch-cert:
    profiles: ["e2e"]
    image: curlimages/curl:latest
    # Volume /certs создаётся docker'ом от root; curlimages/curl работает
    # от curl_user (uid=100) → curl exit 23 (Permission denied) на запись.
    user: root
    volumes:
      - e2e-certs:/certs
    command: >
      sh -c "
        until curl -sf http://auth-service-e2e:8000/api/auth/v1/docker/certs -o /certs/auth.pem;
        do echo 'waiting for auth-service-e2e...'; sleep 1; done;
        echo 'cert saved to /certs/auth.pem'
      "
    depends_on:
      auth-service-e2e:
        condition: service_healthy

  # ── Docker registry with token auth ──────────────────────────────────────
  docker-registry:
    profiles: ["e2e"]
    image: registry:2
    environment:
      REGISTRY_AUTH: token
      # realm is called by the Docker CLIENT — must be reachable from test-runner
      REGISTRY_AUTH_TOKEN_REALM: http://auth-service-e2e:8000/api/auth/v1/docker/token
      REGISTRY_AUTH_TOKEN_SERVICE: docker-registry:5000
      REGISTRY_AUTH_TOKEN_ISSUER: auth_service
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /certs/auth.pem
    volumes:
      - e2e-certs:/certs:ro
    depends_on:
      fetch-cert:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5000 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 20

  # ── Test runner ───────────────────────────────────────────────────────────
  test-runner:
    build:
      context: ..
      dockerfile: tests/Dockerfile.test
    environment:
      # Unit/integration tests use this DB directly via TestClient + SAVEPOINT
      TEST_DATABASE_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/auth_db_test
      SECRET_KEY: test-secret-key-for-e2e-must-be-at-least-32-chars
      ACCESS_TOKEN_TTL_MINUTES: "10"
      REFRESH_TOKEN_TTL_DAYS: "14"
      # E2E tests use these to reach the real services
      E2E_AUTH_SERVICE_URL: http://auth-service-e2e:8000
      E2E_REGISTRY_HOST: docker-registry:5000
      PYTHONPATH: /app
    depends_on:
      test-postgres:
        condition: service_healthy
      # docker-registry / auth-service-e2e — нужны только под `--profile e2e`.
      # docker compose сам пропустит условные зависимости, если профиль не активен.
      auth-service-e2e:
        condition: service_healthy
        required: false
      docker-registry:
        condition: service_healthy
        required: false
    # Bind tests/ and src/ for fast iteration (no rebuild on new test files).
    # Paths are relative to this compose file (auth_service/tests/).
    volumes:
      - .:/app/tests
      - ../src:/app/src
    # Default: run all tests. Override via `run --rm test-runner pytest ...`
    command: ["pytest", "tests/", "-v", "--tb=short"]

volumes:
  e2e-certs:
