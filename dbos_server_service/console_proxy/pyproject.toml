[tool.poetry]
name = "console-proxy"
version = "0.1.0"
description = "DBOS console_proxy — веб-прокси графической консоли ВМ (VNC/SPICE) поверх WebSocket"
authors = []
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
aiohttp = "3.11.11"
asyncssh = "2.23.0"
httpx = "0.28.1"
pydantic = "2.11.3"
pydantic-settings = "2.8.1"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "^1.0"
pytest-aiohttp = "1.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
asyncio_mode = "auto"
