apiVersion: v1
kind: Namespace
metadata:
  name: dbos
  labels:
    # PodSecurityAdmission: restricted профиль блокирует privileged, hostPath,
    # runAsRoot и т.п. Все наши Deployment'ы уже идут с runAsNonRoot + drop ALL +
    # seccomp RuntimeDefault, swagger-ui — c runAsUser=101 (nginx unprivileged).
    # Если operator увидит warning'и из audit — снизить уровень до baseline.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
