# Postgres для auth_service — один pod с persistent volume.
# Резервирование делается через бэкапы (см. scripts/k8s/backup_pg.sh), не репликами.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-postgres-data
  namespace: dbos
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path     # k3s default provisioner

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-postgres
  namespace: dbos
  labels:
    app: auth-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate                 # БД не может работать в двух копиях на одном PVC
  selector:
    matchLabels:
      app: auth-postgres
  template:
    metadata:
      labels:
        app: auth-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: auth_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: AUTH_DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: AUTH_DB_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "auth_user", "-d", "auth_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: auth-postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgres
  namespace: dbos
spec:
  type: ClusterIP                  # только внутри namespace, наружу не публикуется
  selector:
    app: auth-postgres
  ports:
    - port: 5432
      targetPort: 5432
