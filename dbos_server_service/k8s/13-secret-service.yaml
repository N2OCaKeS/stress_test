apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-service-config
  namespace: dbos
data:
  APP_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: "8003"
  APP_LOG_LEVEL: INFO
  APP_DEBUG: "false"
  AUTH_SERVICE_URL: https://auth-service:8000
  LOGGING_SERVICE_URL: https://logging-service:8001
  INTROSPECT_TLS_VERIFY: "true"
  SLOWAPI_RATE_LIMIT: 500/minute
  SWEEP_ENABLED: "true"
  SWEEP_INTERVAL_SECONDS: "3600"
  BLOCKED_RETENTION_DAYS: "30"
  LOCKOUT_THRESHOLD: "10"
  LOCKOUT_WINDOW_SECONDS: "300"
  LOCKOUT_DURATION_SECONDS: "900"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-service
  namespace: dbos
  labels:
    app: secret-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: secret-service
  template:
    metadata:
      labels:
        app: secret-service
      annotations:
        prometheus.io/scrape: "false"
        dbos.monitoring/source: "/api/secret/v1/ready"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-service
          image: dbos/secret-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: secret-service-config
          env:
            # *_USER/*_PASSWORD объявлены до DATABASE_URL — kubelet раскрывает
            # $(VAR) только из ранее перечисленных env-записей.
            - name: SECRET_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SECRET_DB_USER }
            - name: SECRET_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SECRET_DB_PASSWORD }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_PASSWORD }
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SECRET_ENCRYPTION_KEY }
            - name: SECRET_ENCRYPTION_KEY_VERSION
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SECRET_ENCRYPTION_KEY_VERSION }
            - name: HKDF_SALT_HEX
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: HKDF_SALT_HEX }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(SECRET_DB_USER):$(SECRET_DB_PASSWORD)@secret-postgres:5432/secret_db"
            # Отдельный Redis DB index (0=worker broker, 1=auth rate-limit,
            # 2=secret rate-limit) — счётчики slowapi не пересекаются с другими сервисами.
            - name: RATE_LIMIT_STORAGE_URI
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/2"
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVICE_API_KEY }
            - name: SERVICE_API_KEYS
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SECRET_INBOUND_SERVICE_API_KEYS }
            - name: LOGGING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_SERVICE_API_KEY_SECRET }
            - name: INTROSPECT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SECRET_INTROSPECT_SERVICE_API_KEY }
          command: ["uvicorn"]
          args:
            - "src.main:app"
            - "--host=0.0.0.0"
            - "--port=8003"
            - "--workers=2"
          readinessProbe:
            httpGet:
              path: /api/secret/v1/ready
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/secret/v1/health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: secret-service
  namespace: dbos
spec:
  type: ClusterIP
  selector:
    app: secret-service
  ports:
    - port: 8003
      targetPort: 8003
