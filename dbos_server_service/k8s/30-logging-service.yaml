apiVersion: v1
kind: ConfigMap
metadata:
  name: logging-service-config
  namespace: dbos
data:
  APP_ENV: production
  DBOS_HTTPS_GUARD_DISABLED: "true"  # intra-cluster only deploy; внешний доступ только через Ingress
  APP_DEBUG: "false"
  APP_HOST: 0.0.0.0
  APP_PORT: "8001"
  APP_LOG_LEVEL: INFO
  # URL auth_service внутри namespace — для проверки Bearer JWT.
  # Plain http внутри cluster'а: сервисы стартуют uvicorn'ом без --ssl-*,
  # TLS-терминация только на Ingress. Изоляция — NetworkPolicy.
  AUTH_SERVICE_URL: http://auth-service:8000
  # DB connection pool: per-pod 5 + overflow 10 = max 15 conn × replicas=2 = 30,
  # с запасом помещается в PG max_connections=100.
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  # Override default 100/min — login-шторм аудит-эмитов из auth_service
  # упирается в бюджет и роняет события. 1000/min даёт запас.
  INGEST_RATE_LIMIT: "1000/minute"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
  namespace: dbos
  labels:
    app: logging-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime обновление
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      labels:
        app: logging-service
      annotations:
        # /metrics не выставлен (owner decision W41 — без отдельного Prometheus).
        # Audit-стрим — собственный источник телеметрии этого сервиса:
        # GET /api/logging/v1/events читается оператором / SIEM-rule'ами.
        # /api/logging/v1/ready отдаёт DB-ping + audit-drop counter.
        prometheus.io/scrape: "false"
        dbos.monitoring/source: "/api/logging/v1/ready"
        dbos.monitoring/audit-stream: "/api/logging/v1/events"
    spec:
      # AUDIT_DRAIN_TIMEOUT_SECONDS (default 2s) — финальный drain self-audit
      # outbox в lifespan; kubelet даёт грейс до SIGKILL, держим запас.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: logging-service
          image: dbos/logging-service:latest
          # Образ импортирован локально в containerd k3s (`ctr -n=k8s.io images import`).
          # IfNotPresent не пойдёт в docker.io, если тег уже есть на ноде.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: logging-service-config
          env:
            # LOGGING_DB_USER/PASSWORD объявлены до DATABASE_URL — $(VAR) expansion
            # резолвит только предыдущие env.
            - name: LOGGING_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_DB_USER }
            - name: LOGGING_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_DB_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(LOGGING_DB_USER):$(LOGGING_DB_PASSWORD)@logging-postgres:5432/logging_db"
            # Per-service ingest keys (единственный режим service-to-service auth).
            # JSON map identity → bearer. Operator должен синхронизировать ключи
            # с outbound LOGGING_SERVICE_API_KEY каждого внутреннего caller'а:
            # auth_service / server_service / config_service / server_worker.
            - name: SERVICE_API_KEYS
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_SERVICE_API_KEYS_JSON }
            # Outbound bearer для POST /introspect в auth_service. Production-
            # guard в Settings отвергает запуск без него и при совпадении со
            # значениями SERVICE_API_KEYS (key-separation).
            - name: INTROSPECT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_INTROSPECT_SERVICE_API_KEY }
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVICE_API_KEY }
            - name: LOGGING_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: INITIAL_ADMIN_USERNAME }
            - name: LOGGING_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: INITIAL_ADMIN_PASSWORD }
          # Миграции вынесены в отдельный Job logging-migrate (см. 45-migrations.yaml);
          # сюда стартуем сразу uvicorn'ом. Если schema не готова, /ready вернёт 503
          # и реплика не подхватит трафик до завершения Job'а.
          command: ["uvicorn"]
          args:
            - "src.main:app"
            - "--host=0.0.0.0"
            - "--port=8001"
            - "--workers=2"
          readinessProbe:
            httpGet:
              path: /api/logging/v1/ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/logging/v1/health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: logging-service
  namespace: dbos
spec:
  type: ClusterIP                # внешний доступ — через Ingress (50-ingress.yaml)
  selector:
    app: logging-service
  ports:
    - port: 8001
      targetPort: 8001
