apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: dbos
data:
  APP_ENV: production
  TRUSTED_PROXY_IPS: '["10.42.0.0/16"]'   # доверяем ingress-прокси (traefik pod-CIDR) для X-Forwarded-For
  DBOS_HTTPS_GUARD_DISABLED: "true"  # intra-cluster only deploy; внешний доступ только через Ingress
  APP_HOST: 0.0.0.0
  APP_PORT: "8000"
  APP_LOG_LEVEL: INFO
  APP_DEBUG: "false"
  ACCESS_TOKEN_TTL_MINUTES: "10"
  REFRESH_TOKEN_TTL_DAYS: "14"
  # URL logging_service внутри namespace. Plain http внутри cluster'а:
  # сервисы стартуют uvicorn'ом без --ssl-*, TLS-терминация только на Ingress.
  # Изоляция cluster-internal трафика — NetworkPolicy (80-networkpolicy.yaml).
  LOGGING_SERVICE_URL: http://logging-service:8001
  # DB connection pool: per-pod 5 + overflow 10 = max 15 conn × replicas=2 = 30,
  # с запасом помещается в PG max_connections=100.
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  # Docker registry token-flow
  DOCKER_REGISTRY_ISSUER: auth_service
  DOCKER_TOKEN_TTL_MINUTES: "5"
  # DOCKER_REGISTRY_SERVICE — впишите hostname вашего реального registry
  DOCKER_REGISTRY_SERVICE: registry.local:5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: dbos
  labels:
    app: auth-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        # /metrics не выставлен (owner decision W41 — без отдельного Prometheus).
        # Operational-counter'ы (failed-login, lockout, audit-drop)
        # доступны через /api/auth/v1/ready JSON-payload и аудит-канал.
        prometheus.io/scrape: "false"
        dbos.monitoring/source: "/api/auth/v1/ready"
    spec:
      terminationGracePeriodSeconds: 45
      # auth-service не дёргает kube API — SA-токен не нужен. Уберём mount,
      # чтобы скомпрометированный pod не мог говорить с apiserver.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: dbos/auth-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: auth-service-config
          env:
            # AUTH_DB_USER/PASSWORD объявлены до DATABASE_URL — kubelet
            # подставляет $(VAR) только из ранее объявленных env-записей.
            - name: AUTH_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: AUTH_DB_USER }
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: AUTH_DB_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(AUTH_DB_USER):$(AUTH_DB_PASSWORD)@auth-postgres:5432/auth_db"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: AUTH_SECRET_KEY }
            - name: DOCKER_RSA_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: DOCKER_RSA_PRIVATE_KEY }
            # outbound bearer audit-emit'ов в loging_service. Per-caller
            # значение (auth_service ↔ LOGGING_SERVICE_API_KEY_AUTH) — на
            # стороне loging_service оно совпадает с LOGGING_SERVICE_API_KEYS_JSON
            # под идентичностью auth_service.
            - name: LOGGING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_SERVICE_API_KEY_AUTH }
            # legacy single bearer для service-to-service. Используется как
            # fallback, если SERVICE_API_KEYS (см. ниже) окажется пустым —
            # тогда auth_service отбивает по этому единому ключу.
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVICE_API_KEY }
            # inbound per-caller bearer map. Сейчас покрывает
            # loging_service / server_service / secret_service — все, кто
            # дёргает /authorization/introspect. Без этой map'ы auth_service
            # в production-конфиге не может различить caller'ов.
            - name: SERVICE_API_KEYS
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: AUTH_INBOUND_SERVICE_API_KEYS_JSON }
            - name: INITIAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: INITIAL_ADMIN_USERNAME }
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: INITIAL_ADMIN_PASSWORD }
            - name: INITIAL_ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: INITIAL_ADMIN_EMAIL }
            # Отключение форс-смены пароля admin при первом входе. Дефолт "false"
            # (форс включён). Оператор ставит "true" через deploy.env
            # (DBOS_BOOTSTRAP_FORCE_PASSWORD_CHANGE=false), если хочет входить под
            # заранее заданным паролем без обязательной смены.
            - name: DBOS_BOOTSTRAP_NO_FORCE_CHANGE
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: DBOS_BOOTSTRAP_NO_FORCE_CHANGE }
            # Готовый bot-токен воркера. auth_service на старте идемпотентно
            # заводит под него системный отдел, роль worker_bot@server_service
            # и бота server_worker — оператору не нужно делать это руками.
            # Тот же токен монтируется в server_worker (WORKER_BOT_TOKEN).
            - name: WORKER_BOT_TOKEN
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_BOT_TOKEN }
            - name: SECRET_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SECRET_INTERNAL_API_KEY }
            # Per-IP rate-limit storage. `memory://` fallback в multi-replica
            # деплое не работает: round-robin ingress даёт атакующему
            # `replicas × LOGIN_RATE_LIMIT` попыток. Используем общий Redis
            # (тот же экземпляр, что и server_worker/server_service).
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_PASSWORD }
            # RATE_LIMIT_STORAGE_URI должен идти после REDIS_PASSWORD для $(VAR)-expansion.
            - name: RATE_LIMIT_STORAGE_URI
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
          # Миграции вынесены в Job auth-migrate (см. 45-migrations.yaml).
          command: ["uvicorn"]
          args:
            - "src.main:app"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--workers=2"
          # startupProbe закрывает окно "DB ещё не отвечает / connection pool
          # прогревается". До успеха startupProbe livenessProbe не считается,
          # т.е. медленный старт не уронит pod в CrashLoopBackOff.
          # 30 * 5s = 2.5 min grace на ready.
          startupProbe:
            httpGet:
              path: /api/auth/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/auth/v1/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/auth/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: dbos
spec:
  type: ClusterIP                # внешний доступ — через Ingress (50-ingress.yaml)
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
