apiVersion: v1
kind: ConfigMap
metadata:
  name: server-service-config
  namespace: dbos
data:
  APP_ENV: production
  DBOS_HTTPS_GUARD_DISABLED: "true"  # intra-cluster only deploy; внешний доступ только через Ingress
  APP_HOST: 0.0.0.0
  APP_PORT: "8002"
  APP_LOG_LEVEL: INFO
  # Cluster-internal URLs соседних сервисов.
  # Plain http внутри cluster'а: сервисы стартуют uvicorn'ом без --ssl-*,
  # TLS-терминация только на Ingress. Изоляция — NetworkPolicy.
  AUTH_SERVICE_URL: http://auth-service:8000
  LOGGING_SERVICE_URL: http://logging-service:8001
  # introspect идёт по plain http — verify не применим.
  INTROSPECT_TLS_VERIFY: "false"
  # Internal endpoints (worker → server_service): требовать
  # `X-Target-Department-Id` от caller'а. В проде ОБЯЗАТЕЛЬНО true.
  INTERNAL_REQUIRE_DEPT_HEADER: "true"
  # slowapi: глобальный per-IP rate-limit. Health/ready исключены.
  SLOWAPI_RATE_LIMIT: "500/minute"
  # DB connection pool: per-pod 5 + overflow 10 = max 15 conn × replicas=2 = 30,
  # с запасом помещается в PG max_connections=100.
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-service
  namespace: dbos
  labels:
    app: server-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime обновление
  selector:
    matchLabels:
      app: server-service
  template:
    metadata:
      labels:
        app: server-service
      annotations:
        # /metrics не выставлен (owner decision W41 — без отдельного Prometheus).
        # Operational-counter'ы выставлены в payload /api/server/v1/ready:
        # dispatch_outbox_pending_depth, secrets_decrypt_failures, dropped_429.
        # Подробнее — obsidian/infra/Observability.md.
        prometheus.io/scrape: "false"
        dbos.monitoring/source: "/api/server/v1/ready"
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server-service
          image: dbos/server-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: server-service-config
          env:
            # Все *_USER/*_PASSWORD/REDIS_PASSWORD объявлены до DATABASE_URL и
            # SERVER_WORKER_DATABASE_URL — kubelet раскрывает $(VAR) только из
            # ранее объявленных env-записей.
            - name: SERVER_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_DB_USER }
            - name: SERVER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_DB_PASSWORD }
            - name: WORKER_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_DB_USER }
            - name: WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_DB_PASSWORD }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(SERVER_DB_USER):$(SERVER_DB_PASSWORD)@server-postgres:5432/server_db"
            - name: SERVER_WORKER_DATABASE_URL
              value: "postgresql+psycopg://$(WORKER_DB_USER):$(WORKER_DB_PASSWORD)@worker-postgres:5432/worker_db"
            - name: SERVER_WORKER_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            # Шифрование хранимых паролей (server accounts + IPMI).
            # AES-256-GCM + HKDF-SHA256 от мастер-ключа. Версия активного
            # ключа пишется в новые ciphertext'ы как `v<N>$...`.
            - name: SERVER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_ENCRYPTION_KEY }
            - name: SERVER_ENCRYPTION_KEY_VERSION
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_ENCRYPTION_KEY_VERSION }
            - name: HKDF_SALT_HEX
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: HKDF_SALT_HEX }
            # Envelope-шифрование Redis-stash'а кред между server_service и
            # server_worker (provision/prepare dispatch). Тот же ключ mount'ится
            # в 60-server-worker.yaml — обязан совпадать байт-в-байт.
            - name: REDIS_STASH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_STASH_ENCRYPTION_KEY }
            - name: REDIS_STASH_ENCRYPTION_KEY_VERSION
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_STASH_ENCRYPTION_KEY_VERSION }
            # SERVICE_API_KEY — outbound bearer для introspect/service-access
            # в auth_service. Должен совпадать с SERVICE_API_KEYS[server_service]
            # на стороне auth_service.
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_SERVICE_API_KEY }
            # SERVICE_API_KEYS — inbound bearer'ы (worker → server_service
            # internal endpoints) в формате per-service map.
            - name: SERVICE_API_KEYS
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_INBOUND_SERVICE_API_KEYS }
            # Per-caller bearer для audit-emit'ов в loging_service.
            # loging_service ищет identity в LOGGING_SERVICE_API_KEYS_JSON по
            # заголовку X-Service-Identity: server_service.
            - name: LOGGING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_SERVICE_API_KEY_SERVER }
          # Миграции вынесены в Job server-migrate (см. 45-migrations.yaml).
          command: ["uvicorn"]
          args:
            - "src.main:app"
            - "--host=0.0.0.0"
            - "--port=8002"
            - "--workers=2"
            - "--proxy-headers"
          readinessProbe:
            httpGet:
              path: /api/server/v1/ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/server/v1/health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: server-service
  namespace: dbos
spec:
  type: ClusterIP                # внешний доступ — через Ingress (50-ingress.yaml)
  selector:
    app: server-service
  ports:
    - port: 8002
      targetPort: 8002
