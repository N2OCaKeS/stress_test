apiVersion: v1
kind: ConfigMap
metadata:
  name: server-worker-config
  namespace: dbos
data:
  APP_ENV: production
  WORKER_LOG_LEVEL: INFO
  # Cluster-internal URLs соседних сервисов. Plain http: сервисы стартуют
  # uvicorn'ом без --ssl-*, TLS-терминация только на Ingress. Изоляция —
  # NetworkPolicy.
  AUTH_SERVICE_URL: http://auth-service:8000
  LOGGING_SERVICE_URL: http://logging-service:8001
  SERVER_SERVICE_URL: http://server-service:8002
  # DB connection pool: per-pod 5 + overflow 10 = max 15 conn × replicas=2 = 30,
  # с запасом помещается в PG max_connections=100.
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  # Slot iDRAC root-account для rotate-password. Dell = 2, HPE = 1, SMC = 3.
  IPMI_USER_ID: "2"
  # iDRAC ходит с self-signed cert'ом. Включай "true" только если все BMC
  # стенда провижены из внутреннего CA.
  REDFISH_VERIFY_TLS: "false"
  REDFISH_TIMEOUT_SECONDS: "30"
  # Periodic `secrets.reencrypt_lazy` — доедает миграцию шифрования паролей
  # после bump'а SERVER_ENCRYPTION_KEY_VERSION.
  SECRETS_REENCRYPT_ENABLED: "true"
  SECRETS_REENCRYPT_INTERVAL_SECONDS: "300"
  SECRETS_REENCRYPT_BATCH_SIZE: "100"
  # Heartbeat + orphan-sweep требуют scheduler.
  SCHEDULER_ENABLED: "true"
  WORKER_SHUTDOWN_TIMEOUT_SECONDS: "30"
  WORKER_ORPHAN_THRESHOLD_SECONDS: "1800"
  WORKER_HEARTBEAT_STALE_SECONDS: "300"
  WORKER_HEARTBEAT_CLEANUP_THRESHOLD_SECONDS: "604800"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-worker
  namespace: dbos
  labels:
    app: server-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: server-worker
  template:
    metadata:
      labels:
        app: server-worker
      annotations:
        # /metrics и HTTP-probe'ов нет (taskiq-consumer без FastAPI).
        # Здоровье читается через worker_heartbeats в worker_db, аудит-канал
        # и audit_outbox.pending_depth (см. obsidian/infra/Observability.md).
        prometheus.io/scrape: "false"
        dbos.monitoring/source: "worker_heartbeats table + audit stream"
    spec:
      # terminationGracePeriodSeconds = WORKER_SHUTDOWN_TIMEOUT_SECONDS (30) +
      # буфер на mark_pending_for_retry и BMC-cleanup. Превышение — SIGKILL,
      # running task'и попадают в orphan-sweep следующим циклом.
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server-worker
          image: dbos/server-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: server-worker-config
          env:
            # *_USER/*_PASSWORD/REDIS_PASSWORD объявлены до DATABASE_URL и
            # REDIS_URL — kubelet раскрывает $(VAR) только из ранее объявленных.
            - name: WORKER_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_DB_USER }
            - name: WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_DB_PASSWORD }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(WORKER_DB_USER):$(WORKER_DB_PASSWORD)@worker-postgres:5432/worker_db"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            # DSN БД server_service — dispatch_outbox publisher воркера читает
            # диспетчнутые задачи из server_db и кладёт в broker. Без него
            # Settings падает в production и воркер крашлупит.
            - name: SERVER_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_DB_USER }
            - name: SERVER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_DB_PASSWORD }
            - name: SERVER_SERVICE_DATABASE_URL
              value: "postgresql+psycopg://$(SERVER_DB_USER):$(SERVER_DB_PASSWORD)@server-postgres:5432/server_db"
            # PAT (bot-token) для bearer-аутентификации worker'а в /internal/*
            # endpoints server_service.
            - name: WORKER_BOT_TOKEN
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_BOT_TOKEN }
            # LOGGING_SERVICE_API_KEY — POST /events в loging_service.
            # Per-caller bearer, valueFrom указывает на ключ под идентичностью
            # server_worker в LOGGING_SERVICE_API_KEYS_JSON.
            - name: LOGGING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_SERVICE_API_KEY_WORKER }
            # SERVICE_API_KEY — outbound для introspect собственного
            # bot-токена worker'а в auth_service.
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_SERVICE_API_KEY }
            # Envelope-расшифровка Redis-stash'а кред, положенного server_service'ом
            # (provision/prepare dispatch). Mount'ится из того же Secret'а, что и
            # у server_service'а — обязан совпадать байт-в-байт, иначе worker
            # увидит STASH_DECRYPT_FAILED и task FAILED.
            - name: REDIS_STASH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_STASH_ENCRYPTION_KEY }
            - name: REDIS_STASH_ENCRYPTION_KEY_VERSION
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_STASH_ENCRYPTION_KEY_VERSION }
            - name: HKDF_SALT_HEX
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: HKDF_SALT_HEX }
            # В k8s hostname == имя pod'а: достаточно для стабильного worker_id.
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # runAsUser=1000 без passwd-entry → asyncssh (SSH к боксам) падает
            # на getpass.getuser(). Задаём локальное имя явно.
            - name: USER
              value: "worker"
            - name: LOGNAME
              value: "worker"
          # Миграции вынесены в Job worker-migrate (см. 45-migrations.yaml).
          command: ["taskiq"]
          args:
            - "worker"
            - "src.main:broker"
            - "--workers=2"
          # Worker — taskiq consumer без HTTP. Liveness даём exec'ом через
          # pgrep: ищем процесс taskiq (command-line). Если процесс умер, но
          # контейнер ещё жив (например, deadlock основного потока taskiq) —
          # kubelet прибьёт под и k3s сделает рестарт. failureThreshold=5 *
          # period 30s = 2.5 min — даём worker'у пережить ipmitool-таймауты.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "grep -aql taskiq /proc/[0-9]*/cmdline 2>/dev/null || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "grep -aql taskiq /proc/[0-9]*/cmdline 2>/dev/null || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          # Readiness в полноценном смысле для taskiq-consumer без HTTP не
          # выразима: scheduler пишет heartbeat в worker_heartbeats, oрphan-sweep
          # ловит зависшие в БД (см. obsidian/infra/Observability.md).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
