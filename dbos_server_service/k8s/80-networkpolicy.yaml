# NetworkPolicy для namespace dbos.
# Базовая модель: default-deny + явные allow по подграфам.
# k3s по умолчанию ставит flannel + CNI с поддержкой NetworkPolicy (через
# kube-router, активируется флагом `--flannel-backend=host-gw` либо
# установкой Calico/Cilium). Без NP-aware CNI правила игнорируются —
# проверяй `kubectl -n dbos describe networkpolicy` + e2e curl из соседнего pod'а.
#
# Egress: default-deny + per-pod allow-list для DNS и соседних сервисов.
# server_worker оставлен с egress allow-all на 0.0.0.0/0:443/623 для BMC —
# Redfish/ipmitool ходят по подсетям, известным только operator'у. server_service
# ходит к docker-registry: NP не закрывает (см. server-service-egress).

# ────────────────────────────────────────────────────────────────────────────
# Default deny ingress для всего namespace.
# Любой pod, на который не повешено иное правило, не принимает соединения.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: dbos
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# ────────────────────────────────────────────────────────────────────────────
# auth-service: вход от ingress-контроллера (Traefik в kube-system)
# и от соседей по namespace (logging/server/worker делают introspect).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Traefik ingress controller (k3s ставит в kube-system).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        # Соседи по namespace dbos — для introspect / docker token / OAuth.
        - podSelector:
            matchLabels:
              app: logging-service
        - podSelector:
            matchLabels:
              app: server-service
        - podSelector:
            matchLabels:
              app: server-worker
        - podSelector:
            matchLabels:
              app: secret-service
      ports:
        - protocol: TCP
          port: 8000

---
# ────────────────────────────────────────────────────────────────────────────
# logging-service: вход от ingress-контроллера (reader/admin API)
# и от всех caller'ов (audit ingest).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logging-service-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: logging-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: server-service
        - podSelector:
            matchLabels:
              app: server-worker
        - podSelector:
            matchLabels:
              app: secret-service
      ports:
        - protocol: TCP
          port: 8001

---
# ────────────────────────────────────────────────────────────────────────────
# server-service: наружу через Ingress (планируется), вход от worker'а
# на /internal/* endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-service-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: server-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app: server-worker
      ports:
        - protocol: TCP
          port: 8002

---
# ────────────────────────────────────────────────────────────────────────────
# auth-postgres: только auth-service и migration Job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-postgres-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: auth-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              job: auth-migrate
        - podSelector:
            matchLabels:
              app: pg-backup
              target: auth-postgres
      ports:
        - protocol: TCP
          port: 5432

---
# logging-postgres: только logging-service и его migration Job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logging-postgres-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: logging-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: logging-service
        - podSelector:
            matchLabels:
              job: logging-migrate
        - podSelector:
            matchLabels:
              app: pg-backup
              target: logging-postgres
      ports:
        - protocol: TCP
          port: 5432

---
# ────────────────────────────────────────────────────────────────────────────
# server-postgres / worker-postgres / redis: пока в манифестах нет,
# но правила задаём впрок — operator подложит сами Deployment'ы.
# server-postgres ↔ server-service + server-migrate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-postgres-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: server-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: server-service
        - podSelector:
            matchLabels:
              job: server-migrate
      ports:
        - protocol: TCP
          port: 5432

---
# worker-postgres ↔ server-worker + server-service (dispatch INSERT'ы в tasks).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-postgres-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: worker-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: server-worker
        - podSelector:
            matchLabels:
              app: server-service
        - podSelector:
            matchLabels:
              job: worker-migrate
      ports:
        - protocol: TCP
          port: 5432

---
# Redis broker: server_service publish (db 0), server_worker consume (db 0),
# auth_service rate-limit storage (db 1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: server-service
        - podSelector:
            matchLabels:
              app: server-worker
        - podSelector:
            matchLabels:
              app: secret-service
      ports:
        - protocol: TCP
          port: 6379

---
# dbos-swagger-ui принимает HTTP от Traefik (kube-system).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dbos-swagger-ui-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: dbos-swagger-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080

---
# web-ui (SPA) принимает HTTP от Traefik (kube-system) на catch-all /.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ui-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: web-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080

---
# ────────────────────────────────────────────────────────────────────────────
# secret-service: вход от ingress-контроллера и от соседей по namespace
# (server_service, server_worker и auth_service дёргают /internal/* для
# управления записями и cascade-revoke).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secret-service-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: secret-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: logging-service
        - podSelector:
            matchLabels:
              app: server-service
        - podSelector:
            matchLabels:
              app: server-worker
      ports:
        - protocol: TCP
          port: 8003

---
# secret-postgres: только secret-service и его migration Job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secret-postgres-ingress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: secret-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: secret-service
        - podSelector:
            matchLabels:
              job: secret-migrate
        - podSelector:
            matchLabels:
              app: pg-backup
              target: secret-postgres
      ports:
        - protocol: TCP
          port: 5432

---
# ────────────────────────────────────────────────────────────────────────────
# EGRESS секция: default-deny + allow-list per pod-group.
# Поведение NP: если у pod'а есть хотя бы одно правило с Egress в policyTypes,
# действуют allow-only. default-deny ниже включает Egress для всех pod'ов,
# а каждая per-app политика разрешает свой allow-list.
#
# DNS: разрешён для всех (port 53 UDP/TCP в kube-system) — иначе resolvconf
# в pod'е не сможет резолвить даже cluster-internal hostname'ы.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: dbos
spec:
  podSelector: {}
  policyTypes:
    - Egress

---
# Общий allow на DNS в kube-system для всего namespace. CoreDNS слушает на
# port 53 UDP (primary) и TCP (fallback при response > 512 байт).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: dbos
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# auth-service: outbound в logging (audit), secret (admin proxy), redis
# (rate-limit storage) и собственный auth-postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: auth-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: logging-service
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: secret-service
      ports:
        - protocol: TCP
          port: 8003
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

---
# logging-service: outbound в auth (introspect) и собственный logging-postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logging-service-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: logging-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: logging-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - protocol: TCP
          port: 8000

---
# server-service: outbound в auth (introspect), logging (audit), secret
# (cascade-revoke), redis (dispatch broker), server-postgres + worker-postgres.
# Также наружу — docker-registry (для image pull token verify); IP/CIDR
# registry задаёт operator, политика оставлена с egress allow на 0.0.0.0/0:443/5000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-service-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: server-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: server-postgres
        - podSelector:
            matchLabels:
              app: worker-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: logging-service
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: secret-service
      ports:
        - protocol: TCP
          port: 8003
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # kube-apiserver: server_service с KEYSTORE_BACKEND=k8s патчит Secret
    # dbos-server-encryption-keys (master-ключи шифрования) через k8s API.
    # In-cluster клиент идёт на kubernetes.default ClusterIP:443, который
    # DNAT'ится на control-plane node:6443 — открыты оба порта. Operator
    # должен сузить ipBlock'ом на IP control-plane ноды.
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # docker-registry token verify. Hostname/IP задаёт operator (см. ConfigMap
    # DOCKER_REGISTRY_SERVICE) — конкретный CIDR закрытой сети operator должен
    # подложить в отдельную NP с ipBlock'ом. Здесь оставлены типовые порты.
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5000

---
# secret-service: outbound в auth (introspect), logging (audit), redis
# (rate-limit storage), собственный secret-postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secret-service-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: secret-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: secret-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: logging-service
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # kube-apiserver: secret_service с KEYSTORE_BACKEND=k8s патчит Secret
    # dbos-secret-encryption-keys (master-ключи шифрования) через k8s API.
    # In-cluster клиент идёт на kubernetes.default ClusterIP:443, который
    # DNAT'ится на control-plane node:6443 — открыты оба порта. Operator
    # должен сузить ipBlock'ом на IP control-plane ноды.
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

---
# server-worker: outbound в auth (introspect), logging (audit), server_service
# (/internal), redis (broker), собственный worker-postgres.
# Плюс — BMC стендов: Redfish (443/TCP), ipmitool (623/UDP). CIDR подсетей BMC
# задаёт operator; здесь allow на 0.0.0.0/0 для этих портов, потому что в
# закрытой сети carрта подсетей меняется чаще, чем перевыкатывается манифест.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: server-worker-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: server-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: worker-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: auth-service
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: logging-service
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: server-service
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # Managed-server connectivity: SSH (console, prepare, inventory, packages,
    # provision) — порт SSH произвольный per-server, поэтому разрешаем любой
    # TCP; плюс Redfish (443/TCP входит в общий TCP) и ipmitool (623/UDP).
    # Operator должен сузить ipBlock'ом в отдельной NP, когда CIDR стенда
    # зафиксируется.
    - to: []
      ports:
        - protocol: TCP
        - protocol: UDP
          port: 623

---
# swagger-ui: статика, серверу нужны только DNS-резолвы (получены через
# allow-dns-egress выше). Никаких backend-вызовов; spec.json mount'ятся в
# pod через ConfigMap. Явный allow-list пустой — default-deny закрывает всё.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dbos-swagger-ui-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: dbos-swagger-ui
  policyTypes:
    - Egress
  egress: []

---
# Egress allow для всех migrate Job'ов. Они короткоживущие, ходят в postgres +
# logging_service (audit emit). Используют label `job: <name>-migrate`, не
# попадают под `*-service-egress` (тот по `app:`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate-jobs-egress
  namespace: dbos
spec:
  podSelector:
    matchExpressions:
      - key: job
        operator: In
        values:
          - auth-migrate
          - logging-migrate
          - server-migrate
          - worker-migrate
          - secret-migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - auth-postgres
                  - logging-postgres
                  - server-postgres
                  - worker-postgres
                  - secret-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: logging-service
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

---
# ────────────────────────────────────────────────────────────────────────────
# CronJob egress: rotation-scheduler / master-keys-backup / secret-full-backup
# / pg-restore-drill.
#
# Все четыре ходят к kube-apiserver через kubectl (rollout restart, get/exec,
# apply, namespace create/delete). Прямого доступа к postgres/redis/services
# не нужно: rotation-helpers и pg_restore_drill дёргают БД/redis через
# `kubectl exec deploy/... -- psql/redis-cli`. То же — для curl
# /internal/migration_status (через `kubectl exec deploy/server -- curl
# localhost:8002/...`).
#
# k3s kube-apiserver слушает на 6443/TCP на каждой ноде; внутри кластера
# Service `kubernetes.default.svc` отображается на ClusterIP с port 443/TCP.
# NetworkPolicy фильтрует ДО iptables-DNAT'а ClusterIP → endpoint, поэтому
# allow открываем по 443/6443 на ipBlock 0.0.0.0/0 (как в server-service-egress
# для docker-registry): operator сужает ipBlock'ом в overlay-NP, когда CIDR
# мастер-нод зафиксируется.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rotation-scheduler-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: rotation-scheduler
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: master-keys-backup-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: master-keys-backup
  policyTypes:
    - Egress
  egress:
    # kube-apiserver — backup_master_keys.sh патчит Secret через kubectl.
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # offsite-sync sidecar: rsync daemon (873/TCP) либо ssh (22/TCP). Дальний
    # хост CIDR неизвестен на этапе манифеста — оставляем allow-all, operator
    # сужает в env-overlay (см. 105-offsite-backup ConfigMap).
    - to: []
      ports:
        - protocol: TCP
          port: 873
        - protocol: TCP
          port: 22

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secret-full-backup-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: secret-full-backup
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to: []
      ports:
        - protocol: TCP
          port: 873
        - protocol: TCP
          port: 22

---
# pg-restore-drill: kubectl create ns, kubectl apply temp postgres pod,
# kubectl exec для psql внутрь prod-pg и drill-pg. Прямого 5432 не открывает.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-restore-drill-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: pg-restore-drill
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

---
# pg-backup CronJob'ы (5 шт, label app=pg-backup + target=<deploy>) ходят
# напрямую к своему postgres на 5432 + (через offsite-sync sidecar) rsync на
# внешний хост. Одной NP покрываем все 5: каждый pod-backup'а может говорить
# с любой из 5 postgres-БД — это шире чем нужно, но не критично: у каждого
# pod'а в env только пароль СВОЕЙ БД (см. TARGET_DB / PGPASSWORD), так что
# доступ к чужой постгресе он не реализует. Сужать ipBlock'ом per-target
# смысла нет — все 5 postgres в том же namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-backup-egress
  namespace: dbos
spec:
  podSelector:
    matchLabels:
      app: pg-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - auth-postgres
                  - logging-postgres
                  - server-postgres
                  - worker-postgres
                  - secret-postgres
      ports:
        - protocol: TCP
          port: 5432
    # offsite-sync sidecar: rsync daemon (873/TCP) либо ssh (22/TCP).
    - to: []
      ports:
        - protocol: TCP
          port: 873
        - protocol: TCP
          port: 22
