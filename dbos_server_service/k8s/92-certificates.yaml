# Leaf-сертификаты для сервисов, подписанные dbos-ca-issuer.
#
# Параметры (одинаковые для всех):
#   duration:    8760h  = 1 год
#   renewBefore: 720h   = 30 дней (cert-manager Renewal Controller перевыпустит
#                                   автоматически за 30 дней до истечения)
#
# Каждый Certificate указывает несколько DNS-имён:
#   - публичный hostname для Ingress (например auth.dbos.local)
#   - cluster-internal short и FQDN — чтобы тот же сертификат подходил для
#     service-to-service вызовов внутри namespace dbos
#
# Secret-имена должны совпадать с теми, что использует Ingress
# (50-ingress.yaml, секция tls.secretName).

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-service-tls
  namespace: dbos
spec:
  secretName: auth-service-tls
  duration: 8760h
  renewBefore: 720h
  commonName: auth.dbos.local
  dnsNames:
    - auth.dbos.local
    - auth-service
    - auth-service.dbos
    - auth-service.dbos.svc
    - auth-service.dbos.svc.cluster.local
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  issuerRef:
    name: dbos-ca-issuer
    kind: Issuer
    group: cert-manager.io

