apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dbos

resources:
  - 00-namespace.yaml
  - 10-postgres-auth.yaml
  - 10-postgres-server.yaml
  - 10-postgres-worker.yaml
  - 11-postgres-logging.yaml
  - 12-redis.yaml            # Redis для taskiq broker + slowapi rate-limit storage
  - 20-secrets.yaml          # генерируется scripts/k8s/gen_secrets.sh
  - 45-migrations.yaml       # Alembic Job'ы на каждый сервис (применять до Deployment'ов)
  - 30-logging-service.yaml
  - 40-auth-service.yaml
  - 50-server-service.yaml
  - 60-server-worker.yaml
  - 70-pdb.yaml              # PodDisruptionBudget на все сервисы с replicas=2
  - 80-networkpolicy.yaml    # default-deny ingress + явные allow между подграфами
  - 50-ingress.yaml          # TLS-secret'ы выпускает cert-manager (91/92-*.yaml)
  - 55-swagger-ui.yaml       # общий Swagger UI для трёх сервисов на /docs
  - 100-postgres-backup.yaml # CronJob pg_dump для auth/logging кластеров
  - 101-backup-pvc.yaml      # PV под бэкапы (общий на оба CronJob'а)

# 91-ca-issuer.yaml и 92-certificates.yaml в этот kustomize НЕ включены —
# их применяет scripts/k8s/install_cert_manager.sh до основного apply,
# потому что они зависят от CRD cert-manager, которого тут ещё нет.
