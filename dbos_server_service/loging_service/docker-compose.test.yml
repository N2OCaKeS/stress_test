version: "3.9"

# loging_service isolated test stack.
#
# Usage:
#   docker compose -f docker-compose.test.yml run --rm test-runner   # all tests
#   docker compose -f docker-compose.test.yml down -v                 # cleanup

services:

  test-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: logging_db_test
      POSTGRES_USER: logging_user
      POSTGRES_PASSWORD: logging_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logging_user -d logging_db_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://logging_user:logging_password@test-postgres:5432/logging_db_test
      PYTHONPATH: /app
    depends_on:
      test-postgres:
        condition: service_healthy
    command: ["pytest", "tests/", "-v", "--tb=short"]
