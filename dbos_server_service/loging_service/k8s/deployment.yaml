apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
  namespace: dbos
  labels:
    app: logging-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      labels:
        app: logging-service
    spec:
      containers:
        - name: logging-service
          image: dbos/logging-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: logging-service-config
            - secretRef:
                name: logging-service-secrets
          env:
            # Outbound bearer для POST /introspect в auth_service. Per-service
            # SERVICE_API_KEYS — единственный режим service-to-service auth,
            # legacy shared SERVICE_API_KEY удалён; production-guard в Settings
            # требует INTROSPECT_SERVICE_API_KEY и отдельный SERVICE_API_KEYS map.
            - name: INTROSPECT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_INTROSPECT_SERVICE_API_KEY }
          readinessProbe:
            httpGet:
              path: /api/logging/v1/ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/logging/v1/health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
