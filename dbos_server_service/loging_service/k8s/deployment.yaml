apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-service
  namespace: dbos
  labels:
    app: logging-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logging-service
  template:
    metadata:
      labels:
        app: logging-service
    spec:
      containers:
        - name: logging-service
          image: dbos/logging-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: logging-service-config
            - secretRef:
                name: logging-service-secrets
          readinessProbe:
            httpGet:
              path: /api/logging/v1/ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/logging/v1/health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
