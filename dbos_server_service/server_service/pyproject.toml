[tool.poetry]
name = "server-service"
version = "0.1.0"
description = "DBOS server management service (servers, server accounts, IPMI/iDRAC/iLO, disks, packages)"
authors = []
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.12"
uvicorn = { version = "0.34.0", extras = ["standard"] }
sqlalchemy = "2.0.40"
psycopg = { version = "3.2.6", extras = ["binary"] }
pydantic = "2.11.3"
pydantic-settings = "2.8.1"
alembic = "1.15.2"
PyJWT = "2.10.1"
cryptography = "44.0.3"
httpx = "0.28.1"
taskiq = "0.11.18"
taskiq-redis = "1.1.0"
slowapi = "0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "^1.0"
httpx = "0.28.1"
hypothesis = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
asyncio_mode = "auto"
