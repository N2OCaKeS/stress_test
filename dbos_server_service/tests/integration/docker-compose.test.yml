name: dbos-integration

# Full E2E integration stack for scenario tests.
#
# Spins up every DBOS service against shared infra (postgres + redis) plus
# a real openssh-server target for SSH-based scenarios (prepare/rotate/
# inventory/provision). All services use the same images that prod uses —
# the only delta is the test database names and a relaxed environment.
#
# Volumes:
#   mgmt-keys  — ed25519 keypair generated by `init-ssh-keys`. Mounted into
#                server-worker (priv key path) and test-runner (so python
#                tests can read the pubkey). Pre-populated once and reused.
#   bootstrap  — `/shared/.worker_pat` written by the seeder; read by the
#                worker on startup.
#
# Quick start:
#   docker compose -f tests/integration/docker-compose.test.yml up -d --wait
#   docker compose -f tests/integration/docker-compose.test.yml run --rm test-runner
#   docker compose -f tests/integration/docker-compose.test.yml down -v
#
# Each service exposes its standard URL inside the network:
#   auth-service     http://auth-service:8000
#   logging-service  http://logging-service:8001
#   server-service   http://server-service:8002
#   ssh-target       ssh://root@ssh-target:2222 (root password: test-root-pw)

services:

  # ── Shared infra ──────────────────────────────────────────────────────────

  test-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: postgres
    volumes:
      - ./init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user"]
      interval: 2s
      timeout: 5s
      retries: 30

  test-redis:
    image: redis:7-alpine
    # No password — test-only network, isolated from dev/prod stacks.
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # ── SSH target (real openssh-server) ──────────────────────────────────────
  # linuxserver/openssh-server provides sudo, useradd, usermod, chpasswd,
  # visudo, getent out of the box — that's everything the worker's prepare
  # task needs to bootstrap a management user.
  ssh-target:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Moscow"
      # USER_NAME cannot equal an existing /etc/passwd entry (linuxserver
      # halts init if it does). Bootstrap account is `dbosroot` (UID 1000);
      # it gets sudo so prepare-task can run useradd/chpasswd/visudo with
      # `sudo -S` exactly as it would against a real BMC-provisioned host.
      # PUID=0 is rejected because sshd refuses password auth for UID 0
      # under the default PermitRootLogin policy.
      USER_NAME: dbosroot
      USER_PASSWORD: test-root-pw
      PASSWORD_ACCESS: "true"
      SUDO_ACCESS: "true"
      # PUBLIC_KEY intentionally empty — prepare-task installs the
      # management key into /home/<mgmt_user>/.ssh/authorized_keys itself.
      PUBLIC_KEY: ""
    ports:
      - "2222:2222"
    healthcheck:
      # busybox `nc` is present in the linuxserver alpine base.
      test: ["CMD-SHELL", "nc -z localhost 2222 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ── One-shot: generate management keypair ─────────────────────────────────
  init-ssh-keys:
    image: alpine:3.20
    volumes:
      - mgmt-keys:/keys
      - ./init_ssh_keys.sh:/init_ssh_keys.sh:ro
    command: ["sh", "/init_ssh_keys.sh"]
    restart: "no"

  # ── loging_service ────────────────────────────────────────────────────────
  logging-service:
    build:
      context: ../../loging_service
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/logging_db_test
      SERVICE_API_KEY: test-logging-api-key
      AUTH_SERVICE_URL: http://auth-service:8000
      APP_LOG_LEVEL: WARNING
      INGEST_RATE_LIMIT: 100000/minute
    command: >
      sh -c "python -m alembic upgrade head &&
             exec uvicorn src.main:app --host 0.0.0.0 --port 8001"
    depends_on:
      test-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/api/logging/v1/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # ── auth_service ──────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ../../auth_service
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/auth_db_test
      SECRET_KEY: test-secret-key-for-integration-must-be-32-chars!
      ACCESS_TOKEN_TTL_MINUTES: "60"
      REFRESH_TOKEN_TTL_DAYS: "14"
      LOGGING_SERVICE_URL: http://logging-service:8001
      LOGGING_SERVICE_API_KEY: test-logging-api-key
      SERVICE_API_KEY: test-logging-api-key
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: "1234"
      INITIAL_ADMIN_EMAIL: admin@example.com
      APP_LOG_LEVEL: WARNING
      # Tests fire many login/introspect calls from a single test-runner
      # IP — production defaults (10/min, 60/min) trip 429s. Bumped to
      # effectively-off for the test stack only.
      LOGIN_RATE_LIMIT: 10000/minute
      REFRESH_RATE_LIMIT: 10000/minute
      INTROSPECT_RATE_LIMIT: 100000/minute
      DOCKER_TOKEN_RATE_LIMIT: 10000/minute
    command: >
      sh -c "python -m alembic upgrade head &&
             exec uvicorn src.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      test-postgres:
        condition: service_healthy
      logging-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/auth/v1/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # ── server_service ────────────────────────────────────────────────────────
  server-service:
    build:
      context: ../../server_service
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/server_db_test
      AUTH_SERVICE_URL: http://auth-service:8000
      LOGGING_SERVICE_URL: http://logging-service:8001
      LOGGING_SERVICE_API_KEY: test-logging-api-key
      SERVICE_API_KEY: test-logging-api-key
      SERVER_ENCRYPTION_KEY: test-server-encryption-key-do-not-use-anywhere-else
      SERVER_ENCRYPTION_KEY_VERSION: "2"
      SERVER_WORKER_DATABASE_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/worker_db_test
      SERVER_WORKER_REDIS_URL: redis://test-redis:6379/0
      APP_LOG_LEVEL: WARNING
    command: >
      sh -c "python -m alembic upgrade head &&
             exec uvicorn src.main:app --host 0.0.0.0 --port 8002"
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/api/server/v1/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # ── seeder (one-shot, before worker) ──────────────────────────────────────
  # Creates exactly the identities `server-worker` needs to start:
  # department `it`, bot `worker_bot_it` with the `worker_bot` server_service
  # role, and a PAT written to /shared/.worker_pat. The scenario tests build
  # additional fixtures (extra users, departments, servers) on top.
  #
  # We deliberately do NOT reuse scripts/seed_dev.py here — that script
  # seeds the full dev catalogue and fails when newer API contracts changed
  # in places it doesn't cover.
  seeder:
    image: python:3.12-slim
    environment:
      AUTH_URL: http://auth-service:8000
      SERVER_URL: http://server-service:8002
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "1234"
      SHARED_DIR: /shared
    volumes:
      - ./seed_worker_pat.py:/seed_worker_pat.py:ro
      - bootstrap:/shared
    command: >
      sh -c "pip config --global set global.index-url http://allta.devos.astralinux.ru:3141/root/release &&
             pip config --global set global.trusted-host allta.devos.astralinux.ru &&
             pip install --quiet --no-cache-dir 'httpx==0.28.1' &&
             python /seed_worker_pat.py"
    depends_on:
      auth-service:
        condition: service_healthy
      server-service:
        condition: service_healthy
    restart: "no"

  # ── server_worker ─────────────────────────────────────────────────────────
  # Reads its bot-token PAT from /shared/.worker_pat (written by seeder).
  # Reads management private key from /keys/id_ed25519 (written by init-ssh-keys).
  # The public key is read from /keys/id_ed25519.pub at startup and injected
  # into SSH_MANAGEMENT_PUBLIC_KEY via the inline shell.
  server-worker:
    build:
      context: ../../server_worker
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/worker_db_test
      REDIS_URL: redis://test-redis:6379/0
      SERVER_SERVICE_URL: http://server-service:8002
      AUTH_SERVICE_URL: http://auth-service:8000
      LOGGING_SERVICE_URL: http://logging-service:8001
      LOGGING_SERVICE_API_KEY: test-logging-api-key
      SERVICE_API_KEY: test-logging-api-key
      SSH_MANAGEMENT_USER: dbos
      SSH_MANAGEMENT_PRIVATE_KEY_PATH: /keys/id_ed25519
      WORKER_LOG_LEVEL: WARNING
      APP_ENV: test
    command: >
      sh -c "
        echo 'server-worker: waiting for /keys/id_ed25519.pub...';
        for i in $$(seq 1 60); do
          [ -s /keys/id_ed25519.pub ] && break;
          sleep 1;
        done;
        export SSH_MANAGEMENT_PUBLIC_KEY=\"$$(cat /keys/id_ed25519.pub)\";
        echo \"server-worker: pubkey loaded ($$SSH_MANAGEMENT_PUBLIC_KEY)\";
        echo 'server-worker: waiting for /shared/.worker_pat...';
        for i in $$(seq 1 120); do
          [ -s /shared/.worker_pat ] && break;
          sleep 1;
        done;
        if [ ! -s /shared/.worker_pat ]; then
          echo 'server-worker: ERROR — /shared/.worker_pat never appeared';
          exit 1;
        fi;
        export WORKER_BOT_TOKEN=\"$$(cat /shared/.worker_pat)\";
        echo 'server-worker: PAT loaded';
        python -m alembic upgrade head &&
        exec taskiq worker src.main:broker --workers 2
      "
    volumes:
      - mgmt-keys:/keys:ro
      - bootstrap:/shared:ro
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      server-service:
        condition: service_healthy
      init-ssh-keys:
        condition: service_completed_successfully
      seeder:
        condition: service_completed_successfully

  # ── Test runner ───────────────────────────────────────────────────────────
  # Mount the whole repo so pytest can import service src/ for direct DB
  # access fixtures (loging_db_engine, worker_db_engine).
  test-runner:
    build:
      context: ../..
      dockerfile: tests/Dockerfile.test
    environment:
      AUTH_SERVICE_URL: http://auth-service:8000
      LOGGING_SERVICE_URL: http://logging-service:8001
      SERVER_SERVICE_URL: http://server-service:8002
      LOGGING_SERVICE_API_KEY: test-logging-api-key
      AUTH_DB_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/auth_db_test
      LOGGING_DB_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/logging_db_test
      SERVER_DB_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/server_db_test
      WORKER_DB_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/worker_db_test
      REDIS_URL: redis://test-redis:6379/0
      SSH_TARGET_HOST: ssh-target
      SSH_TARGET_PORT: "2222"
      SSH_TARGET_ROOT_USER: dbosroot
      SSH_TARGET_ROOT_PASSWORD: test-root-pw
      SSH_MGMT_USER: dbos
      SSH_MGMT_PRIVATE_KEY_PATH: /keys/id_ed25519
      DBOS_ADMIN_USERNAME: admin
      DBOS_ADMIN_PASSWORD: "1234"
      # Existing auth↔logging fixtures hard-coded `E2E_ADMIN_*` defaults
      # from seed_e2e.py; our stack uses the auth_service's own
      # INITIAL_ADMIN bootstrap (admin / 1234) instead, so override both.
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: "1234"
    volumes:
      - ../..:/repo:ro
      - mgmt-keys:/keys:ro
      - bootstrap:/shared:ro
    depends_on:
      auth-service:
        condition: service_healthy
      logging-service:
        condition: service_healthy
      server-service:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
      ssh-target:
        condition: service_healthy
    working_dir: /repo
    command: ["pytest", "tests/integration/", "-v", "--tb=short"]

volumes:
  mgmt-keys:
  bootstrap:
