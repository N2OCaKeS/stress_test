<!doctype html>
<html lang="ru" data-theme="vscode-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP для SPA. В dev Vite инжектит HMR-клиент и подменяет ассеты с
      127.0.0.1:5173 / ws://127.0.0.1:5173 — поэтому 'unsafe-inline' для
      script-src и явный connect-src на ws не годятся. Vite plugin
      `transformIndexHtml` мог бы менять CSP по режиму, но мы пока
      ограничиваемся production-safe вариантом и оставляем dev на CSP
      ингресса (vite сам инжектит свой relaxed CSP только если он есть).

      style-src 'unsafe-inline' — Tailwind / Radix UI кладут inline-стили
      через style="..." при анимациях popover/dialog. nonce'ы для них
      настраивать нерентабельно.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DBOS Server Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
