
version: "3.1"

networks:
  load-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

services:


  apache:
    image: apache
    container_name: apache
    stdin_open: true
    tty: true
    ports:
      - "80:80"
    environment:
      HTTPD_PORT: "80"
    networks:
      load-network:
        ipv4_address: 172.21.0.3

