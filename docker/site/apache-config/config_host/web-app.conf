<VirtualHost *:80>
    ServerName localhost
    AstraMode off
    <IfModule astra_module>
        AstraMode off
    </IfModule>

    # Указываем путь к WSGI-скрипту
    WSGIDaemonProcess flaskapp python-home=/home/u/git/stress_test/docker/site/.venv python-path=/home/u/git/stress_test/docker/site_web_app processes=20 threads=20 display-name=%{GROUP}
    WSGIScriptAlias / /home/u/git/stress_test/docker/site/web_app/wsgi.py
    <Directory /home/u/git/stress_test/docker/site/web_app>
        WSGIProcessGroup flaskapp
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>
    # Логирование
    ErrorLog /var/log/apache2/flask_error.log
    CustomLog /var/log/apache2/flask_access.log combined
</VirtualHost>

