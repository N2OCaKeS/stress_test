<VirtualHost *:80>
    ServerName 10.177.103.205

    # Указываем путь к WSGI-скрипту
    WSGIDaemonProcess flaskapp python-path=/app/web_app
    WSGIScriptAlias / /app/web_app/wsgi.py

    <Directory /app/web_app>
        WSGIProcessGroup flaskapp
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    # Логирование
    ErrorLog /usr/local/apache2/logs/flask_error.log
    CustomLog /usr/local/apache2/logs/flask_access.log combined
</VirtualHost>
