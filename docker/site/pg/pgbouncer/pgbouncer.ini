[databases]
mydb = host=postgres port=5432 dbname=mydb auth_user=u

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = u
stats_users = u
pool_mode = transaction
max_client_conn = 500
default_pool_size = 40
reserve_pool_size = 20
ignore_startup_parameters = extra_float_digits