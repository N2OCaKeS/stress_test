<div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
	<a href="{{ url_for('home.home') }}" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
      <img class="header__img" src="{{ url_for('static', filename='img/astra_star_white.png') }}" alt="logo">
    </a>

    <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
      <li><a href="{{ url_for('message.create') }}" class="nav-link px-2 text-white">Отправить сообщение</a></li>
    </ul>

    <div class="text-end">
        {% if current_user.is_authenticated %}
          <span>Добро пожаловать! {{ current_user.login }}</span>
          <a href="{{ url_for('user.logout') }}" type="button" class="btn btn-outline-light me-2">Выйти</a>
        {% else %}
          <a href="{{ url_for('user.login') }}" type="button" class="btn btn-outline-light me-2">Войти</a>
          <a href="{{ url_for('user.register') }}" type="button" class="btn btn-warning">Регистрация</a>
        {% endif %}
    </div>
  </div>
