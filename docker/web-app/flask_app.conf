<VirtualHost *:80>
    ServerName localhost
    WSGIDaemonProcess flask-app threads=8
    # Указываем путь к WSGI-скрипту (скрипт, который запускает Flask-приложение)
    WSGIScriptAlias / /var/www/web-app/app.wsgi

    <Directory /var/www/web-app>
        # Связываем процесс WSGI с нашей Flask-аппликацией
        WSGIProcessGroup flask-app
        WSGIApplicationGroup %{GLOBAL}
        # Разрешаем доступ ко всем файлам в папке web-app
        Require all granted
    </Directory>

    <Directory /var/www>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>