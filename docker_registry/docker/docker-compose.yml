version: '3.8'

services:
  # =========================
  # DOCKER REGISTRY
  # =========================
  docker-registry:
    build:
      context: ./docker_registry
      dockerfile: Dockerfile
      args:
        ALLTA_API_CA_B64: ${ALLTA_API_CA_B64}
    image: docker-registry:latest
    container_name: docker-registry
    restart: always
    ports:
      - "21503:5000"
    volumes:
      - allta_docker_registry_data:/var/lib/registry
      - allta_tls_data:/tls:ro
      - allta_docker_registry_keys:/run/secrets/registry:ro
    env_file:
      - $CRED_PATH/env.docker_registry
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /tls/allta-api.crt
      REGISTRY_HTTP_TLS_KEY: /tls/allta-api.key
      REGISTRY_AUTH_TOKEN_REALM: https://${ALLTA_EXTERNAL_HOST:-allta.devos.astralinux.ru}:21502/auth/registry/token
      SSL_CERT_FILE: /tls/allta-api.crt
    extra_hosts:
      - "${ALLTA_EXTERNAL_HOST:-allta.devos.astralinux.ru}:host-gateway"

    healthcheck:
      test: ["CMD-SHELL", "/tmp/check-registry.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      docker_registry:
    pids_limit: 1024


  # =========================
  # WEB UI (joxit/docker-registry-ui)
  # =========================
  docker-registry-ui:
    build:
      context: ./docker_registry_ui
      dockerfile: Dockerfile
      args:
        ALLTA_API_CA_B64: ${ALLTA_API_CA_B64}
    image: docker-registry-ui:latest
    container_name: docker-registry-ui
    restart: always
    depends_on:
      docker-registry:
        condition: service_healthy
    env_file:
      - $CRED_PATH/env.docker_registry_ui
    environment:
      NGINX_PROXY_PASS_URL: https://${ALLTA_EXTERNAL_HOST:-allta.devos.astralinux.ru}:21503
      NODE_EXTRA_CA_CERTS: /etc/allta/tls/allta-api.crt
      SSL_CERT_FILE: /etc/allta/tls/allta-api.crt
    extra_hosts:
      - "${ALLTA_EXTERNAL_HOST:-allta.devos.astralinux.ru}:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      docker_registry:
    volumes:
      - allta_tls_data:/etc/allta/tls:ro


  # =========================
  # WEB UI GATEWAY (auth via allta_auth)
  # =========================
  docker-registry-ui-gateway:
    build:
      context: ./docker_registry_ui_gateway
      dockerfile: Dockerfile
      args:
        ALLTA_API_CA_B64: ${ALLTA_API_CA_B64}
    image: docker-registry-ui-gateway:latest
    container_name: docker-registry-ui-gateway
    restart: always
    ports:
      - "21502:443"
    depends_on:
      docker-registry-ui:
        condition: service_healthy
    extra_hosts:
      - "${ALLTA_EXTERNAL_HOST:-allta.devos.astralinux.ru}:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --no-check-certificate https://127.0.0.1:443/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      docker_registry:
    volumes:
      - allta_tls_data:/etc/nginx/tls:ro

volumes:
  allta_docker_registry_data:
    driver: local
    driver_opts:
      type: none
      device: ${DOCKER_REGISTRY_PATH}
      o: bind

  allta_tls_data:
    driver: local
    driver_opts:
      type: none
      device: ${TLS_CERTS_PATH}
      o: bind

  allta_docker_registry_keys:
    driver: local
    driver_opts:
      type: none
      device: ${DOCKER_REGISTRY_KEYS_PATH}
      o: bind

networks:
  docker_registry:
    driver: bridge
