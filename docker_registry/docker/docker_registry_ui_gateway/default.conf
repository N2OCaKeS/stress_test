upstream registry_ui_upstream {
    server docker-registry-ui:80;
}

upstream auth_api_upstream {
    server allta.devos.astralinux.ru:21500;
}

server {
    listen 80;
    server_name _;
    return 301 https://$http_host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    error_page 497 =301 https://$http_host$request_uri;
    ssl_certificate /etc/nginx/tls/allta-api.crt;
    ssl_certificate_key /etc/nginx/tls/allta-api.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/nginx/tls/allta-api.crt;
    proxy_ssl_server_name on;
    proxy_ssl_name allta.devos.astralinux.ru;

    location = /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    location = /oauth-callback {
        proxy_pass https://auth_api_upstream/api/auth/v1/integrations/oauth/nginx/callback$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth/check {
        internal;
        proxy_method GET;
        proxy_pass https://auth_api_upstream/api/auth/v1/integrations/basic/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    location @oauth2_signin {
        return 302 https://$host:21500/api/auth/v1/integrations/oauth/nginx/start?client_id=allta-docker-ui&redirect_uri=https://$http_host/oauth-callback&rd=$scheme://$http_host$request_uri;
    }

    location = /_auth/error-401 {
        internal;
        default_type application/json;
        add_header WWW-Authenticate 'Basic realm="Allta Auth"' always;
        return 401 '{"detail":"Authentication required"}';
    }

    location = /_auth/error-403 {
        internal;
        default_type application/json;
        return 403 '{"detail":"Insufficient permissions"}';
    }

    location = /_auth/error-503 {
        internal;
        default_type application/json;
        return 503 '{"detail":"Auth service unavailable"}';
    }

    # Registry token endpoint proxied via the same origin as UI.
    # This avoids browser CORS issues on token requests.
    location = /auth/registry/token {
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_pass https://auth_api_upstream/api/auth/v1/integrations/registry/token$is_args$args;
    }

    # Registry API traffic must pass unchanged so UI token flow keeps
    # the original Bearer challenge/response contract.
    location ^~ /v2/ {
        proxy_pass http://registry_ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /_auth/check;
        error_page 401 = @oauth2_signin;
        error_page 403 = /_auth/error-403;
        error_page 500 502 503 504 = /_auth/error-503;

        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $auth_role $upstream_http_x_auth_role;

        proxy_pass http://registry_ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Auth-User-Id $auth_user_id;
        proxy_set_header X-Auth-Role $auth_role;
    }
}
