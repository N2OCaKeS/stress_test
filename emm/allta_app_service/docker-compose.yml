services:
  allta_app:
    build: .
    image: allta_app_service:latest
    container_name: allta_app_service
    # Обычная сеть compose, как у остальных сервисов стека — порт наружу
    # (на хост/интернет) НЕ публикуется. Единственная внешняя точка входа —
    # nginx, который достаёт этот контейнер по имени сервиса внутри сети
    # compose (ALLTA_PORT — тот порт, на котором его там и найдёт).
    expose:
      - "${ALLTA_PORT:-8000}"
    environment:
      - ALLTA_PORT=${ALLTA_PORT:-8000}
      - ALLTA_AUTH_API_KEY=${ALLTA_AUTH_API_KEY:-}
      # Резолв iLO-кред по номеру стенда через server_service (libs/libilo.py).
      # Пусто по умолчанию — вызов деградирует в понятную ошибку, импорт не падает.
      - SERVER_SERVICE_URL=${SERVER_SERVICE_URL:-}
      - ALLTA_APP_SERVICE_BOT_TOKEN=${ALLTA_APP_SERVICE_BOT_TOKEN:-}
    volumes:
      # Реальные пути и полный список DRBL-бинарей/библиотек сверяются на
      # 103.10 (dpkg -L drbl, ldd $(which drbl-ocs)) — см. drbl_stub/README.md.
      # По умолчанию — пустые заглушки, чтобы контейнер поднимался локально
      # без установленного DRBL.
      - ${DRBL_USR_SBIN:-./drbl_stub/usr_sbin}:/usr/sbin:ro
      - ${DRBL_SHARE:-./drbl_stub/usr_share_drbl}:/usr/share/drbl:ro
      - ${DRBL_ETC:-./drbl_stub/etc_drbl}:/etc/drbl:ro
    restart: unless-stopped
