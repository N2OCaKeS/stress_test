# Reverse-proxy для prod-подобного docker-compose стека (docker-compose.prod.yml).
#
# Единая точка входа: TLS-терминация на 443, роутинг /api/* по backend'ам,
# всё остальное — на web-ui (SPA). Аналог traefik-ingress из k8s, но обычным
# nginx'ом. Backend'ы внутри compose-сети слушают plain http (их HTTPS-guard
# отключён так же, как в k8s за ingress'ом).
#
# Апстримы резолвятся через встроенный DNS docker'а (127.0.0.11) в рантайме —
# переменная в proxy_pass откладывает резолв, поэтому падение/рестарт бэкенда
# или его новый IP не роняют nginx на старте.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Embedded DNS docker'а — резолвит имена сервисов compose-сети.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Проброс WebSocket: консоль сервера (/api/server/.../console) держит
    # upgrade-соединение. Для обычных запросов Connection закрывается штатно.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Порт 80 наружу не публикуется (см. docker-compose.prod.yml). Слушаем его
    # только на loopback — для docker-healthcheck'а. Плейн-HTTP наружу нет:
    # CA качается по HTTPS (make prepare-docker подскажет), клиент до импорта
    # CA ходит с curl -k / verify=False.
    server {
        listen 127.0.0.1:80;
        server_name _;

        location = /emm-ca.crt {
            root /etc/nginx/certs;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="emm-ca.crt"' always;
            try_files /emm-ca.crt =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Консольный вывод и загрузки могут быть увесистыми.
        client_max_body_size 25m;

        # Общие proxy-заголовки наследуются во все location'ы ниже. Реальный IP
        # клиента доезжает до сервисов (audit-trail + slowapi per-IP rate-limit).
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;

        # Публичный корневой сертификат внутреннего CA — под импорт клиентом.
        location = /emm-ca.crt {
            root /etc/nginx/certs;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="emm-ca.crt"' always;
            add_header Cache-Control "no-cache" always;
            try_files /emm-ca.crt =404;
        }

        location /api/auth/ {
            set $up_auth auth_service;
            proxy_pass http://$up_auth:8000$request_uri;
        }

        location /api/logging/ {
            set $up_logging logging_service;
            proxy_pass http://$up_logging:8001$request_uri;
        }

        location /api/server/ {
            set $up_server server_service;
            proxy_pass http://$up_server:8002$request_uri;
        }

        location /api/secret/ {
            set $up_secret secret_service;
            proxy_pass http://$up_secret:8003$request_uri;
        }

        location /api/testing/ {
            set $up_testing testing_service;
            proxy_pass http://$up_testing:8004$request_uri;
        }

        # allta_app_service — легаси-приложение, маршруты у него свои, без
        # префикса (/rest/api/..., /reboot/<stand> и т.п.) — префикс /api/allta/
        # снимается здесь через rewrite, в самом приложении ничего переписывать
        # не пришлось. С переменной в proxy_pass nginx не делает автоматическую
        # подстановку остатка пути (в отличие от статичного upstream'а выше) —
        # без явного rewrite всё схлопнулось бы в один и тот же "/". `set`
        # обязан идти ДО `rewrite` в этом блоке — иначе `$up_allta` на этапе
        # proxy_pass почему-то резолвится в пустую строку.
        location /api/allta/ {
            set $up_allta allta_app;
            rewrite ^/api/allta/(.*)$ /$1 break;
            proxy_pass http://$up_allta:8000;
        }

        # Агрегированный Swagger UI (BASE_URL=/docs). Ловит /docs, /docs/ и
        # /docs/specs/*.json — раздаётся отдельным swagger_ui-контейнером.
        location /docs {
            set $up_swagger swagger_ui;
            proxy_pass http://$up_swagger:8080$request_uri;
        }

        # Catch-all на SPA web-ui. Идёт последним — специфичные /api и /emm-ca.crt
        # уже разведены выше (nginx матчит точные/длинные префиксы первыми).
        location / {
            set $up_web web_ui;
            proxy_pass http://$up_web:8080$request_uri;
        }
    }
}
