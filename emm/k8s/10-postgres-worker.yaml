# Postgres для server_worker — один pod с persistent volume.
# Резервирование делается через бэкапы (см. scripts/k8s/backup_pg.sh), не репликами.

# PV под local-path: явный Retain, чтобы случайное удаление PVC не зачищало
# данные. k3s local-path-provisioner создаёт PV динамически; здесь объявлен
# guard на reclaim policy через StorageClass-параметры PVC + аннотация.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-postgres-data
  namespace: dbos
  annotations:
    # local-path provisioner k3s читает эту аннотацию и проставляет Retain
    # на динамически созданный PV.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-postgres
  namespace: dbos
  labels:
    app: worker-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate                 # БД не может работать в двух копиях на одном PVC
  selector:
    matchLabels:
      app: worker-postgres
  template:
    metadata:
      labels:
        app: worker-postgres
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        # Postgres официальный image инициализирует data dir под UID 999 (postgres).
        # fsGroup нужен чтобы новый PV получил группу postgres и pg_isready
        # работал на shared volume.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # postgres image пишет в /var/run/postgresql и /tmp; root-FS оставляем rw,
            # т.к. официальный image не поддерживает readOnlyRootFilesystem без
            # дополнительных volume mounts на десяток директорий.
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: worker_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_DB_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "worker_user", "-d", "worker_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: worker-postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: worker-postgres
  namespace: dbos
spec:
  type: ClusterIP                  # только внутри namespace, наружу не публикуется
  selector:
    app: worker-postgres
  ports:
    - port: 5432
      targetPort: 5432
