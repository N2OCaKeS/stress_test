# CronJob еженедельного полного snapshot'а Secret'а dbos-secrets.
#
# Зачем: master-keys-backup закрывает крипто-ключи, но в Secret'е лежат ещё
# DB-пароли, S2S-ключи, REDIS_PASSWORD, REDIS_STASH_PASSWORD, WORKER_BOT_TOKEN,
# DOCKER_RSA_PRIVATE_KEY, TLS. При DR-сценарии "VM умерла, нужно поднять с нуля"
# без них сервисы не стартуют (см. obsidian/infra/runbooks/Backup-DR.md §4).
#
# Schedule: 0 5 * * 0 = воскресенье 05:00 UTC = 08:00 MSK. Через час после
# ежедневного master-keys backup'а (04:00 UTC), pg-backup'ы (23:00-00:00 UTC)
# давно закончились — backup-PV свободен.
#
# Шифрование: см. master-keys-backup CronJob — тот же dbos-backup-passphrase.
#
# TODO (вне этой волны):
#   - сейчас если dbos-backup-passphrase отсутствует — скрипт уходит в режим
#     plaintext (с предупреждением в логах). Это сознательный выбор: лучше
#     запасной не-шифрованный backup, чем отсутствие backup'а вообще; encrypted
#     PVC + offsite-канал должны защитить артефакт. После добавления
#     dbos-backup-passphrase оператором руками — backup автоматически
#     переходит на gpg/openssl.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-full-backup
  namespace: dbos
  labels:
    app: secret-full-backup
spec:
  schedule: "0 5 * * 0"           # ВС 05:00 UTC = 08:00 MSK еженедельно
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800   # неделя — между запусками
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: secret-full-backup
        spec:
          serviceAccountName: rotation-runner
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: dbos/tools:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash"]
              args:
                - "-c"
                - |
                  set -euo pipefail
                  echo "→ secret-full backup $(date -u +%FT%TZ)"
                  mkdir -p /backup/secrets
                  chmod 700 /backup/secrets
                  # --no-encryption явно разрешает unencrypted backup если в env
                  # нет ни BACKUP_PASSPHRASE, ни BACKUP_AGE_RECIPIENTS. Скрипт
                  # сам выберет ветку: с passphrase → gpg, без → plain yaml.
                  bash /scripts/backup_secret_full.sh \
                      --no-encryption \
                      --target-dir /backup/secrets \
                      --yes
                  echo "✓ backup_secret_full.sh завершён"
                  : > /backup/secrets/.ready
              env:
                - name: DBOS_NAMESPACE
                  value: "dbos"
                - name: DBOS_SECRET_NAME
                  value: "dbos-secrets"
                - name: BACKUP_TARGET_DIR
                  value: "/backup/secrets"
                - name: BACKUP_PASSPHRASE
                  valueFrom:
                    secretKeyRef:
                      name: dbos-backup-passphrase
                      key: BACKUP_PASSPHRASE
                      optional: true
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backup
                  mountPath: /backup
              resources:
                requests: { cpu: "100m", memory: "128Mi" }
                limits:   { cpu: "500m", memory: "512Mi" }
            - name: offsite-sync
              image: dbos/tools:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash"]
              args:
                - "-c"
                - |
                  set -euo pipefail
                  for i in $(seq 1 150); do
                    if [[ -f /backup/secrets/.ready ]]; then
                      break
                    fi
                    sleep 10
                  done
                  if [[ ! -f /backup/secrets/.ready ]]; then
                    echo "offsite-sync: маркер .ready не появился — пропускаю"
                    exit 0
                  fi
                  rm -f /backup/secrets/.ready
                  if [[ -z "${OFFSITE_RSYNC_DEST:-}" ]]; then
                    echo "offsite copy disabled (no OFFSITE_RSYNC_DEST set)"
                    exit 0
                  fi
                  # Для secret-full используется суффикс /secrets/ в DEST,
                  # чтобы не смешать с master-keys на удалённом хосте.
                  REMOTE_DEST="${OFFSITE_RSYNC_DEST%/}/secrets/"
                  echo "→ rsync /backup/secrets → $REMOTE_DEST"
                  rsync -av --delete /backup/secrets/ "$REMOTE_DEST"
                  echo "✓ offsite copy готов"
              env:
                - name: OFFSITE_RSYNC_DEST
                  valueFrom:
                    configMapKeyRef:
                      name: dbos-offsite-config
                      key: OFFSITE_RSYNC_DEST
                      optional: true
              volumeMounts:
                # backup mount writable — sidecar делает `rm -f .ready` после
                # успешного push'а. readOnly: true даёт EROFS на cleanup.
                - name: backup
                  mountPath: /backup
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits:   { cpu: "500m", memory: "256Mi" }
          volumes:
            - name: scripts
              configMap:
                name: rotation-scripts
                defaultMode: 0o555
            - name: backup
              persistentVolumeClaim:
                claimName: dbos-backup-pv
