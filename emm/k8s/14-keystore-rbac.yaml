# RBAC под durable-keystore секреты шифрования.
#
# secret_service и server_service с KEYSTORE_BACKEND=k8s держат master-ключи
# не в файле на emptyDir /tmp (теряется при рестарте), а в k8s Secret в etcd.
# На rotate бэкенд патчит этот Secret через API — для этого поду нужен
# SA-токен и право get/patch на СВОЙ Secret.
#
# Least-privilege: у каждого сервиса отдельный SA + Role с resourceNames на
# единственный keystore-Secret. Никаких прав на остальные secrets, никаких
# ClusterRole'ов. rotation-runner (120-rotation-rbac.yaml) намеренно не
# переиспользуется — он широкий (нужен CronJob'у для exec/rollout).
#
# verbs:
#   get   — read активной версии и материала ключа на старте, перед патчем и
#           в list_versions() (бэкенд читает весь Secret через GET, не LIST).
#   patch — set_key / set_active / remove_key пишут data-поля Secret'а;
#           retire версии — это patch с value=null.
# list/watch/create/delete не нужны (и resourceNames их всё равно не сужает):
# Secret заранее засевает оператор (см. 20-secrets.yaml.example).

# ── secret_service ───────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-service-keystore
  namespace: dbos
  labels:
    app: secret-service

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-service-keystore
  namespace: dbos
  labels:
    app: secret-service
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dbos-secret-encryption-keys"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-service-keystore
  namespace: dbos
  labels:
    app: secret-service
subjects:
  - kind: ServiceAccount
    name: secret-service-keystore
    namespace: dbos
roleRef:
  kind: Role
  name: secret-service-keystore
  apiGroup: rbac.authorization.k8s.io

# ── server_service ───────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server-service-keystore
  namespace: dbos
  labels:
    app: server-service

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-service-keystore
  namespace: dbos
  labels:
    app: server-service
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["dbos-server-encryption-keys"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-service-keystore
  namespace: dbos
  labels:
    app: server-service
subjects:
  - kind: ServiceAccount
    name: server-service-keystore
    namespace: dbos
roleRef:
  kind: Role
  name: server-service-keystore
  apiGroup: rbac.authorization.k8s.io
