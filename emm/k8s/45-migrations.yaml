# ВНИМАНИЕ: этот файл НЕ подключён в kustomization.yaml. Его применяет
# scripts/k8s/deploy.sh явным `kubectl apply -f 45-migrations.yaml` — после
# готовности баз и ДО ожидания сервисов. В kustomization Job'ам нельзя: они
# immutable и ломают повторный `kubectl apply -k`. Идемпотентность даёт сам
# deploy.sh — `kubectl delete job <*-migrate>` перед apply, так что каждый
# деплой гоняет свежий Job. `make k8s-migrate` (kubectl exec alembic upgrade
# head) остался ручным fallback'ом и в штатный деплой больше не входит.
#
# Alembic-миграции вынесены из Pod'а в отдельные Job'ы — один Pod на сервис,
# который завершается после `alembic upgrade head`. Это убирает гонку
# параллельных миграций при replicas=2 и развязывает фазу schema-evolution
# от rolling-update сервиса.
#
# Порядок применения (deploy.sh):
#   1. kustomize build | apply (всё, кроме этих Job'ов — их в kustomization нет)
#   2. wait rollout postgres-Deployment'ов (Job'у нужна живая БД)
#   3. delete job <*-migrate> + apply -f 45-migrations.yaml + wait condition=complete
#   4. wait rollout сервисов (схема уже на месте — auth-service не крашлупит)
#
# Альтернатива — Helm/Argo PreSync hook; в чистом kustomize порядок зашит в
# скрипт deploy.sh (см. scripts/k8s/deploy.sh).
#
# ttlSecondsAfterFinished автоматически выпиливает завершившиеся Pod'ы Job'ов;
# backoffLimit ограничивает повторные попытки при падении (например, БД ещё
# не подняла соединения).
#
# Env-разбивка: *_USER/*_PASSWORD объявлены ДО DATABASE_URL, потому что
# kubelet раскрывает `$(VAR)` только из ранее объявленных env-записей.
# get_settings() жадно валидирует множество полей даже для миграции, поэтому
# server/secret-migrate несут заглушки AUTH_SERVICE_URL / LOGGING_SERVICE_URL —
# alembic их не использует, но Settings без них не строится. worker-migrate
# берёт DSN прямо из DATABASE_URL (см. server_worker env.py), полную Settings
# не строит, так что его прочий env здесь — задел и читаемость, не требование.

apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: dbos
  labels:
    job: auth-migrate
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        job: auth-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: dbos/auth-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: AUTH_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: AUTH_DB_USER }
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: AUTH_DB_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(AUTH_DB_USER):$(AUTH_DB_PASSWORD)@auth-postgres:5432/auth_db"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: AUTH_SECRET_KEY }
            - name: LOGGING_SERVICE_URL
              value: http://logging-service:8001
            - name: LOGGING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_SERVICE_API_KEY_AUTH }
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVICE_API_KEY }
            - name: SERVICE_API_KEYS
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: AUTH_INBOUND_SERVICE_API_KEYS_JSON }
            - name: INITIAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: INITIAL_ADMIN_USERNAME }
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: INITIAL_ADMIN_PASSWORD }
            - name: INITIAL_ADMIN_EMAIL
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: INITIAL_ADMIN_EMAIL }
            - name: SECRET_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SECRET_INTERNAL_API_KEY }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_PASSWORD }
            - name: RATE_LIMIT_STORAGE_URI
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
            - name: DOCKER_RSA_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: DOCKER_RSA_PRIVATE_KEY }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

