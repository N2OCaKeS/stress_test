apiVersion: v1
kind: ConfigMap
metadata:
  name: server-service-config
  namespace: dbos
data:
  APP_ENV: production
  TRUSTED_PROXY_IPS: '["10.42.0.0/16"]'   # доверяем ingress-прокси (traefik pod-CIDR) для X-Forwarded-For
  DBOS_HTTPS_GUARD_DISABLED: "true"  # intra-cluster only deploy; внешний доступ только через Ingress
  APP_HOST: 0.0.0.0
  APP_PORT: "8002"
  APP_LOG_LEVEL: INFO
  # Cluster-internal URLs соседних сервисов.
  # Plain http внутри cluster'а: сервисы стартуют uvicorn'ом без --ssl-*,
  # TLS-терминация только на Ingress. Изоляция — NetworkPolicy.
  AUTH_SERVICE_URL: http://auth-service:8000
  LOGGING_SERVICE_URL: http://logging-service:8001
  # Исходящий callback завершения prepare-for-test (§5.1 плана миграции).
  TESTING_SERVICE_URL: http://testing-service:8004
  # introspect идёт по plain http — verify не применим.
  INTROSPECT_TLS_VERIFY: "false"
  # Internal endpoints (worker → server_service): требовать
  # `X-Target-Department-Id` от caller'а. В проде ОБЯЗАТЕЛЬНО true.
  INTERNAL_REQUIRE_DEPT_HEADER: "true"
  # slowapi: глобальный per-IP rate-limit. Health/ready исключены.
  SLOWAPI_RATE_LIMIT: "500/minute"
  # Начальная парольная политика server-аккаунтов (перенастраивается в UI
  # account_admin'ом; после PUT значение ложится в БД и перекрывает эти env).
  PASSWORD_POLICY_MIN_LENGTH: "8"
  PASSWORD_POLICY_REQUIRE_LETTER: "true"
  PASSWORD_POLICY_REQUIRE_DIGIT: "true"
  # DB connection pool: per-pod 5 + overflow 10 = max 15 conn × replicas=2 = 30,
  # с запасом помещается в PG max_connections=100.
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"
  # Master-ключи шифрования храним в k8s Secret (etcd), а не в файле на
  # emptyDir /tmp — иначе при рестарте пода теряется активный ключ после
  # rotate и retired-тумбстоуны. Бэкенд патчит dbos-server-encryption-keys
  # через API (нужен SA-токен + RBAC get/patch, см. 14-keystore-rbac.yaml).
  KEYSTORE_BACKEND: k8s
  KEYSTORE_K8S_SECRET: dbos-server-encryption-keys
  KEYSTORE_K8S_NAMESPACE: dbos
  # Заполняемость диска для карточки на главной (GET /host/diskspace) читает
  # эти пути локальным `shutil.disk_usage`, а не по managed-серверу из
  # инвентаря — emm и ACS/DRBL/Clonezilla-хост это один и тот же физический
  # бокс (owner-confirmed). Контейнер видит хостовые `/`, `/srv/ftp`,
  # `/home/partimag` только через hostPath-mount'ы ниже под своими путями
  # (host `/` в container `/` смонтировать нельзя — раздавит собственный
  # rootfs), поэтому эндпоинту нужно явно сказать, где их искать.
  HOST_DISK_STAT_PATH_ROOT: /host-root
  HOST_DISK_STAT_PATH_FTP: /host-srv-ftp
  HOST_DISK_STAT_PATH_PARTIMAG: /host-home-partimag

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-service
  namespace: dbos
  labels:
    app: server-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime обновление
  selector:
    matchLabels:
      app: server-service
  template:
    metadata:
      labels:
        app: server-service
      annotations:
        # /metrics не выставлен (owner decision W41 — без отдельного Prometheus).
        # Operational-counter'ы выставлены в payload /api/server/v1/ready:
        # dispatch_outbox_pending_depth, secrets_decrypt_failures, dropped_429.
        # Подробнее — obsidian/infra/Observability.md.
        prometheus.io/scrape: "false"
        dbos.monitoring/source: "/api/server/v1/ready"
    spec:
      terminationGracePeriodSeconds: 45
      # Под ходит в k8s API за master-ключами (KEYSTORE_BACKEND=k8s),
      # поэтому SA-токен монтируем. RBAC сведён к get/patch только на
      # dbos-server-encryption-keys (14-keystore-rbac.yaml).
      serviceAccountName: server-service-keystore
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server-service
          image: dbos/server-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: server-service-config
          env:
            # Все *_USER/*_PASSWORD/REDIS_PASSWORD объявлены до DATABASE_URL и
            # SERVER_WORKER_DATABASE_URL — kubelet раскрывает $(VAR) только из
            # ранее объявленных env-записей.
            - name: SERVER_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_DB_USER }
            - name: SERVER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_DB_PASSWORD }
            - name: WORKER_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_DB_USER }
            - name: WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: WORKER_DB_PASSWORD }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(SERVER_DB_USER):$(SERVER_DB_PASSWORD)@server-postgres:5432/server_db"
            - name: SERVER_WORKER_DATABASE_URL
              value: "postgresql+psycopg://$(WORKER_DB_USER):$(WORKER_DB_PASSWORD)@worker-postgres:5432/worker_db"
            - name: SERVER_WORKER_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            # Шифрование хранимых паролей (server accounts + IPMI).
            # AES-256-GCM + HKDF-SHA256 от мастер-ключа. Версия активного
            # ключа пишется в новые ciphertext'ы как `v<N>$...`.
            - name: SERVER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_ENCRYPTION_KEY }
            - name: SERVER_ENCRYPTION_KEY_VERSION
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_ENCRYPTION_KEY_VERSION }
            - name: HKDF_SALT_HEX
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: HKDF_SALT_HEX }
            # Envelope-шифрование Redis-stash'а кред между server_service и
            # server_worker (provision/prepare dispatch). Тот же ключ mount'ится
            # в 60-server-worker.yaml — обязан совпадать байт-в-байт.
            - name: REDIS_STASH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_STASH_ENCRYPTION_KEY }
            - name: REDIS_STASH_ENCRYPTION_KEY_VERSION
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_STASH_ENCRYPTION_KEY_VERSION }
            # SERVICE_API_KEY — outbound bearer для introspect/service-access
            # в auth_service. Должен совпадать с SERVICE_API_KEYS[server_service]
            # на стороне auth_service.
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_SERVICE_API_KEY }
            # SERVICE_API_KEYS — inbound bearer'ы (worker → server_service
            # internal endpoints) в формате per-service map.
            - name: SERVICE_API_KEYS
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_INBOUND_SERVICE_API_KEYS }
            # Per-caller bearer для audit-emit'ов в loging_service.
            # loging_service ищет identity в LOGGING_SERVICE_API_KEYS_JSON по
            # заголовку X-Service-Identity: server_service.
            - name: LOGGING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_SERVICE_API_KEY_SERVER }
            # Исходящий callback prepare-for-test → testing_service. Bearer ==
            # ключ server_service в inbound-map testing_service.
            - name: TESTING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: TESTING_SERVICE_API_KEY }
            # Подпись токена веб-консоли ВМ — общий секрет с console_proxy.
            - name: VM_CONSOLE_TOKEN_SECRET
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: VM_CONSOLE_TOKEN_SECRET }
            # wss://<INGRESS_HOST> — наполняет gen_secrets.sh в dbos-secrets
            # (следует за доменом деплоя, не хардкодим).
            - name: VM_CONSOLE_PROXY_WS_BASE
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: VM_CONSOLE_PROXY_WS_BASE }
          # Миграции вынесены в Job server-migrate (см. 45-migrations.yaml).
          command: ["uvicorn"]
          args:
            - "src.main:app"
            - "--host=0.0.0.0"
            - "--port=8002"
            - "--workers=2"
            - "--proxy-headers"
          startupProbe:
            httpGet:
              path: /api/server/v1/health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/server/v1/ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/server/v1/health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Read-only view хостовой файловой системы для /host/diskspace
            # (см. HOST_DISK_STAT_PATH_* выше). Безопасно только потому, что
            # это single-node деплой — replicas=2 всё равно шедулятся на один
            # и тот же k3s-узел, так что hostPath не расходится между подами.
            # Если платформа когда-нибудь переедет на несколько нод, это
            # молча начнёт отражать диск случайного узла, а не эталонного
            # ACS/DRBL-хоста — тогда нужен будет node-affinity/DaemonSet или
            # выделенный sidecar-агент вместо hostPath.
            - name: host-root
              mountPath: /host-root
              readOnly: true
            - name: host-srv-ftp
              mountPath: /host-srv-ftp
              readOnly: true
            - name: host-home-partimag
              mountPath: /host-home-partimag
              readOnly: true
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # hostPath'ы под /host/diskspace. `type: Directory` требует, чтобы
        # путь уже существовал на узле на момент старта пода — иначе kubelet
        # держит под в ContainerCreating вместо деградации. Это НЕ проверено
        # в CI/песочнице (нет реального multi-fs хоста под рукой) — после
        # деплоя на прод обязательно свериться:
        #   kubectl exec -n dbos deploy/server-service -- \
        #     sh -c 'df -h /host-root /host-srv-ftp /host-home-partimag'
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: host-srv-ftp
          hostPath:
            path: /srv/ftp
            type: Directory
        - name: host-home-partimag
          hostPath:
            path: /home/partimag
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: server-service
  namespace: dbos
spec:
  type: ClusterIP                # внешний доступ — через Ingress (50-ingress.yaml)
  selector:
    app: server-service
  ports:
    - port: 8002
      targetPort: 8002
