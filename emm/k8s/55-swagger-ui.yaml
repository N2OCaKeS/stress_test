# Общий Swagger UI для четырёх сервисов: auth / logging / server / secret.
#
# Spec'ы лежат в отдельных ConfigMap'ах на сервис (dbos-openapi-auth /
# -logging / -server / -secret) — генерируются скриптом scripts/k8s/dump_openapi.sh
# из работающих pod'ов через `python -c app.openapi()`. По одному ConfigMap'у
# на spec: server.json в одиночку ~0.8 МБ, а суммарный ConfigMap упирается в
# лимит 1 МБ. Регенерация — когда меняется набор endpoint'ов; в проде
# /openapi.json у сервисов отключён намеренно.
#
# Доступ: https://<host>/docs (через Ingress, см. 50-ingress.yaml).
# В dropdown'е переключение между Auth / Logging / Server.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbos-swagger-ui
  namespace: dbos
  labels:
    app: dbos-swagger-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbos-swagger-ui
  template:
    metadata:
      labels:
        app: dbos-swagger-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        runAsNonRoot: true
      containers:
        - name: swagger-ui
          # Pin на конкретный тег вместо :latest — reproducible deploy между
          # перезапусками pod'а. Обновление = ручной bump (после проверки CVE
          # на новый image в registry).
          image: swaggerapi/swagger-ui:v5.17.14
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: BASE_URL
              value: /docs
            - name: URLS
              value: '[{"url":"/docs/specs/auth.json","name":"auth_service"},{"url":"/docs/specs/logging.json","name":"loging_service"},{"url":"/docs/specs/server.json","name":"server_service"},{"url":"/docs/specs/secret.json","name":"secret_service"}]'
            - name: URLS_PRIMARY_NAME
              value: auth_service
            - name: PERSIST_AUTHORIZATION
              value: "true"
            - name: DEEP_LINKING
              value: "true"
          volumeMounts:
            - name: spec-auth
              mountPath: /usr/share/nginx/html/specs/auth.json
              subPath: auth.json
              readOnly: true
            - name: spec-logging
              mountPath: /usr/share/nginx/html/specs/logging.json
              subPath: logging.json
              readOnly: true
            - name: spec-server
              mountPath: /usr/share/nginx/html/specs/server.json
              subPath: server.json
              readOnly: true
            - name: spec-secret
              mountPath: /usr/share/nginx/html/specs/secret.json
              subPath: secret.json
              readOnly: true
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: spec-auth
          configMap:
            name: dbos-openapi-auth
        - name: spec-logging
          configMap:
            name: dbos-openapi-logging
        - name: spec-server
          configMap:
            name: dbos-openapi-server
        - name: spec-secret
          configMap:
            name: dbos-openapi-secret

---
apiVersion: v1
kind: Service
metadata:
  name: dbos-swagger-ui
  namespace: dbos
spec:
  type: ClusterIP
  selector:
    app: dbos-swagger-ui
  ports:
    - port: 8080
      targetPort: 8080
