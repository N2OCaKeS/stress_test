# testing_service — api (FastAPI, 2 реплики). Симметрично 13-secret-service.yaml.
# Воркер (taskiq consumer) — отдельный top-level сервис/манифест, см.
# 64-testing-worker.yaml (по образцу server_service/server_worker: 50-server-service.yaml
# + 60-server-worker.yaml).

apiVersion: v1
kind: ConfigMap
metadata:
  name: testing-service-config
  namespace: dbos
data:
  APP_ENV: production
  TRUSTED_PROXY_IPS: '["10.42.0.0/16"]'   # доверяем ingress-прокси (traefik pod-CIDR) для X-Forwarded-For
  DBOS_HTTPS_GUARD_DISABLED: "true"  # intra-cluster only deploy; внешний доступ только через Ingress
  APP_HOST: 0.0.0.0
  APP_PORT: "8004"
  APP_LOG_LEVEL: INFO
  APP_DEBUG: "false"
  AUTH_SERVICE_URL: http://auth-service:8000
  LOGGING_SERVICE_URL: http://logging-service:8001
  SERVER_SERVICE_URL: http://server-service:8002
  INTROSPECT_TLS_VERIFY: "false"
  SLOWAPI_RATE_LIMIT: 500/minute
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "10"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testing-service
  namespace: dbos
  labels:
    app: testing-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: testing-service
  template:
    metadata:
      labels:
        app: testing-service
      annotations:
        prometheus.io/scrape: "false"
        dbos.monitoring/source: "/api/testing/v1/ready"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: testing-service
          image: dbos/testing-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: testing-service-config
          env:
            - name: TESTING_DB_USER
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: TESTING_DB_USER }
            - name: TESTING_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: TESTING_DB_PASSWORD }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_PASSWORD }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(TESTING_DB_USER):$(TESTING_DB_PASSWORD)@testing-postgres:5432/testing_db"
            # Отдельный Redis db-index: /0=server_worker broker, /1=auth
            # rate-limit, /2=secret rate-limit, /3=testing_service broker.
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/3"
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVICE_API_KEY }
            - name: SERVICE_API_KEYS
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: TESTING_INBOUND_SERVICE_API_KEYS }
            - name: LOGGING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: LOGGING_SERVICE_API_KEY_TESTING }
            - name: INTROSPECT_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: TESTING_INTROSPECT_SERVICE_API_KEY }
            # Бот testing_service (auth_service заводит его на старте, роль
            # guest@server_service) — choices_source dynamic-резолверам нужен
            # доступ к каталогу OS-версий server_service.
            - name: SERVER_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: TESTING_SERVICE_BOT_TOKEN }
            # Канал брони/подготовки в server_service (acquire-for-service/
            # release-for-service/service-status/prepare-for-test) — чистый
            # shared-secret, отдельный от бот-токена выше.
            - name: SERVER_SERVICE_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: SERVER_SERVICE_INTERNAL_API_KEY }
          command: ["uvicorn"]
          args:
            - "src.main:app"
            - "--host=0.0.0.0"
            - "--port=8004"
            - "--workers=2"
          startupProbe:
            httpGet:
              path: /api/testing/v1/health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/testing/v1/ready
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/testing/v1/health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: testing-service
  namespace: dbos
spec:
  type: ClusterIP
  selector:
    app: testing-service
  ports:
    - port: 8004
      targetPort: 8004
