# testing_worker — SSH-исполнитель очереди testing_service (§5.5 плана
# миграции). Отдельный top-level сервис/образ (../testing_worker), симметрично
# 60-server-worker.yaml относительно 50-server-service.yaml. В отличие от
# server-worker у testing-worker пока нет своей БД — ConfigMap и env
# ограничены Redis-брокером + каналом очереди testing_service.
#
# Параллельность по стендам живёт ВНУТРИ одного процесса, не через несколько
# реплик/подов: `queue_loop.py::run_polling_loop()` запускает каждый забранный
# item своей `asyncio.Task`, не дожидаясь её перед следующим `claim()`.
# Предел параллельности получается сам собой — «один тест на стенд» — потому
# что `claim_next_ready()` отдаёт только `state=ready` item'ы, а очередь по
# конструкции (`services/queue.py`) сериализована по стенду: `ready`
# одновременно может быть не больше одного на стенд. Никакого счётчика,
# который надо было бы держать в синхроне с числом стендов, здесь нет.

apiVersion: v1
kind: ConfigMap
metadata:
  name: testing-worker-config
  namespace: dbos
data:
  APP_ENV: production
  WORKER_LOG_LEVEL: INFO
  # Канал очереди (§5.5 плана миграции): POST /internal/queue/claim и
  # /completed на testing_service. worker поллит это и исполняет тест по SSH.
  TESTING_SERVICE_URL: http://testing-service:8004

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testing-worker
  namespace: dbos
  labels:
    app: testing-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: testing-worker
  template:
    metadata:
      labels:
        app: testing-worker
      annotations:
        # Нет HTTP-probe'ов (taskiq-consumer без FastAPI), симметрично
        # server-worker.
        prometheus.io/scrape: "false"
        dbos.monitoring/source: "taskiq broker db /3"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: testing-worker
          image: dbos/testing-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: testing-worker-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: REDIS_PASSWORD }
            # Отдельный db-index на общем redis-контейнере: /0 — server_worker
            # broker, /1 — auth rate-limit, /2 — secret rate-limit, /3 —
            # testing_service/testing_worker.
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/3"
            # Shared-secret для /internal/queue/claim и /completed на
            # testing_service — см. TESTING_SERVICE_URL в ConfigMap выше.
            - name: TESTING_SERVICE_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: { name: dbos-secrets, key: TESTING_SERVICE_INTERNAL_API_KEY }
          command: ["taskiq", "worker", "src.main:broker"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Память — с запасом на несколько одновременных SSH-сессий (по числу
          # активных стендов пула): вывод каждой копится в памяти целиком до
          # конца теста (см. ssh_executor.py). Стоит свериться с реальным
          # потреблением после первых прогонов и подстроить под фактический
          # размер логов.
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "1Gi" }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
