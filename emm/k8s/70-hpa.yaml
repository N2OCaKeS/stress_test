# Горизонтальное автомасштабирование сервисов: при росте нагрузки k8s
# добавляет реплики (до 5), при спаде — убирает (но не ниже 2 для HA).
# Метрики берёт metrics-server (в k3s встроен). Требует CPU-requests у
# контейнеров (заданы в деплойментах). Stateful (postgres/redis) не масштабируем.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service
  namespace: dbos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
