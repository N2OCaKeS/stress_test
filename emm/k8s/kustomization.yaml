apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dbos

resources:
  - 00-namespace.yaml
  - 10-postgres-auth.yaml
  - 10-postgres-server.yaml
  - 10-postgres-worker.yaml
  - 11-postgres-logging.yaml
  - 12-redis.yaml            # Redis для taskiq broker + slowapi rate-limit storage
  - 13-postgres-secret.yaml
  - 14-keystore-rbac.yaml    # SA + Role get/patch на keystore-Secret каждого сервиса
  - 16-postgres-testing.yaml
  - 20-secrets.yaml          # генерируется scripts/k8s/gen_secrets.sh
  # 45-migrations.yaml СПЕЦИАЛЬНО не подключён: Job'ы immutable и ломают
  # повторный `apply -k`. deploy.sh применяет их явным `kubectl apply -f` после
  # готовности баз и ДО ожидания сервисов (delete по именам обеспечивает
  # идемпотентность). Порядок «postgres ready → migrate Job'ы complete →
  # rollout сервисов» обязателен: auth-service в bootstrap'е делает
  # SELECT count(*) FROM users и крашлупит, если схемы ещё нет. `make
  # k8s-migrate` (kubectl exec) остался ручным fallback'ом, в штатный деплой
  # не входит.
  - 30-logging-service.yaml
  - 40-auth-service.yaml
  - 50-server-service.yaml
  - 60-server-worker.yaml
  - 13-secret-service.yaml
  - 63-testing-service.yaml
  - 70-pdb.yaml              # PodDisruptionBudget на все сервисы с replicas=2
  - 80-networkpolicy.yaml    # default-deny ingress + явные allow между подграфами
  - 50-ingress.yaml          # edge-TLS (dbos-ingress-tls) выписывает cert-manager по 51-ingress-cert.yaml (issuer 91-ca-issuer)
  - 55-swagger-ui.yaml       # общий Swagger UI для трёх сервисов на /docs
  - 65-web-ui.yaml           # nginx-раздача собранного web_ui (SPA) на catch-all /
  - 66-console-proxy.yaml    # веб-прокси графической консоли ВМ (VNC/SPICE) на /vm-console
  - 70-hpa.yaml              # HPA: автомасштабирование сервисов + web-ui (2..5 реплик по CPU)
  - 100-postgres-backup.yaml # CronJob pg_dump для auth/logging кластеров
  - 101-backup-pvc.yaml      # PV под бэкапы (общий на оба CronJob'а)
  - 102-master-keys-backup.yaml  # CronJob daily backup master-ключей + CA
  - 103-secret-full-backup.yaml  # CronJob weekly snapshot Secret'а dbos-secrets
  - 104-pg-restore-drill.yaml    # CronJob monthly pg_restore drill по всем 5 БД
  - 105-offsite-backup.yaml      # ConfigMap dbos-offsite-config (OFFSITE_RSYNC_DEST)
  - 120-rotation-rbac.yaml   # ServiceAccount + Role + RoleBinding для CronJob ротации
  - 121-rotation-cronjob.yaml # CronJob: автоматическая ротация раз в 6 мес (1 янв / 1 июл)

# 91-ca-issuer.yaml и 92-certificates.yaml в этот kustomize НЕ включены —
# их применяет scripts/k8s/install_cert_manager.sh до основного apply,
# потому что они зависят от CRD cert-manager, которого тут ещё нет.

# ConfigMap rotation-scripts собирается из scripts/k8s/*.sh на момент
# `kustomize build` / `kubectl apply -k`. Скрипты приедут в pod как
# /scripts/<name>.sh (см. 121-rotation-cronjob.yaml volumeMount).
#
# disableNameSuffixHash: true — иначе kustomize добавит хэш к имени
# (rotation-scripts-abc12), и CronJob с фиксированным name из volumeMount
# не найдёт ConfigMap. Цена — обновление ConfigMap'а не триггерит
# автоматический rollout, но CronJob и так читает скрипты при каждом запуске.
configMapGenerator:
  - name: rotation-scripts
    files:
      - ../scripts/k8s/rotate_db_passwords.sh
      - ../scripts/k8s/rotate_redis_password.sh
      - ../scripts/k8s/rotate_s2s_keys.sh
      - ../scripts/k8s/rotate_master_key.sh
      - ../scripts/k8s/rotate_secret_master_key.sh
      - ../scripts/k8s/rotate_redis_stash_master_key.sh
      - ../scripts/k8s/_rotation_helpers.sh
      - ../scripts/k8s/backup_secret_full.sh
      - ../scripts/k8s/backup_master_keys.sh
      - ../scripts/k8s/restore_master_keys.sh
      - ../scripts/k8s/pg_restore_drill.sh
      - ../scripts/k8s/smoke_test.sh
      - ../scripts/k8s/test_rotation_safety.sh

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app: rotation-scheduler
