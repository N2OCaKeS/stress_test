name: worker-tests

# Isolated test stack: test DB + test Redis + test runner.
# Usage:
#   docker compose -f tests/docker-compose.test.yml run --rm test-runner
#   docker compose -f tests/docker-compose.test.yml down -v

services:

  test-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: server_worker_db_test
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d server_worker_db_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  test-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  test-runner:
    build:
      context: ..
      dockerfile: tests/Dockerfile.test
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/server_worker_db_test
      TEST_DATABASE_URL: postgresql+psycopg://app_user:app_password@test-postgres:5432/server_worker_db_test
      REDIS_URL: redis://test-redis:6379/0
      SERVER_SERVICE_URL: http://not-used-in-smoke
      AUTH_SERVICE_URL: http://not-used-in-smoke
      LOGGING_SERVICE_URL: http://not-used-in-smoke
      WORKER_BOT_TOKEN: dummy-test-token
      PYTHONPATH: /app
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    volumes:
      - .:/app/tests
      - ../src:/app/src
      - ../alembic.ini:/app/alembic.ini:ro
    command: ["pytest", "tests/", "-v", "--tb=short"]
