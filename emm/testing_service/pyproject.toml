[tool.poetry]
name = "testing-service"
version = "0.1.0"
description = "DBOS testing_service — test catalog, queue, runs, STP/Zephyr/Confluence integration (allta_app migration)"
authors = []
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.12"
uvicorn = { version = "0.34.0", extras = ["standard"] }
sqlalchemy = "2.0.40"
psycopg = { version = "3.2.6", extras = ["binary"] }
pydantic = "2.11.3"
pydantic-settings = "2.8.1"
alembic = "1.15.2"
httpx = "0.28.1"
slowapi = "0.1.9"
cryptography = "44.0.3"
# testing_worker (отдельный top-level пакет, ../testing_worker) держит
# taskiq/taskiq-redis для брокера. Здесь redis-клиент используется напрямую
# для best-effort PING в /ready и как опциональный backend slowapi
# (RATE_LIMIT_STORAGE_URI=redis://...) — версия ^6.0 выбрана исторически
# ради совместимости с taskiq-redis 1.1.0, когда брокер ещё жил в этом же
# пакете; несовпадение версий с остальными сервисами (5.2.1) не страшно —
# они не шарят Python-процесс.
redis = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "^1.0"
httpx = "0.28.1"
requests = "^2.32"
hypothesis = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
asyncio_mode = "auto"
