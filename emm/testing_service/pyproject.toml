[tool.poetry]
name = "testing-service"
version = "0.1.0"
description = "DBOS testing_service — test catalog, queue, runs, STP/Zephyr/Confluence integration (allta_app migration)"
authors = []
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.12"
uvicorn = { version = "0.34.0", extras = ["standard"] }
sqlalchemy = "2.0.40"
psycopg = { version = "3.2.6", extras = ["binary"] }
pydantic = "2.11.3"
pydantic-settings = "2.8.1"
alembic = "1.15.2"
httpx = "0.28.1"
slowapi = "0.1.9"
# taskiq-redis 1.1.0 требует redis>=6,<7 — версия выше, чем 5.2.1 у
# остальных сервисов (secret_service/server_service), потому что только
# у testing_service redis-клиент используется и напрямую (health-ping), и
# как зависимость taskiq-брокера. Несовпадение версий между сервисами не
# страшно — они не шарят Python-процесс.
redis = "^6.0"
taskiq = "0.11.18"
taskiq-redis = "1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "^1.0"
httpx = "0.28.1"
requests = "^2.32"
hypothesis = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
asyncio_mode = "auto"
