# Реальный каталог тестов + стенд, портированные из allta_app (dev_allta_app).
#
# Источники (ветка dev_allta_app):
#   - allta_app/backup_image.py       — argparse-флаги + построение строки
#     аргументов теста ("dates"), которую видит запускаемый на стенде скрипт.
#   - allta_app/allta_image_conf.py   — словари topics/branches/tests/
#     stands_groups/tests_case_zefir_key (группировка, git-ветка с кодом
#     теста, соответствие Zephyr test case).
#   - allta_app/starter.sh            — на стенде клонирует ветку монорепо
#     (`category`), гоняет `prepare.sh` и в конце запускает generic
#     `python3 run.py -n <dates_filename> [-kn|-bl|-oom "$5"]`.
#   - `<branch>/run.py` В КАЖДОЙ ветке монорепо — читает файл dates.conf как
#     сырую строку и подставляет её целиком в РЕАЛЬНЫЙ тестовый скрипт
#     (`psb_run.py`, `fsb_run.py`, `test_run.py`, ...), импортируя
#     `VENV_PATH` из своего `*_conf.py`. Только ветка `postgresql` имеет
#     собственную развилку `-kn/-bl/-oom` внутри `run.py` (диспетчер на
#     `diff_kernel_quantity.py`/`bl_run.py`/`oom_run.py`/`psb_run.py`), во
#     всех остальных ветках `run.py` — чистый passthrough на один жёстко
#     заданный скрипт.
#
# Архитектура исполнения (пересмотрена — см. отчёт): `testing_worker`
# БОЛЬШЕ НЕ вызывает конечный тестовый скрипт напрямую. Venv, `cd` в ветку,
# имя скрипта — всё это остаётся внутри `starter.sh`/`run.py` каждой ветки,
# вне периметра testing_service. `command` ниже — это содержимое файла
# `dates_<queue_item_id>.conf`, которое `testing_worker` кладёт по SFTP на
# стенд (`/home/u/<файл>`) ПЕРЕД единственным SSH-вызовом
# `sudo bash /home/u/starter.sh <category> <git_token> <dates_filename> <RC>
# <starter_suffix>` (см. testing_service `services/queue.py::claim_next` и
# testing_worker `services/queue_loop.py`/`services/ssh_executor.py`).
#
# `category` = git-ветка монорепо stress_test с реальным кодом теста
# (`branches` dict из allta_image_conf.py) — совпадает с конвенцией из
# корневого CLAUDE.md ("postgresql/balance/", "kernel/fill.py" и т.п.) и
# подставляется в `starter.sh` буквально как позиционный `$1` (branch).
#
# `starter_suffix` = позиционный `$5` у `starter.sh` (`kernel`/`balance`/
# `oom`/`null`) — определяет, каким флагом `run.py` в клонированной ветке
# позовёт конечный скрипт (`-kn`/`-bl`/`-oom`/ничего). Источник —
# `backup_image.py` `remote_test_run()`: `args.DB_KERNELS in ('psql',
# 'tantor')` → отдельный 4-фазный grub-цикл (`postgresql.kernels`/
# `postgresql.tantor_kernels` ниже, `readiness: draft` — не сводится к одной
# команде), `elif args.PSQL_BALANCE:` → `"balance"` (буквально литерал, не
# значение флага — задокументированный баг легаси, отсюда `starter_suffix:
# balance` и у info-sys/info-sys-orel), `elif args.PSQL_OOM:` → `"oom"`,
# иначе — суффикс не передаётся (`null`).
#
# `full_name` = человеческое имя теста ровно как в `tests`/`branches` dict
# легаси-конфига (сознательно не переведено/не переформулировано — так его
# знают QA-инженеры).
#
# `matrix_label` = сокращение того же имени для заголовка строки СТП-матрицы,
# дословно из легаси `allta_image_conf.py::testname_columns` ("file system
# benchmark. EXT4" → "FS_EXT4"). `zefir.py:329-330` переименовывал колонки
# этим словарём ПЕРЕД сортировкой, поэтому в матрице строки упорядочены по
# сокращению, а не по полному имени — `services/stp_matrix.py` повторяет это.
# Легаси покрывал сокращениями 63 теста, из них 61 есть здесь (нет "OS usage"
# и "file system benchmark. OCFS2 parsec" — их нет и в этом каталоге).
#
# `changelog_component` = компонент, по которому тест попадает в СТП со
# `scope=changelog`. Источник — легаси `tests_list` (`allta_image_conf.py:
# 109-119`): словарь «компонент → список тестов», по ключам которого
# `changelog_testcycle_handler` фильтрует состав ответом changelog-сервиса.
# Десять значений, буквально ключи `tests_list`: "PostgreSQL", "Файловые
# системы", "Системные службы", "UnixBench", "FreeIPA", "Parsec", "Apache",
# "Docker/Podman/LXC", "Qemu/KVM/Libvirt", "Network". НЕ то же самое, что
# `category` (та — git-ветка монорепо с кодом теста): например
# `cluster_file_systems.*` и `kernel.xfs_memleak` лежат в своих ветках, но
# changelog'ом отслеживаются как "Файловые системы" и "Системные службы".
#
# `readiness: ready`  — реально исполняемый скрипт (`git show <branch>:<путь>`)
#   и его argparse дочитаны, каждый токен команды либо литерал напрямую из
#   backup_image.py, либо значение из closed enum (`choices=[...]`) целевого
#   скрипта с однозначным соответствием full_name → значение.
# `readiness: draft`  — по одной из причин: (а) значение зависит от
#   `-vbox {args.TCYCLE.split('_')[0]}` — TCYCLE это СТП-поле (`-tcyc`,
#   test-cycle-name), исключённое из command по утверждённому решению
#   (домен stp_test_runs), а внешний вызывающий (планировщик, вне этих двух
#   файлов) нигде не показывает формат TCYCLE. Лучшее предположение — что
#   первый `_`-сегмент TCYCLE это версия релиза (RC): подтверждается тем,
#   что `virt/test_run.py` называет ровно этот параметр `rc_vbox`, а
#   `parsec/ps_run.py` независимо делает `rc=str(args.TCYC).split('_')[0]`
#   для той же Digsig-развилки — НЕ подтверждено литералом в backup_image.py
#   самом по себе; (б) многошаговый сценарий (`db_kernel_changer` — 4 фазы
#   grub maxcpus + reboot), не сводится к одной команде; (в) легаси-баг —
#   транскрипция дословна и детерминирована, но реальный скрипт откажется
#   стартовать (не хватает required-аргумента либо флаг ему неизвестен).
#
# `-tcv {RC}` (test cycle version = версия релиза) присутствует практически
# во всех ветках `dates` в backup_image.py — универсальный суффикс команды.
# `-sn {ST}` (`args.ST`, dest численного `-sn/--stand-num`, 1..14 — НЕ то же
# самое, что `args.STAND`, которое просто строка вида "stand4" для
# `stands_ip`/сообщений) присутствует почти везде тоже — смоделирован как
# `variable_code: STAND` (единственная существующая "стенд"-переменная
# testing_service). Резолвер — `services/launch_context.py::stand_number`:
# берёт цифры из `test_stands.legacy_token`, то есть отдаёт именно "голый"
# номер, как требует `choices=[...]` целевых скриптов.
#
# Jira/Confluence-флаги (`--username`/`--token`/`--confluence-space`/
# `--confluence-parent-page`/`--confluence-new-page`/`-fti`/`-tcyc`/`-tcas`/
# `-ba`, литералы дословно из `backup_image.py:293-297,304-310`) — вернулись
# в начало command как безопасные плейсхолдеры (`"none"`), потому что
# некоторые легаси-скрипты (например `bl_run.py`) объявляют их в своём
# argparse как `required=True`, а testing_service намеренно НЕ хочет, чтобы
# сам конечный скрипт стучался в Jira/Confluence — своя репортинг-логика уже
# есть отдельно (§6.3 ALLTA MIGRATION.md). Резолв этих флагов реальными
# credential'ами (`source=secret_service` в конструкторе слотов, §3.5 плана)
# НЕ реализован — открытый пункт, см. отчёт. `overflow.*` — тесты из
# отдельной ветки (`ovf_run.py`), где легаси не подставляет confluence-*
# поля вообще (`backup_image.py:354-355`), поэтому их плейсхолдер-набор
# короче (без `--confluence-*`).
#
# Zephyr-ключи (tests_case_zefir_key) НЕ импортированы этим файлом — в схеме
# test_definitions нет такого поля, зато есть отдельная таблица
# `stp_test_cases.zephyr_id` (join по code) — полная таблица соответствий
# code → BT-Txxx приведена в отчёте obsidian/reports/, заводить их — отдельный
# скрипт/волна.
#
# `pinned_stand_token` вместо `pinned_stand_id` — привязка теста к стенду
# перенесена из легаси `stands_groups` (`allta_image_conf.py:441-452`, тот же
# набор, что расписан по режимам в `topics`, :416-431). В yaml лежит ИМЯ
# стенда (`stand3`..`stand14`), а не внутренний id: id генерируется на импорте
# и в файле его знать неоткуда. Импортёр находит стенд по
# `test_stands.legacy_token` и кладёт в `pinned_stand_id` его id; если стенда
# с таким именем в этой установке нет — тест создаётся без привязки, и
# импортёр говорит об этом отдельной строкой, а не молчит. 57 тестов из 61
# имеют легаси-привязку; у tantor vanilla/kernels и обоих overflow её не было
# и в легаси (их гоняли вручную).
#
# `-fti` (`FOLDER_TREE_ID`) получил статический `override_value: "none"`.
# Легаси брал его из `cycle_tree_index()` — словаря «версия → id папки
# Zephyr», который наполнял отдельный бот; в emm такого словаря нет и он не
# нужен: конечный скрипт всё равно ходит в Jira с `--username none`, а своя
# отчётность в Zephyr живёт в `services/stp*.py`. Тот же приём, что уже
# применён к `--username`/`--token`/`--confluence-space`/`-ba`.
#
# Остальные четыре переменные (`PARENT_PAGE`, `CONFLUENCE_NEW_PAGE`,
# `TEST_CYCLE_NAME`, `TEST_CASE_NAME`, `STAND`) НЕ имеют `override_value` — они
# зависят от РЦ/ядра/режима/стенда конкретного запуска и считаются в
# `services/launch_context.py` в момент `claim_next`, буквально по формулам
# легаси. `STAND` при этом требует, чтобы у стенда был заполнен
# `legacy_token`: целевые скрипты объявляют `-sn` через
# `choices=['1','3','4',…]` и голого номера, кроме как из имени стенда, взять
# неоткуда.

stands:
  # `legacy_token` — имя стенда в allta_app (`stand3`..`stand14`). Здесь null
  # сознательно: единственный инвентаризированный в dev сервер —
  # `test-server-01` из `emm/scripts/seed_dev.py`, обычный SSH-таргет, а не
  # какой-то из легаси-стендов, и угадывать за владельца нечего. Пока поле
  # пустое, 57 тестов импортируются без `pinned_stand_id` (импортёр перечислит
  # их явно), а `-sn` для них не собирается. Проставить имя можно либо прямо
  # здесь, либо флагом `--stand-legacy-token` (по образцу
  # `--override-stand-server-id`), либо PATCH /test-stands/{id}.
  - server_id: srv_f1af39a9541f7a396e607df8faacf54f
    legacy_token: null
    queue_enabled: true
    is_active: true

