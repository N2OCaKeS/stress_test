<!doctype html>
<html lang="ru" data-theme="vscode-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP для SPA. Прод-бандл vite — только внешние модули (один
      <script type="module" src="/assets/…">), inline-скриптов нет, поэтому
      script-src 'self' без 'unsafe-inline' ничего не ломает. API и будущий
      console-WS живут на том же origin (VITE_API_BASE_URL по умолчанию /api),
      так что connect-src 'self' покрывает и http, и ws/wss того же хоста —
      host-wildcard ws:/wss: не нужен.

      style-src 'unsafe-inline' — Tailwind / Radix UI кладут inline-стили
      через style="..." при анимациях popover/dialog. nonce'ы для них
      настраивать нерентабельно.

      Это meta-CSP: работает как промежуточный слой, пока у web_ui нет
      собственной prod-раздачи (nginx/ingress). Через <meta> не действуют
      frame-ancestors, X-Frame-Options, X-Content-Type-Options,
      Referrer-Policy и Permissions-Policy — их надо выставлять HTTP-
      заголовками на раздающем слое, когда он появится. frame-ancestors
      оставлен в строке как намерение, но реально кликджекинг закроет только
      заголовок X-Frame-Options: DENY на http-слое.

      В dev Vite инжектит HMR-клиент и ws://127.0.0.1:5173 — там meta-CSP бы
      мешал, но vite-dev отдаёт index.html минуя prod-сборку и сам управляет
      заголовками, поэтому этот тег на dev не влияет на HMR.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://localhost:3000 http://10.177.103.10:3000; font-src 'self'; connect-src 'self' http://localhost:3000 http://10.177.103.10:18181 http://10.177.103.10:3000; frame-src http://localhost:3000 http://10.177.103.10:18181 http://10.177.103.10:3000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EMM — Easy Machine Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
