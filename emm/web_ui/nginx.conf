# Раздача собранного SPA (web_ui). API и /docs разводит Ingress по своим
# backend'ам ДО catch-all '/' на этот сервис, поэтому проксировать /api здесь
# не нужно — статика и API живут на одном origin, connect-src 'self' валиден.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Liveness/readiness для k8s-проб.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Публичный корневой сертификат внутреннего CA (EMM Internal CA). Файл
    # монтируется из секрета dbos-ca-key-pair (только ca.crt) в 65-web-ui.yaml.
    # Отдаём как attachment, чтобы браузер скачивал его, а не пытался открыть.
    # Клиент ставит его в доверенные, иначе fetch к /api рвётся на недоверенном TLS.
    location = /emm-ca.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="emm-ca.crt"' always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Старый путь раздачи — держим как алиас на тот же файл, чтобы не рвать
    # уже разосланные ссылки. Отдаём под новым именем emm-ca.crt.
    location = /dbos-ca.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="emm-ca.crt"' always;
        add_header Cache-Control "no-cache" always;
        try_files /emm-ca.crt =404;
    }

    # Fingerprinted vite-бандлы (/assets/*) неизменны — кэшируем надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        # SPA-fallback: любой неизвестный путь отдаёт index.html (React Router).
        try_files $uri $uri/ /index.html;

        # index.html не кэшируем — иначе клиент застрянет на старом бандле
        # после деплоя.
        add_header Cache-Control "no-cache" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://localhost:3000 http://10.177.103.10:3000; font-src 'self'; connect-src 'self' http://localhost:3000 http://10.177.103.10:18181 http://10.177.103.10:3000; frame-src http://localhost:3000 http://10.177.103.10:18181 http://10.177.103.10:3000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        # Edge-TLS терминирует Ingress; HSTS дублируем тут для defense-in-depth
        # и паритета с backend SecurityHeadersMiddleware.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
}
