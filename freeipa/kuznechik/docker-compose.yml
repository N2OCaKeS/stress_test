---
version: '3'
services:
  master:
    image: astra/locust:master
    hostname: master
    restart: always
    networks:
      - timenet
    ports:
      - 8089:8089
      - 127.0.0.1:5557:5557
    volumes:
      - ./:/mnt/locust
    command: >
      --locustfile /mnt/locust/kuznechik.py
      --master
      --host http://master:8089
      --grafana-url=http://grafana:3000/
      --pghost=postgres
      --pgport=5432
      --pgpassword=postgres
      --pguser=postgres
      --timescale

  worker:
    image: astra/locust:master
    restart: always
    networks:
      - timenet
    volumes:
      - ./:/mnt/locust
    environment:
      - LOCUST_PROCESSES=${LOCUST_PROCESSES:-1}
    command: >
      --locustfile /mnt/locust/kuznechik.py
      --worker
      --master-host master
      --grafana-url=http://grafana:3000/
      --pghost=postgres
      --pgport=5432
      --pgpassword=postgres
      --pguser=postgres
      --timescale
    # dns:
    #   - 10.191.0.150

  postgres:
    image: astra/timescale
    restart: always
    hostname: postgres
    networks:
      - timenet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
      # remove the 127.0.0.1 to expose postgres to other machines (including load gen workers outside this machine) 
      - 127.0.0.1:5432:5432
    environment:
      # change the password if you intend to expose postgres to other machines
      - POSTGRES_PASSWORD=postgres
      - TIMESCALEDB_TELEMETRY=off

  grafana:
    image: astra/grafana
    hostname: grafana
    restart: always
    ports:
      - 3000:3000
    networks:
      - timenet
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      # these settings are not particularly safe, dont go exposing Grafana externally without changing this.
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_LOG_LEVEL=warn # reduce log spamming. Remove this if you need to debug grafana.
      - PGPASSWORD=postgres

  prometheus:
    image: astra/prometheus
    hostname: prometheus
    restart: always
    ports:
      - 9090:9090
    networks:
      - timenet
    volumes:
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
      - --web.enable-admin-api

networks:
  timenet: null

# Grafana and PostgreSQL data is kept in persistent storages
volumes:
  postgres_data: null
  grafana_data: null
  prometheus_data: null
