version: '3'

services:
  devpi:
    build:
      context: .
    ports:
      - "3141:3141"
    volumes:
      - devpi_data:/data
      - /home/u/tokens.json:/git/tokens.json
    env_file:
      - .env
    restart: always

volumes:
  devpi_data:  
    driver: local
    driver_opts:
      type: none
      device: ${DEVPI_DATA_DIR}
      o: bind
