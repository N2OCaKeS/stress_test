[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devpi-allta-auth"
version = "0.1.0"
description = "devpi-server authentication plugin for Allta Auth API"
requires-python = ">=3.9"

[project.entry-points."devpi_server"]
allta_auth = "devpi_allta_auth.plugin"
