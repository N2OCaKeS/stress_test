- name: Cleanup
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Remove signals
      file:
        path: signals/
        state: absent


- name: Set hosts on all VMs
  hosts: all
  gather_facts: no
  vars_files: vars.yml
  tasks:
    - name: Set hosts on VMs
      import_tasks: '{{ playbook_dir }}/tasks/set_hosts.yml'
      when: vm.lvirt


- name: Setup contrprimer
  hosts: all
  strategy: free
  gather_facts: no # do not modify
  vars_files: vars.yml
  tasks:
    - name: Gathering info for 'ansible_play_hosts' variable
      setup:
        gather_subset: '!all,!min'
 
    - name: Setup domain
      include_role:
        name: domain
      when: 'inventory_hostname == "domain"'

    - name: Setup servers
      include_role:
        name: server
      when: 'inventory_hostname in groups.databases'

    - name: Setup load balancers for databases
      include_role:
        name: load_balancer_db
      when: 'server.pg.load_balancing.enabled and inventory_hostname in groups.load_balancers_db'

    #- name: Setup load balancers for web
