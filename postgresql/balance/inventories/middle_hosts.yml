all:
  vars:
    astra_domain: balance.rbt
    debian_linux: false
    no_purge: true
    repo_pakages: true
    ansible_ssh_pass: 1
    ansible_ssh_user: u
    iface_name: ${if_name}
  children:

    servers:
      hosts:
        domain:
          ansible_host: 10.177.103.110
          domain_name: dcfreeipa

      children:
        # web_servers:
        #   hosts:
        #     placeholder_host: {}
        # load_balancers_web:
        #   hosts:
        #     placeholder_host: {}

        databases:
          hosts:
            database:
              ansible_host: 10.177.103.111
              domain_name: database1

            database_2:
              ansible_host: 10.177.103.112
              domain_name: database2

            database_3:
              ansible_host: 10.177.103.113
              domain_name: database3

        load_balancers_db:
          vars:
            virtual_domain_name: pgpool
            delegate_ip: 10.177.103.131
          hosts:
            lb_db:
              ansible_host: 10.177.103.141
              domain_name: lbdb1

            lb_db_2:
              ansible_host: 10.177.103.142
              domain_name: lbdb2

            lb_db_3:
              ansible_host: 10.177.103.143
              domain_name: lbdb3

