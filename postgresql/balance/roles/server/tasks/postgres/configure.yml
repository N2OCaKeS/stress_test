- name: Create users
  become: yes
  become_user: postgres
  vars:
    users: "{{ [domain.user_template] | product(range(domain.num_of_users)) | map('join') }}"
  tasks:
    - name: Create PostgreSQL user
      postgresql_user:
        name: '{{ item }}'
        role_attr_flags: LOGIN
        port: '{{ server.pg.port }}'
      loop: '{{ [domain.admin] + users }}'
      when: inventory_hostname == groups.databases.0 or not server.pg.replication.enabled
      register: user_creation_result

    - name: Verify PostgreSQL user creation
      postgresql_info:
        db: postgres
        query: "SELECT 1 FROM pg_roles WHERE rolname='{{ item }}';"
        port: '{{ server.pg.port }}'
      loop: '{{ [domain.admin] + users }}'
      register: user_verification_result
      when: user_creation_result is changed

    - name: Fail if user not created
      fail:
        msg: "User {{ item.item }} was not successfully created."
      loop: '{{ user_verification_result.results }}'
      when: item.queries[0] is not defined

- name: Load balancing
  block:
    - name: Create pgpool_recovery extension
      become: yes
      become_user: postgres
      postgresql_ext:
        port: '{{ server.pg.port }}'
        db: template1
        name: pgpool_recovery

    - name: Create online_recovery and pgpool_remote_start script
      template:
        src: '{{ item }}.sh.j2'
        dest: '/var/lib/postgresql/{{ server.pg.version }}/{{ server.pg.db_name }}/{{ item }}'
        owner: postgres
        group: postgres
        mode: 'u=rwx,g=rx,o=rx'
      loop: ['online_recovery', 'pgpool_remote_start']
  when: server.pg.load_balancing.enabled

- name: Replication
  block:
    - name: Clean postgresql.auto.conf
      lineinfile:
        path: '{{ pg_data_path + "/postgresql.auto.conf" }}'
        regexp: '.*{{ item }}.*'
        state: absent
      loop: ['primary_conninfo', 'primary_slot_name']

    - name: Further setup replication
      vars:
        pg_data_path: '{{ pg_data_path }}'
      import_tasks: replication.yml
  when: server.pg.replication.enabled
