# parameter
# value

- name: Set pgpool {{ parameter }}
  delegate_to: '{{ lb_db_host }}'
  become: yes
  lineinfile:
    path: /etc/pgpool2/pgpool.conf
    regexp: '^{{ parameter }}'
    line: '{{ parameter }} = {{ value }}'
  loop: '{{ groups.load_balancers_db }}'
  loop_control:
    loop_var: lb_db_host

- name: Reload config on all pgpool nodes
  delegate_to: '{{ groups.load_balancers_db[0] }}'
  expect:
    command: >-
      /usr/sbin/pcp_reload_config -h {{ virtual_domain_name }}.{{ astra_domain }}
      -U {{ domain.admin }} --scope=cluster
    responses:
      'Password:': '{{ domain.admin_password }}'
      'Пароль:': '{{ domain.admin_password }}'