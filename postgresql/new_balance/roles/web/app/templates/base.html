<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Protopack{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; font-size: 14px; background: #f5f5f5; color: #222; }

    header {
      background: #1a3a5c;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a { color: #aed6f1; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    .mac-badge {
      background: #e74c3c;
      color: #fff;
      padding: 3px 10px;
      border-radius: 3px;
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    main { max-width: 1200px; margin: 24px auto; padding: 0 16px; }

    h1 { font-size: 18px; margin-bottom: 16px; color: #1a3a5c; }
    h2 { font-size: 15px; margin: 20px 0 10px; color: #1a3a5c; }

    table { width: 100%; border-collapse: collapse; background: #fff; }
    th { background: #1a3a5c; color: #fff; text-align: left; padding: 8px 10px; }
    td { padding: 7px 10px; border-bottom: 1px solid #ddd; vertical-align: top; }
    tr:hover td { background: #eaf4fb; }

    a.row-link { color: #1a3a5c; text-decoration: none; }
    a.row-link:hover { text-decoration: underline; }

    .meta { color: #666; font-size: 12px; margin-bottom: 16px; }
    .tag {
      display: inline-block;
      background: #d5e8f5;
      padding: 2px 7px;
      border-radius: 3px;
      margin: 2px;
      font-size: 12px;
    }
    .empty { color: #999; font-style: italic; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>
<header>
  <div>
    <a href="/">Protopack IS</a>
    {% if request.path != '/' %}
      &nbsp;/&nbsp; {% block breadcrumb %}{% endblock %}
    {% endif %}
  </div>
  <div>
    <span class="mac-badge">МРД</span>
    &nbsp; пользователь: <strong>{{ g.user }}</strong>
  </div>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
