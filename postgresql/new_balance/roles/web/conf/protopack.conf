# Apache2 vhost для ИС Protopack (Astra Linux, AstraMode + FreeIPA/Kerberos)
#
# ВАЖНО: WSGI работает во встроенном (embedded) режиме — без WSGIDaemonProcess/
# WSGIProcessGroup. Директивы AstraMode привязывают MAC-метку аутентифицированного
# пользователя к процессу-обработчику MPM (mpm_prefork, см. apache.py::settings()).
# Если подключить Flask через отдельный WSGIDaemonProcess, он будет одним и тем же
# долгоживущим процессом для всех пользователей — с одной и той же MAC-меткой,
# и МРД-фильтрация в ЗСУБД перестанет работать. Поэтому здесь только
# WSGIScriptAlias: приложение выполняется прямо в дочернем процессе Apache,
# который принял соединение и прошёл GSSAPI-аутентификацию.
#
# Требует: mod_wsgi (embedded), mod_auth_gssapi, mod_parsec (AstraMode), mpm_prefork.
#
# Установка (см. new_balance/roles/web/apache.py):
#   cp protopack.conf /etc/apache2/sites-available/protopack.conf
#   a2ensite protopack && a2dissite 000-default
#   systemctl restart apache2

<VirtualHost *:80>
    # Должно совпадать с принципалом keytab (HTTP/web1.balance.rbt) —
    # имя резолвится автоматически, т.к. web1 сам регистрирует DNS-запись
    # при вводе в домен FreeIPA (astra-freeipa-client).
    ServerName web1.balance.rbt

    WSGIScriptAlias / /opt/protopack/wsgi.py

    # Один процесс = одна MAC-метка = один Python-интерпретатор.
    # Заставляет mod_wsgi использовать главный интерпретатор Apache,
    # а не создавать под-интерпретатор — важно для C-расширений (psycopg2, GSSAPI).
    WSGIApplicationGroup %{GLOBAL}

    # Передаём Authorization-заголовок в WSGI (нужен для GSSAPI)
    WSGIPassAuthorization On

    <Directory /opt/protopack>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Тестовый статический контент для классической файловой МРД (см. apache.py,
    # шаг "deploy mrd test file"): доступ регулируется меткой файла (pdpl-file),
    # а не кодом Flask. Если метка сессии пользователя ниже метки файла — Apache
    # вернёт 404, т.к. процессу с недостаточным уровнем сам файл не виден.
    Alias /files /var/www/html

    <Directory /var/www/html>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Аутентификация по Kerberos (FreeIPA)
    <Location />
        AuthType GSSAPI
        AuthName "Protopack Information System"

        # Keytab для HTTP-принципала: HTTP/web1.balance.rbt@BALANCE.RBT
        # Создаётся: ipa-getkeytab -s dcfreeipa.balance.rbt -p HTTP/web1.balance.rbt -k /etc/apache2/protopack.keytab
        GssapiCredStore keytab:/etc/apache2/protopack.keytab

        # Имя пользователя из Kerberos → REMOTE_USER (без realm)
        GssapiLocalName On

        # Разрешить только аутентифицированных пользователей домена
        Require valid-user
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/protopack_error.log
    CustomLog ${APACHE_LOG_DIR}/protopack_access.log combined
</VirtualHost>
