- name: Check kernel version
  shell:
    cmd: uname -r
  register: kernel_version

- debug:
    var: kernel_version.stdout

- debug:
    msg: "{{ KERNEL_VERSION }}"

- block:
  - name: Change kernel default version
    shell:
      cmd: sudo cat /boot/grub/grub.cfg | grep menuentry_id | awk '{print $17}' | grep {{ KERNEL_VERSION }} | tr -d "'"
    register: new_kernel_version_for_grub_file

  - name: Sed DEFAULT_KERNEl
    become: true
    shell:
      cmd: sed -i 's/GRUB_DEFAULT=.*/GRUB_DEFAULT={{ new_kernel_version_for_grub_file.stdout }}/' /etc/default/grub && update-grub
  
  - name: Reboot after change kernel version
    become: true
    shell:
      cmd: sleep 3 && reboot
    async: 1
    poll: 0

  - name: Wait after reboot
    wait_for_connection:
      # host: "{{ HOST }}"
      # state: started
      delay: 10
      timeout: 180
    # delegate_to: localhost
  when: kernel_version.stdout != KERNEL_VERSION

